<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="uRzjuxf6dyEpguKoOdQ4Ni">
<head data-page-node-id="vQHGyhl83qwejJ2KVDxuPT">
    <meta charset="UTF-8" data-page-node-id="o0DI9A05Lj7iMwSFxUc60P">
    <title>DPG</title>
    <link rel="shortcut icon" href="favicon.ico" data-page-node-id="rfGFCoqyDwos3fD4dG3JJt">
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --input-bg: #161b22;
            --input-border: #30363d;
            --input-focus: #58a6ff;
            --button-bg: #21262d;
            --button-hover: #30363d;
            --button-border: #363b42;
            --card-bg: #161b22;
            --card-border: #30363d;
            --card-hover: #21262d;
            --card-min-width: 320px;
            --success: #2ea043;
            --error: #f85149;
            --fullscreen-bg: rgba(13, 17, 23, 0.98);
            --fullscreen-btn-bg: rgba(33, 38, 45, 0.9);
            --fullscreen-btn-border: #30363d;
            --fullscreen-btn-color: #c9d1d9;
            --fullscreen-btn-hover-bg: rgba(48, 54, 61, 0.95);
            --box-shadow: 0 6px 32px 0 rgba(0,0,0,0.28);
            --toast-bg: #161b22;
            --toast-border: #30363d;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
        }
        .control-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #0d1117;
            border: 0px solid var(--card-border);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .control-bar input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 6px;
            flex: 1;
            min-width: 100px;
            font-size: 14px;
        }
        .control-bar select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 6px;
            min-width: 100px;
            font-size: 14px;
            cursor: pointer;
        }
        .control-bar select:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }
        .control-bar input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }
        .control-bar button {
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-color);
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .control-bar button:hover {
            background: var(--button-hover);
            border-color: var(--input-focus);
        }
        .status {
            margin-left: auto;
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.8;
        }
        /* 滑块控制 */
        .size-slider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 10px;
            min-width: 200px;
        }
        .size-slider label {
            font-size: 13px;
            color: var(--text-color);
            opacity: 0.8;
        }
        .size-slider input[type=range] {
            width: 120px;
            background: var(--input-bg);
            height: 6px;
            border-radius: 3px;
            -webkit-appearance: none;
        }
        .size-slider input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--input-focus);
            cursor: pointer;
            border: 2px solid var(--input-border);
        }
        .size-slider span {
            font-size: 13px;
            min-width: 45px;
            text-align: center;
        }
        /* 卡片容器 - 自适应网格 */
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .client-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.1s, border-color 0.2s;
            cursor: pointer;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }
        .client-card.hidden-card {
            display: none !important;
        }
        .client-card:hover {
            transform: translateY(-2px);
            outline: 1px solid var(--input-focus);
            outline-offset: 2px;
        }
        .client-card .img-container {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .client-card .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.15s ease;
        }
        .client-card-footer {
            padding: 10px 12px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .client-id {
            font-weight: 600;
            font-size: 14px;
            word-break: break-all;
            cursor: pointer;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .client-id:hover {
            text-decoration: none;
            background-color: var(--button-hover);
        }
        
        .client-id.editing {
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            outline: none;
            white-space: normal;
            color: var(--text-color);
            font-size: 14px;
            padding: 2px 4px;
            width: auto;
            min-width: 50px;
            max-width: 95%;
            box-sizing: border-box;
        }
        
        .refresh-btn {
            background: transparent;
            border: 1px solid var(--button-border);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .refresh-btn:hover {
            background: var(--button-hover);
        }
        .card-tools {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card-tool-btn {
            background: transparent;
            border: 1px solid var(--button-border);
            color: var(--text-color);
            width: 26px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
        }
        .card-tool-btn:hover {
            background: var(--button-hover);
            border-color: var(--input-focus);
        }
        .card-tool-btn.active {
            background: var(--button-border);
            border-color: var(--input-focus);
            color: #fff;
        }
        .color-popover {
            position: absolute;
            z-index: 1500;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            box-shadow: var(--box-shadow);
            display: none;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
        }
        .color-popover.visible {
            display: flex;
        }
        .color-palette {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }
        .color-swatch {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.15);
            box-sizing: border-box;
        }
        .color-swatch:hover {
            transform: scale(1.15);
        }
        .color-popover input[type="color"] {
            width: 100%;
            height: 28px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            background: var(--input-bg);
            cursor: pointer;
        }
        .color-popover-actions {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }
        .color-popover-actions button {
            flex: 1;
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .color-popover-actions button:hover {
            background: var(--button-hover);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-color);
            opacity: 0.7;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            border: 1px solid var(--toast-border);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: var(--box-shadow);
            z-index: 2000;
            font-size: 14px;
            display: none;
            max-width: 300px;
            text-align: center;
        }
        .toast.success {
            border-color: var(--success);
        }
        .toast.error {
            border-color: var(--error);
        }
        /* 全屏样式 */
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--fullscreen-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .fullscreen img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.2s ease;
            box-shadow: var(--box-shadow);
            border: 2px solid var(--card-border);
            border-radius: 8px;
        }
        .fullscreen-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1001;
        }
        .fullscreen-btn {
            background-color: var(--fullscreen-btn-bg);
            border: 1px solid var(--fullscreen-btn-border);
            color: var(--fullscreen-btn-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            box-shadow: var(--box-shadow);
        }
        .fullscreen-btn:hover {
            background-color: var(--fullscreen-btn-hover-bg);
            transform: scale(1.1);
        }
        .fullscreen-follow-btn {
            display: none;
        }
        .fullscreen-follow-btn.active {
            background-color: #238636;
            border-color: #2ea043;
            color: #fff;
        }
        /* 单卡内部：底部极简截图刷新进度条（无数字，滑动动画表现“正在刷新”） */
        .refresh-progress-bar {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 3px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 50;
        }
        .refresh-progress-bar.active {
            opacity: 1;
        }
        .refresh-progress-bar .bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 35%;
            background: linear-gradient(90deg, transparent, var(--input-focus), transparent);
            animation: refreshBarSlide 1s linear infinite;
        }
        @keyframes refreshBarSlide {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }
        .fullscreen .cmd-panel, .fullscreen .file-panel, .fullscreen .clipboard-panel {
            position: absolute;
            right: 86px;
            top: 18px;
            z-index: 1002;
            width: 520px;
            max-width: calc(100vw - 140px);
            background: var(--fullscreen-btn-bg);
            border: 1px solid var(--fullscreen-btn-border);
            border-radius: 12px;
            box-shadow: var(--box-shadow);
            padding: 10px;
            display: none;
            color: var(--fullscreen-btn-color);
        }
        .fullscreen .fullscreen-btn.active {
            background-color: #238636;
            border-color: #2ea043;
            color: #fff;
        }
        .fullscreen .auto-refresh-panel {
            position: absolute;
            z-index: 1003;
            width: 260px;
            max-width: calc(100vw - 24px);
            background: var(--fullscreen-btn-bg);
            border: 1px solid var(--fullscreen-btn-border);
            border-radius: 12px;
            box-shadow: var(--box-shadow);
            padding: 12px;
            color: var(--fullscreen-btn-color);
            font-size: 13px;
        }
        .fullscreen .auto-refresh-panel .ar-title { font-weight: 600; margin-bottom: 8px; }
        .fullscreen .auto-refresh-panel .ar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .fullscreen .auto-refresh-panel .ar-slider { flex: 1; accent-color: #238636; cursor: pointer; }
        .fullscreen .auto-refresh-panel .ar-value { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
        .fullscreen .auto-refresh-panel .ar-status { opacity: .8; margin-bottom: 8px; }
        .fullscreen .auto-refresh-panel .ar-hint { opacity: .6; font-size: 11px; line-height: 1.5; }
        .fullscreen .cmd-panel input, .fullscreen .file-panel input, .fullscreen .clipboard-panel textarea {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        .fullscreen .clipboard-panel textarea {
            min-height: 100px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
            scrollbar-width: thin;
            scrollbar-color: var(--input-border) var(--input-bg);
        }
        .fullscreen .clipboard-panel textarea:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.15);
        }
        .fullscreen .clipboard-panel textarea::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .fullscreen .clipboard-panel textarea::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 10px;
        }
        .fullscreen .clipboard-panel textarea::-webkit-scrollbar-thumb {
            background: var(--input-border);
            border-radius: 10px;
            border: 2px solid var(--input-bg);
        }
        .fullscreen .clipboard-panel textarea::-webkit-scrollbar-thumb:hover {
            background: var(--button-hover);
        }
        .fullscreen .cmd-panel button, .fullscreen .file-panel button, .fullscreen .clipboard-panel button {
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .fullscreen .cmd-output, .fullscreen .file-list {
            margin-top: 8px;
            max-height: 440px;
            overflow: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid var(--fullscreen-btn-border);
            border-radius: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.1);
            color: var(--fullscreen-btn-color);
            scrollbar-width: thin;
            scrollbar-color: var(--input-border) var(--input-bg);
        }
        .fullscreen .cmd-output::-webkit-scrollbar,
        .fullscreen .file-list::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .fullscreen .cmd-output::-webkit-scrollbar-track,
        .fullscreen .file-list::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 10px;
        }
        .fullscreen .cmd-output::-webkit-scrollbar-thumb,
        .fullscreen .file-list::-webkit-scrollbar-thumb {
            background: var(--input-border);
            border-radius: 10px;
            border: 2px solid var(--input-bg);
        }
        .fullscreen .cmd-output::-webkit-scrollbar-thumb:hover,
        .fullscreen .file-list::-webkit-scrollbar-thumb:hover {
            background: var(--button-hover);
        }
        .fullscreen .transfer-status {
            display: none;
            margin-top: 8px;
            padding: 10px;
            border: 1px solid var(--fullscreen-btn-border);
            border-radius: 10px;
            background: rgba(0,0,0,0.12);
            color: var(--fullscreen-btn-color);
            font-size: 12px;
        }
        .fullscreen .transfer-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 7px;
        }
        .fullscreen .transfer-bar {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(0,0,0,0.22);
        }
        .fullscreen .transfer-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: #2ea043;
            transition: width 0.16s ease;
        }
        .fullscreen .transfer-status.indeterminate .transfer-bar-fill {
            width: 38%;
            animation: transfer-slide 1.05s linear infinite;
        }
        .fullscreen .transfer-status.error .transfer-bar-fill {
            background: #f85149;
            animation: none;
        }
        .fullscreen .transfer-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
            opacity: 0.9;
        }
        @keyframes transfer-slide {
            from { transform: translateX(-110%); }
            to { transform: translateX(270%); }
        }
        .fullscreen .cursor {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: red;
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            display: none;
        }
        .fullscreen .cursor-info {
            position: absolute;
            left: 15px;
            top: 15px;
            background: var(--fullscreen-btn-bg);
            color: var(--fullscreen-btn-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 11;
            display: none;
        }
        .fullscreen.view-mode img {
            cursor: grab;
        }
        .fullscreen.view-mode img:active {
            cursor: grabbing;
        }
        .fullscreen.control-mode img {
            cursor: none;
        }
        /* 日志弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            width: 80%;
            max-width: 900px;
            max-height: 80%;
            display: flex;
            flex-direction: column;
            box-shadow: var(--box-shadow);
        }
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            margin: 0;
            color: var(--text-color);
        }
        .modal-header button {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
        }
        .modal-body {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-body input, .modal-body select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        
        .modal-body input:focus, .modal-body select:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.15);
        }
        /* 隐藏数字输入框的上下箭头 */
        .modal-body input[type="number"] {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            width: 80px;
            -moz-appearance: textfield; /* Firefox */
        }
        
        .modal-body input[type="number"]::-webkit-inner-spin-button,
        .modal-body input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .modal-body input[type="number"]:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.15);
        }
        .filter-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-row input, .filter-row select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
        }
        .filter-row input[type="number"] {
            width: 80px;
        }
        .filter-row button {
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-color);
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        .filter-row button:hover {
            background: var(--button-hover);
        }
        .logs-content {
            flex: 1;
            overflow: auto;
            padding: 20px;
            font-family: monospace;
            font-size: 12px;
            background: var(--bg-color);
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
        }
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid var(--card-border);
            font-family: monospace;
        }
        .log-entry span.time {
            color: #8b949e;
        }
        .log-entry span.client {
            color: #58a6ff;
        }
        .log-entry span.event-connected {
            color: #2ea043;
        }
        .log-entry span.event-disconnected {
            color: #f85149;
        }
        .log-entry span.ip {
            color: #8b949e;
        }
        .modal-footer {
            padding: 15px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-footer span {
            color: var(--text-color);
            opacity: 0.7;
            margin-right: auto;
        }
        .modal-footer button {
            background: var(--button-bg);

    <script>
        (function() {
            const serverInput = document.getElementById('serverInput');
            const passwordInput = document.getElementById('passwordInput');
            const serverSelect = document.getElementById('serverSelect');
            const delServerBtn = document.getElementById('delServerBtn');
            const connectBtn = document.getElementById('connectBtn');
            const refreshAllBtn = document.getElementById('refreshAllBtn');
            const statusText = document.getElementById('statusText');
            const clientsContainer = document.getElementById('clientsContainer');
            const toast = document.getElementById('toast');

            // 日志相关元素
            const viewLogsBtn = document.getElementById('viewLogsBtn');
            const logsModal = document.getElementById('logsModal');
            const closeLogsModal = document.getElementById('closeLogsModal');
            const closeLogsBtn = document.getElementById('closeLogsBtn');
            const fetchLogsBtn = document.getElementById('fetchLogsBtn');
            const refreshLogsBtn = document.getElementById('refreshLogsBtn');
            const logsContent = document.getElementById('logsContent');
            const logCount = document.getElementById('logCount');
            const logServerInput = document.getElementById('logServerInput');
            const logKeyInput = document.getElementById('logKeyInput');
            const logLimitInput = document.getElementById('logLimitInput');
            const logEventFilter = document.getElementById('logEventFilter');
            const logClientFilter = document.getElementById('logClientFilter');

            // 卡片外观设置
            const showAllBtn = document.getElementById('showAllBtn');
            const CARD_SETTINGS_KEY = 'dpg_card_settings';
            const COLOR_PALETTE = [
                '#58a6ff', '#2ea043', '#f85149', '#d29922', '#a371f7',
                '#3fb950', '#f778ba', '#56d4dd', '#8b949e', '#bd561d',
                '#79c0ff', '#ffa198', '#d2a8ff', '#7ee787', '#ff7b72'
            ];

            // 全局截图缓存
            const SCREENSHOT_MIN_QUALITY = 40;
            const SCREENSHOT_MAX_QUALITY = 70;
            let screenshotQuality = 55;
            let screenshotFastFrames = 0;
            const screenshotCache = new Map(); // clientId -> { url, timestamp, seq }
            const screenshotRequestSeq = new Map(); // clientId -> latest request seq
            const cardInFlight = new Set(); // clientId -> 正在拉取中，防止同一客户端并发拉取（避免目标端堵塞）

            function showToast(message, type = 'success', duration = 2000) {
                toast.textContent = message;
                toast.className = 'toast ' + type;
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                }, duration);
            }

            async function copyTextToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                        return true;
                    } catch (err) {
                        console.warn('Clipboard API failed, trying fallback', err);
                    }
                }
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return successful;
                } catch (err) {
                    document.body.removeChild(textarea);
                    return false;
                }
            }

            function triggerBrowserDownload(blob, filename) {
                const href = URL.createObjectURL(blob);
                const dl = document.createElement('a');
                dl.href = href;
                dl.download = filename || 'download.bin';
                dl.style.display = 'none';
                document.body.appendChild(dl);
                dl.click();
                setTimeout(() => {
                    URL.revokeObjectURL(href);
                    dl.remove();
                }, 1000);
            }

            const cardSizeSlider = document.getElementById('cardSizeSlider');
            const cardSizeValue = document.getElementById('cardSizeValue');
            let currentCardSize = 320;

            function setCardMinWidth(size) {
                currentCardSize = size;
                document.documentElement.style.setProperty('--card-min-width', size + 'px');
                cardSizeValue.textContent = size + 'px';
            }
            setCardMinWidth(currentCardSize);

            cardSizeSlider.addEventListener('input', (e) => {
                setCardMinWidth(parseInt(e.target.value));
            });
            
            // 卡片大小滑块支持滚轮调整
            cardSizeSlider.addEventListener('wheel', (e) => {
                e.preventDefault(); // 防止页面滚动
                
                const step = 10; // 每次滚轮调整的步长
                const delta = e.deltaY > 0 ? -step : step;
                let newValue = parseInt(cardSizeSlider.value) + delta;
                
                // 限制在 min 和 max 范围内
                const min = parseInt(cardSizeSlider.min);
                const max = parseInt(cardSizeSlider.max);
                newValue = Math.min(max, Math.max(min, newValue));
                
                cardSizeSlider.value = newValue;
                setCardMinWidth(newValue);
            }, { passive: false });

            function getAllCardSettings() {
                try {
                    return JSON.parse(localStorage.getItem(CARD_SETTINGS_KEY)) || {};
                } catch (e) {
                    return {};
                }
            }
            function getCardSettings(clientId) {
                return getAllCardSettings()[clientId] || {};
            }
            function saveCardSettings(clientId, settings) {
                const all = getAllCardSettings();
                all[clientId] = { ...all[clientId], ...settings };
                localStorage.setItem(CARD_SETTINGS_KEY, JSON.stringify(all));
            }
            function renameCardSettings(oldId, newId) {
                const all = getAllCardSettings();
                if (all[oldId]) {
                    all[newId] = all[oldId];
                    delete all[oldId];
                    localStorage.setItem(CARD_SETTINGS_KEY, JSON.stringify(all));
                }
            }

            // ---------- 多服务器预设管理 ----------
            const SERVERS_KEY = 'dpg_servers';
            const SERVER_SELECT_KEY = 'dpg_active_server';

            function loadServers() {
                let list = [];
                try { list = JSON.parse(localStorage.getItem(SERVERS_KEY)) || []; } catch (e) { list = []; }
                if (!Array.isArray(list)) list = [];
                // 迁移旧的单一服务器存储
                if (list.length === 0) {
                    const oldAddr = localStorage.getItem('serverAddr');
                    const oldPass = localStorage.getItem('password');
                    if (oldAddr) {
                        list.push({ addr: oldAddr, pass: oldPass || '' });
                        localStorage.setItem(SERVERS_KEY, JSON.stringify(list));
                        localStorage.removeItem('serverAddr');
                        localStorage.removeItem('password');
                    } else {
                        // 全新用户：预置一个默认服务器
                        list.push({ addr: '47.112.187.83:7778', pass: '' });
                        localStorage.setItem(SERVERS_KEY, JSON.stringify(list));
                    }
                }
                return list;
            }

            let servers = loadServers();
            let activeIndex = -1;

            function persistServers() {
                localStorage.setItem(SERVERS_KEY, JSON.stringify(servers));
            }

            function populateServerSelect() {
                const prev = serverSelect.value;
                serverSelect.innerHTML = '';
                if (servers.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '（无预设，请填写后点"新增"）';
                    serverSelect.appendChild(opt);
                } else {
                    servers.forEach((s, i) => {
                        const opt = document.createElement('option');
                        opt.value = String(i);
                        opt.textContent = s.addr || '(空地址)';
                        serverSelect.appendChild(opt);
                    });
                }
                if (servers.length > 0) {
                    let idx = servers.findIndex(s => s.addr === prev);
                    if (idx < 0) idx = Math.max(0, Math.min(activeIndex, servers.length - 1));
                    activeIndex = idx;
                    serverSelect.value = String(idx);
                } else {
                    activeIndex = -1;
                    serverSelect.value = '';
                }
            }

            function applyActiveToInputs() {
                if (activeIndex >= 0 && servers[activeIndex]) {
                    serverInput.value = servers[activeIndex].addr || '';
                    passwordInput.value = servers[activeIndex].pass || '';
                }
            }

            function selectServerByIndex(i) {
                if (i < 0 || i >= servers.length) return;
                activeIndex = i;
                localStorage.setItem(SERVER_SELECT_KEY, servers[i].addr || '');
                applyActiveToInputs();
            }

            // 初始填充
            populateServerSelect();
            const lastAddr = localStorage.getItem(SERVER_SELECT_KEY);
            if (lastAddr && servers.length) {
                const idx = servers.findIndex(s => s.addr === lastAddr);
                if (idx >= 0) selectServerByIndex(idx);
            }
            applyActiveToInputs();

            // 下拉选择 → 切换并自动连接
            serverSelect.addEventListener('change', () => {
                const i = parseInt(serverSelect.value, 10);
                if (!isNaN(i) && i >= 0) {
                    selectServerByIndex(i);
                    loadClients();
                }
            });

            // 连接成功后保存：按地址(IP)去重，已存在则更新密码，不重复添加
            function upsertServer() {
                const addr = serverInput.value.trim();
                const pass = passwordInput.value.trim();
                if (!addr) return;
                let idx = servers.findIndex(s => s.addr === addr);
                if (idx >= 0) {
                    servers[idx].pass = pass; // 已存在：覆盖密码
                } else {
                    servers.push({ addr, pass });
                    idx = servers.length - 1;
                }
                activeIndex = idx;
                persistServers();
                populateServerSelect();
                activeIndex = idx;
                serverSelect.value = String(idx);
                localStorage.setItem(SERVER_SELECT_KEY, addr);
            }

            delServerBtn.addEventListener('click', () => {
                if (activeIndex < 0 || !servers[activeIndex]) { showToast('没有可删除的预设', 'error'); return; }
                const removed = servers[activeIndex].addr;
                servers.splice(activeIndex, 1);
                persistServers();
                if (servers.length === 0) activeIndex = -1;
                else activeIndex = Math.min(activeIndex, servers.length - 1);
                populateServerSelect();
                if (activeIndex >= 0) serverSelect.value = String(activeIndex);
                localStorage.setItem(SERVER_SELECT_KEY, activeIndex >= 0 ? servers[activeIndex].addr : '');
                applyActiveToInputs();
                showToast('已删除预设: ' + removed, 'success');
            });

            function getBaseUrl() {
                let addr = serverInput.value.trim();
                if (!addr) throw new Error('请输入服务器地址');
                if (!addr.startsWith('http')) addr = 'http://' + addr;
                return addr;
            }

            function adjustScreenshotQuality(durationMs) {
                if (durationMs > 1200 && screenshotQuality > SCREENSHOT_MIN_QUALITY) {
                    screenshotQuality = Math.max(SCREENSHOT_MIN_QUALITY, screenshotQuality - 8);
                    screenshotFastFrames = 0;
                } else if (durationMs > 800 && screenshotQuality > SCREENSHOT_MIN_QUALITY) {
                    screenshotQuality = Math.max(SCREENSHOT_MIN_QUALITY, screenshotQuality - 5);
                    screenshotFastFrames = 0;
                } else if (durationMs < 350 && screenshotQuality < SCREENSHOT_MAX_QUALITY) {
                    screenshotFastFrames++;
                    if (screenshotFastFrames >= 5) {
                        screenshotQuality = Math.min(SCREENSHOT_MAX_QUALITY, screenshotQuality + 5);
                        screenshotFastFrames = 0;
                    }
                } else {
                    screenshotFastFrames = 0;
                }
            }

            function getPassword() {
                return passwordInput.value.trim();
            }

            function setStatus(text, isError = false) {
                statusText.textContent = text;
                statusText.style.color = isError ? 'var(--error)' : 'var(--text-color)';
            }

            async function apiExecute(clientId, type, data) {
                const url = `${getBaseUrl()}/api/execute`;
                const body = { client_id: clientId, type, data };
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error(`HTTP ${resp.status}: ${text}`);
                }
                const json = await resp.json();
                if (json.status !== 'success') throw new Error(json.error || '未知错误');
                return json.data;
            }

            async function apiUploadChunk(clientId, sessionId, chunkIndex, chunkBlob) {
                const params = new URLSearchParams({
                    client_id: clientId,
                    session_id: sessionId,
                    chunk_index: String(chunkIndex)
                });
                const resp = await fetch(`${getBaseUrl()}/api/upload_chunk?${params}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/octet-stream' },
                    body: chunkBlob
                });
                if (!resp.ok) {
                    const text = await resp.text();
                    throw new Error(`HTTP ${resp.status}: ${text}`);
                }
                const json = await resp.json();
                if (json.status !== 'success') throw new Error(json.error || '未知错误');
                return json.data;
            }

            // 统一获取截图方法，带缓存
            async function getScreenshot(clientId, forceRefresh = false) {
                const now = Date.now();
                if (!forceRefresh && screenshotCache.has(clientId)) {
                    const cached = screenshotCache.get(clientId);
                    if (now - cached.timestamp < 5000) {
                        return cached.url;
                    }
                    URL.revokeObjectURL(cached.url);
                    screenshotCache.delete(clientId);
                }
                const requestSeq = (screenshotRequestSeq.get(clientId) || 0) + 1;
                screenshotRequestSeq.set(clientId, requestSeq);
                const url = `${getBaseUrl()}/api/screenshot`;
                const startedAt = performance.now();
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ client_id: clientId, quality: screenshotQuality })
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const blob = await resp.blob();
                adjustScreenshotQuality(performance.now() - startedAt);
                const newUrl = URL.createObjectURL(blob);
                if (screenshotRequestSeq.get(clientId) !== requestSeq) {
                    URL.revokeObjectURL(newUrl);
                    const cached = screenshotCache.get(clientId);
                    return cached && cached.seq > requestSeq ? cached.url : null;
                }
                const old = screenshotCache.get(clientId);
                if (old) URL.revokeObjectURL(old.url);
                screenshotCache.set(clientId, { url: newUrl, timestamp: now, seq: requestSeq });
                return newUrl;
            }

            // ---------- 日志功能 ----------
            // 打开日志弹窗
            viewLogsBtn.addEventListener('click', () => {
                logsModal.style.display = 'flex';
                // 默认使用主界面的服务器地址和管理密码
                logServerInput.value = serverInput.value;
                logKeyInput.value = passwordInput.value;
            });

            function closeLogsModalFn() {
                logsModal.style.display = 'none';
            }
            closeLogsModal.addEventListener('click', closeLogsModalFn);
            closeLogsBtn.addEventListener('click', closeLogsModalFn);
            logsModal.addEventListener('click', (e) => {
                if (e.target === logsModal) {
                    closeLogsModalFn();
                }
            });

            async function fetchLogs() {
                const server = logServerInput.value.trim();
                const key = logKeyInput.value.trim();
                const limit = logLimitInput.value || 50;
                const event = logEventFilter.value;
                const clientId = logClientFilter.value.trim();

                if (!server) {
                    showToast('请输入服务器地址', 'error');
                    return;
                }

                let url = `http://${server}/api/logs?limit=${limit}`;
                if (key) url += `&key=${encodeURIComponent(key)}`;
                if (event) url += `&event=${event}`;
                if (clientId) url += `&client_id=${encodeURIComponent(clientId)}`;

                logsContent.innerHTML = '<div style="color: var(--text-color); opacity: 0.7; text-align: center;">加载中...</div>';

                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        if (response.status === 401) {
                            throw new Error('密码错误或无权限');
                        }
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    
                    if (!Array.isArray(data) || data.length === 0) {
                        logsContent.innerHTML = '<div style="color: var(--text-color); opacity: 0.7; text-align: center;">暂无日志记录</div>';
                        logCount.textContent = '共 0 条';
                        return;
                    }

                    let html = '';
                    data.forEach((log, index) => {
                        const eventClass = log.event === 'connected' ? 'event-connected' : 'event-disconnected';
                        html += `<div class="log-entry">
                            <span class="time">[${log.time}]</span>
                            <span class="client">${log.client_id}</span>
                            <span class="${eventClass}">${log.event}</span>
                            <span class="ip">${log.remote_ip || ''}</span>
                        </div>`;
                    });
                    
                    logsContent.innerHTML = html;
                    logCount.textContent = `共 ${data.length} 条`;
                } catch (err) {
                    logsContent.innerHTML = `<div style="color: #f85149; text-align: center;">错误: ${err.message}</div>`;
                    logCount.textContent = '共 0 条';
                }
            }

            fetchLogsBtn.addEventListener('click', fetchLogs);

                function formatBytes(bytes) {
                    if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
                    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
                    let value = bytes;
                    let unitIndex = 0;
                    while (value >= 1024 && unitIndex < units.length - 1) {
                        value /= 1024;
                        unitIndex++;
                    }
                    return `${value.toFixed(value >= 10 || unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
                }

                function showTransferProgress(type, name, done = 0, total = 0) {

                    updateTransferProgress(done, total);
                }

                function updateTransferProgress(done, total) {
                    const hasTotal = Number.isFinite(total) && total > 0;
                    const safeDone = Math.max(0, done || 0);
                    transferProgress.classList.toggle('indeterminate', !hasTotal);
                    if (hasTotal) {
                        const percent = Math.min(100, Math.round((safeDone / total) * 100));
                        transferFill.style.width = `${percent}%`;
                        transferBytes.textContent = `${formatBytes(safeDone)} / ${formatBytes(total)}`;
                        transferPercent.textContent = `${percent}%`;
                    } else {
                        transferFill.style.width = '';
                        transferBytes.textContent = `已传输 ${formatBytes(safeDone)}`;
                        transferPercent.textContent = '';
                    }
                }

                function finishTransferProgress(message, totalBytes = 0) {
                    transferProgress.classList.remove('indeterminate', 'error');
                    transferFill.style.width = '100%';
                    transferTitle.textContent = message;
                    if (totalBytes > 0) {
                        transferBytes.textContent = formatBytes(totalBytes);
                    }
                    transferPercent.textContent = '100%';
                }

                function failTransferProgress(message) {
                    transferProgress.classList.remove('indeterminate');
                    transferProgress.classList.add('error');

                    transferTitle.textContent = message;

                async function refreshFullscreenImage(autoAfterControl = false) {
                    const currentClientId = fullscreenImg.dataset.clientid; // 从图片获取最新ID
                    // 拉取图片期间：直接丢弃本次请求，避免高频并发导致客户端堵塞/请求失败
                    if (screenshotInFlight) {

                    // 仅 M 模式：控制操作（点击/拖拽/滚轮/右键/键盘等）后的自动刷新不触发；off/B 模式照旧刷新
                    if (autoAfterControl && followMouseEnabled && !followRefreshEnabled) return;
                    screenshotInFlight = true;
                    showRefreshProgress();
                    try {
                        const newUrl = await getScreenshot(currentClientId, true);
                        if (!newUrl || fullscreenImg.dataset.clientid !== currentClientId) {
                            return;

                        fullscreenImg.src = newUrl;

                        // 同时更新主界面对应的卡片图片

                        screenshotInFlight = false;

                    }

                function getKnownFileSize(item) {
                    const size = Number(item && item.size);
                    return Number.isFinite(size) && size >= 0 ? size : 0;

                async function downloadFile(item) {
                    const currentClientId = fullscreenImg.dataset.clientid;
                    const fileName = item.name;
                    const totalSize = getKnownFileSize(item);
                    showTransferProgress('下载', fileName, 0, totalSize);
                    try {
                        const downloadUrl = `${getBaseUrl()}/api/download`;
                        const resp = await fetch(downloadUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ client_id: currentClientId, data: { path: fileName } })
                        });
                        if (!resp.ok) {
                            const text = await resp.text();
                            throw new Error(`HTTP ${resp.status}: ${text}`);
                        }

                        const chunks = [];
                        let received = 0;
                        if (resp.body && resp.body.getReader) {
                            const reader = resp.body.getReader();
                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;
                                chunks.push(value);
                                received += value.byteLength;
                                updateTransferProgress(received, totalSize);
                            }
                        } else {
                            const blob = await resp.blob();
                            received = blob.size;
                            updateTransferProgress(received, totalSize || received);
                            triggerBrowserDownload(blob, fileName);
                            finishTransferProgress(`下载完成: ${fileName}`, received);
                            return;
                        }

                        const blob = new Blob(chunks, { type: resp.headers.get('Content-Type') || 'application/octet-stream' });
                        triggerBrowserDownload(blob, fileName);
                        finishTransferProgress(`下载完成: ${fileName}`, received);
                    } catch (err) {
                        failTransferProgress(`下载失败: ${fileName}`);
                        throw err;
                    }
                }

                        if (!cmd) return;
                        
                        // 添加到历史记录（避免连续重复）
                        if (commandHistory[commandHistory.length - 1] !== cmd) {
                            commandHistory.push(cmd);
                        }
                        historyIndex = commandHistory.length; // 重置索引
                        
                        cmdInput.value = '';
                        await runCommand(cmd);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (commandHistory.length > 0 && historyIndex > 0) {
                            historyIndex--;
                            cmdInput.value = commandHistory[historyIndex];
                            // 将光标移到末尾

                async function uploadFile(file, batchLabel = '') {
                    isUploading = true;
                    const currentClientId = fullscreenImg.dataset.clientid;
                    const displayName = batchLabel ? `${batchLabel} ${file.name}` : file.name;
                    showTransferProgress('上传', displayName, 0, file.size);
                    try {
                        const fileSize = file.size;
                        const chunkSize = 1 << 20;
                        const totalChunks = Math.ceil(fileSize / chunkSize);
                        const startData = await apiExecute(currentClientId, 'upload_start', {
                            path: file.name,
                            total_size: fileSize
                        });
                        const sessionId = startData.session_id;
                        let uploadedBytes = 0;
                        for (let i = 0; i < totalChunks; i++) {
                            const start = i * chunkSize;
                            const end = Math.min(start + chunkSize, fileSize);
                            const chunkBlob = file.slice(start, end);
                            await apiUploadChunk(currentClientId, sessionId, i, chunkBlob);
                            uploadedBytes = end;
                            updateTransferProgress(uploadedBytes, fileSize);
                        }
                        await apiExecute(currentClientId, 'upload_finish', { session_id: sessionId });
                        finishTransferProgress(`上传完成: ${file.name}`, fileSize);
                        cmdOut.textContent = `> 上传完成: ${file.name}\n` + cmdOut.textContent;
                        showToast('上传成功', 'success');
                        return true;
                    } catch (err) {
                        failTransferProgress(`上传失败: ${file.name}`);
                        cmdOut.textContent = `> 上传失败: ${err.message}\n` + cmdOut.textContent;
                        showToast('上传失败: ' + err.message, 'error');
                        return false;
                    } finally {
                        isUploading = false;
                    }
                }

                        const newX = moveEvent.clientX;

                        const dx = newX - startX;
                        const dy = newY - startY;
                        const distance = Math.sqrt(dx*dx + dy*dy);
                        const heldMs = Date.now() - pressStartedAt;
                        const shouldStartDrag = distance > DRAG_START_DISTANCE ||
                            (heldMs > DRAG_HOLD_MS && distance > DRAG_HOLD_DISTANCE);

                        if (!isDraggingControl && shouldStartDrag) {
                            isDraggingControl = true;
                            const rect = fullscreenImg.getBoundingClientRect();
                            const downX = Math.round(((startX - rect.left) / rect.width) * fullscreenImg.naturalWidth);
                            const downY = Math.round(((startY - rect.top) / rect.height) * fullscreenImg.naturalHeight);
                            dragStartPromise = (async () => {
                                await apiExecute(currentClientId, 'mouse_move', { x: downX, y: downY });
                                await apiExecute(currentClientId, 'mouse_down', { button: 'left', direction: 'down' });
                                dragStarted = true;
                            })();
                        }

                        const now = Date.now();
                        if (isDraggingControl && now - lastMoveRequestTime >= 25) {
                            lastMoveRequestTime = now;
                            const startPromise = dragStartPromise;
                            if (startPromise) {
                                await startPromise;
                                if (dragStartPromise === startPromise) dragStartPromise = null;
                            }
                            const deltaX = newX - lastDragX;
                            const deltaY = newY - lastDragY;
                            if (deltaX !== 0 || deltaY !== 0) {
                                const rectNow = fullscreenImg.getBoundingClientRect();
                                const absX = Math.round(((newX - rectNow.left) / rectNow.width) * fullscreenImg.naturalWidth);
                                const absY = Math.round(((newY - rectNow.top) / rectNow.height) * fullscreenImg.naturalHeight);
                                await apiExecute(currentClientId, 'mouse_move', { x: absX, y: absY });
                                lastDragX = newX;
                                lastDragY = newY;
                                
                                // 拖拽移动时刷新截图（节流，仅 B 模式刷新）
                                if (followRefreshEnabled && now - lastDragMove >= DRAG_REFRESH_INTERVAL) {
                                    lastDragMove = now;
                                    setTimeout(() => refreshFullscreenImage(true), 200);
                                }
                            }
                        }

                        document.removeEventListener('mouseup', onMouseUp);
                        pendingControlPress = false;
                        if (!isControlMode) {
                            isDraggingControl = false;
                            dragStarted = false;
                            return;
                        }

                        if (isDraggingControl) {
                            const startPromise = dragStartPromise;
                            if (startPromise) {
                                await startPromise;
                                if (dragStartPromise === startPromise) dragStartPromise = null;
                            }
                            await apiExecute(currentClientId, 'mouse_up', { button: 'left', direction: 'up' });

                            const now = Date.now();
                            if (now - lastDragMove >= DRAG_REFRESH_INTERVAL) {
                                lastDragMove = now;
                                setTimeout(() => refreshFullscreenImage(true), 200);
                            }
                        } else if (!isDraggingControl) {
                            // 未拖拽 → 单击：先移动，再单击
                            const rect = fullscreenImg.getBoundingClientRect();
                            const x = Math.round(((startX - rect.left) / rect.width) * fullscreenImg.naturalWidth);
                            const y = Math.round(((startY - rect.top) / rect.height) * fullscreenImg.naturalHeight);
                            const currentClientId = fullscreenImg.dataset.clientid;
                            await apiExecute(currentClientId, 'mouse_move', { x, y });

                            await new Promise(resolve => setTimeout(resolve, 100));

                        // 重置状态（可选）

				// 滚轮相关变量
				let scrollAccumX = 0;

				// 截图刷新节流
				let lastScrollRefresh = 0;
				const SCROLL_REFRESH_INTERVAL = 200; // 截图刷新最小间隔（毫秒）

				fullscreenDiv.addEventListener('wheel', async (e) => {
					const rect = fullscreenImg.getBoundingClientRect();
					const mouseX = e.clientX;
					const mouseY = e.clientY;
					
					// 只在图片区域内处理
					if (mouseX < rect.left || mouseX > rect.right || 
						mouseY < rect.top || mouseY > rect.bottom) {
						return;
					}
					
					const relX = mouseX - rect.left;
					const relY = mouseY - rect.top;
					const pixelX = Math.round((relX / rect.width) * fullscreenImg.naturalWidth);
					const pixelY = Math.round((relY / rect.height) * fullscreenImg.naturalHeight);
					
					// 看图模式：缩放图片
					if (!isControlMode) {
						e.preventDefault();
						const delta = e.deltaY > 0 ? 0.9 : 1.1;
						const newScale = scale * delta;
						if (newScale >= 0.5 && newScale <= 3) {
							scale = newScale;
							applyTransform();
						}
						return;
					}
					
					// 控制模式：发送滚轮命令
					e.preventDefault();
					
					const currentClientId = fullscreenImg.dataset.clientid;
					try {
						// 先移动鼠标到当前位置
						await apiExecute(currentClientId, 'mouse_move', { x: pixelX, y: pixelY });
						
						// 标准化滚动距离
						let lines = 0;
						if (e.deltaMode === 0) {
							// 像素 -> 行 (假设每行20px)
							lines = Math.round(e.deltaY / 20);
						} else if (e.deltaMode === 1) {
							// 已经是行
							lines = Math.round(e.deltaY);
						} else {
							// 页 -> 行 (假设每页30行)
							lines = Math.round(e.deltaY * 30);
						}
						// 限制一次最多滚动5行
						lines = Math.min(Math.max(lines, -5), 5);
						
						// 累积滚动值
						scrollAccumX += 0; // 水平滚动暂不处理
						scrollAccumY += lines;
						
						// 清除之前的定时器
						if (scrollTimer) clearTimeout(scrollTimer);
						
						// 设置新的定时器，SCROLL_THROTTLE 毫秒后发送累积的滚动请求
						scrollTimer = setTimeout(async () => {
							if (scrollAccumX !== 0 || scrollAccumY !== 0) {
								try {
									await apiExecute(currentClientId, 'mouse_scroll', {
										amountx: scrollAccumX,
										amounty: -scrollAccumY // 注意方向转换
									});
									
                                    // 截图刷新节流：至少间隔 SCROLL_REFRESH_INTERVAL 毫秒
                                    const now = Date.now();
                                    if (now - lastScrollRefresh >= SCROLL_REFRESH_INTERVAL) {
                                        lastScrollRefresh = now;
                                        setTimeout(() => refreshFullscreenImage(true), 200);
                                    }
									
									scrollAccumX = 0;
									scrollAccumY = 0;
								} catch (err) {
									console.error('滚轮请求失败:', err);
								}
							}
						}, SCROLL_THROTTLE);
						
					} catch (err) {

                        activeElement.tagName === 'TEXTAREA' ||
                        activeElement.isContentEditable
                    );
                    
                    if (isInputActive) {
                        return; // 输入框中不处理任何键盘事件
                    }
                    
                    // 快捷键：Alt+X 退出全屏（任何模式下都生效）
                    if (e.altKey && e.key.toLowerCase() === 'x') {
                        e.preventDefault();

                        if (fullscreenDiv) {
