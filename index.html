<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Note</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* 让浏览器原生控件（数字框上下箭头、下拉、滚动条）都走暗色渲染，跟主题一致 */
    /* --doc-w 是纸张宽度（设置里的拖动条改它），写成 CSS 变量而不是内联样式，
       否则会盖掉下面窄屏的媒体查询 */
    :root { color-scheme: dark; --doc-w: 760px; }

    /* 选中文字：跟着主题走，不用浏览器默认的蓝底白字 */
    ::-moz-selection { background: rgba(72, 206, 255, 0.34); color: #f4ffff; }
    ::selection { background: rgba(72, 206, 255, 0.34); color: #f4ffff; }

    body {
        background: #030507;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
        height: 100vh;
        height: 100dvh;
        padding: 8px;
        color: #eef2ff;
        overflow: hidden;
    }

    .app {
        position: relative;
        width: 100%;
        height: 100%;
        background: rgba(8, 12, 20, 0.85);
        backdrop-filter: blur(12px);
        border-radius: 1.5rem;
        border: 1px solid rgba(64, 200, 220, 0.2);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* 轻量触发点 + 按需展开的全部工具 */
    .chrome-trigger {
        position: absolute;
        top: 2px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 44px;
        height: 12px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        opacity: 0.28;
        transition: opacity 0.18s;
        touch-action: manipulation;
    }
    .chrome-trigger:hover, .chrome-trigger:focus-visible { opacity: 0.95; }
    .chrome-trigger-line { width: 28px; height: 3px; border-radius: 999px; background: #8baab8; }
    .chrome-trigger-dots { display: none; color: #a8c2cf; font-size: 1.15rem; line-height: 1; }
    .chrome-trigger-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }
    .chrome-panel {
        position: relative;
        width: 100%;
        min-height: 0;
        max-height: 0;
        flex-shrink: 0;
        z-index: 40;
        overflow: hidden;
        overscroll-behavior: contain;
        background: rgba(8, 12, 20, 0.96);
        backdrop-filter: blur(14px);
        border: 0 solid rgba(64, 200, 220, 0.18);
        border-radius: 1.4rem;
        box-shadow: none;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: max-height 0.22s ease, opacity 0.18s ease, visibility 0s linear 0.22s;
    }
    .app.controls-open .chrome-panel {
        max-height: min(88vh, 760px);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        overflow-y: auto;
        border-width: 1px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
        transition: max-height 0.22s ease, opacity 0.18s ease, visibility 0s;
    }
    .app.controls-open .chrome-trigger { opacity: 0; pointer-events: none; }
    .chrome-aux {
        min-width: 30px;
        padding: 4px 8px;
        color: #9ebbc8;
        background: transparent;
        border-color: #263d49;
        line-height: 1.1;
    }
    .chrome-close { font-size: 1rem; padding-inline: 9px; }
    @media (prefers-reduced-motion: reduce) {
        .chrome-trigger, .chrome-panel { transition: none; }
    }

    /* ---------- 顶栏 ---------- */
    .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0.55rem 0.9rem;
        background: rgba(0, 0, 0, 0.55);
        border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        flex-shrink: 0;
    }
    .brand {
        font-size: 0.82rem;
        font-weight: 500;
        color: #9fe1e6;
        letter-spacing: 0.06em;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }
    .brand-mark { color: #d1f7fb; font-weight: 700; letter-spacing: 0.13em; }
    .brand .bk {
        color: #4d7f92;
        font-family: monospace;
        font-size: 0.7rem;
        letter-spacing: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 180px;
    }
    .bar-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    .status {
        font-size: 0.66rem;
        color: #5f8a9c;
        font-family: monospace;
        letter-spacing: 0.02em;
        padding-right: 4px;
        white-space: nowrap;
    }
    .status.saving { color: #c9a35a; }
    .status.saved { color: #4fbfa0; }
    .status.error { color: #e0708a; }

    button {
        background: #15232e;
        border: 1px solid #3c6474;
        color: #e3f2fc;
        padding: 5px 13px;
        border-radius: 32px;
        font-size: 0.7rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.15s;
        font-family: inherit;
    }
    button:hover { background: #2d4f60; border-color: #68d0ff; }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #48ceff; outline-offset: 2px; }

    /* ---------- 设置面板 ---------- */
    .settings {
        display: none;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.4);
        border-bottom: 1px solid #1e2e38;
        font-size: 0.7rem;
        flex-shrink: 0;
        max-height: 46vh;
        overflow-y: auto;
    }
    .settings.open { display: flex; }
    .fld {
        display: flex;
        align-items: center;
        gap: 5px;
        background: #0b0f18;
        border: 1px solid #28323e;
        border-radius: 32px;
        padding: 4px 10px;
    }
    .fld label { color: #8db3cc; white-space: nowrap; }
    .fld input, .fld select {
        background: #020408;
        border: 1px solid #2b404e;
        border-radius: 24px;
        padding: 4px 7px;
        color: #d0f0ff;
        font-family: monospace;
        font-size: 0.7rem;
        outline: none;
    }
    .fld input:focus, .fld select:focus { border-color: #48ceff; }

    /* 数字框的上下调节：原生箭头在不同浏览器/主题下颜色不可控（实测加 color-scheme 或改 background
       都不稳定），所以直接隐藏原生箭头，自绘一组跟随主题的加减按钮 */
    .numwrap { position: relative; display: inline-flex; align-items: center; }
    .numwrap input[type="number"] { padding-right: 19px; -moz-appearance: textfield; }
    .numwrap input[type="number"]::-webkit-inner-spin-button,
    .numwrap input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        appearance: none;
        margin: 0;
    }
    .numspin {
        position: absolute;
        right: 3px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        width: 14px;
        height: 22px;
        border-radius: 7px;
        overflow: hidden;
        border: 1px solid #24343f;
        background: #101a22;
    }
    .numspin button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        padding: 0;
        margin: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        color: #7aa9be;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
    }
    .numspin button + button { border-top: 1px solid #24343f; }
    .numspin button::before {
        content: '';
        width: 0;
        height: 0;
        border-left: 3px solid transparent;
        border-right: 3px solid transparent;
    }
    .numspin button[data-step="1"]::before { border-bottom: 4px solid currentColor; }
    .numspin button[data-step="-1"]::before { border-top: 4px solid currentColor; }
    .numspin button:hover { background: #1d4553; color: #e6f9ff; }
    .numspin button:active { transform: none; background: #2c6678; color: #ffffff; }

    /* 开关式复选框（自动保存），暗色主题 */
    .fld input[type="checkbox"] {
        -webkit-appearance: none;
        appearance: none;
        width: 34px;
        height: 18px;
        margin: 0;
        padding: 0;
        flex-shrink: 0;
        border-radius: 10px;
        border: 1px solid #2b404e;
        background: #0a1219;
        position: relative;
        cursor: pointer;
        transition: background 0.18s, border-color 0.18s;
    }
    .fld input[type="checkbox"]::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #46606f;
        transition: left 0.18s, background 0.18s, box-shadow 0.18s;
    }
    .fld input[type="checkbox"]:checked {
        background: #10333f;
        border-color: #3d9fbd;
    }
    .fld input[type="checkbox"]:checked::after {
        left: 18px;
        background: #48ceff;
        box-shadow: 0 0 7px rgba(72, 206, 255, 0.75);
    }
    /* 拖动条（纸张宽度）：暗色主题，原生 range 默认太亮，全部自绘 */
    .fld input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 132px;
        height: 4px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: #1b2b36;
        cursor: pointer;
        outline: none;
    }
    .fld input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 4px;
        background: #1b2b36;
    }
    .fld input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        margin-top: -4.5px;
        border: none;
        border-radius: 50%;
        background: #48ceff;
        box-shadow: 0 0 7px rgba(72, 206, 255, 0.55);
        cursor: pointer;
        transition: box-shadow 0.15s;
    }
    .fld input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 11px rgba(72, 206, 255, 0.9); }
    .fld input[type="range"]::-moz-range-track {
        height: 4px;
        border-radius: 4px;
        background: #1b2b36;
    }
    .fld input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: none;
        border-radius: 50%;
        background: #48ceff;
        box-shadow: 0 0 7px rgba(72, 206, 255, 0.55);
        cursor: pointer;
    }
    .rng-val {
        color: #7fb7cc;
        font-family: monospace;
        font-size: 0.66rem;
        min-width: 42px;
        text-align: right;
    }

    .fld.wide {
        flex: 1 1 100%;
        align-items: flex-start;
        border-radius: 14px;
        padding: 7px 10px;
    }
    .fld.wide label { padding-top: 3px; }
    .fld textarea {
        flex: 1;
        background: #020408;
        border: 1px solid #2b404e;
        border-radius: 10px;
        padding: 5px 8px;
        color: #d0f0ff;
        font-family: inherit;
        font-size: 0.72rem;
        line-height: 1.55;
        outline: none;
        resize: vertical;
        min-height: 48px;
    }
    .fld textarea:focus { border-color: #48ceff; }

    /* ---------- 主体：侧边栏 + 文档 ---------- */
    .main {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
    }

    /* 侧边栏（历史，贴右侧） */
    .side {
        width: var(--side-w, 272px);
        flex-shrink: 0;
        display: none;
        flex-direction: column;
        position: relative;
        border-left: 1px solid #1f3440;
        background: rgba(0, 0, 0, 0.4);
        overflow: hidden;
    }
    .side.open { display: flex; }

    /* 左边缘拖拽调宽 */
    .side-grip {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 6px;
        z-index: 3;
        cursor: col-resize;
        background: transparent;
        transition: background 0.15s;
    }
    .side-grip:hover, .side-grip.dragging { background: rgba(72, 206, 255, 0.3); }
    .side-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px;
        border-bottom: 1px solid #1f3440;
        font-size: 0.72rem;
        color: #9fe1e6;
        flex-shrink: 0;
    }
    .side-head em { font-style: normal; color: #5c7f92; font-family: monospace; font-size: 0.66rem; }
    .side-head .icon {
        padding: 2px 9px;
        border-radius: 8px;
        font-size: 0.8rem;
        line-height: 1.2;
        background: transparent;
        border-color: transparent;
        color: #8fb8cc;
    }
    .side-head .icon:hover { background: #1a2b36; border-color: #2f4c5c; }
    .side-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 12px; }

    .sitem {
        border: 1px solid transparent;
        border-radius: 9px;
        padding: 6px 8px;
        margin-bottom: 3px;
        cursor: pointer;
    }
    .sitem:hover { background: rgba(40, 80, 100, 0.28); }
    .sitem.cur { background: rgba(50, 130, 165, 0.2); border-color: rgba(80, 190, 220, 0.35); }
    .srow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .stime {
        font-family: monospace;
        font-size: 0.63rem;
        color: #5c7f92;
        letter-spacing: -0.01em;
        white-space: nowrap;
    }
    .stext {
        margin-top: 3px;
        font-size: 0.75rem;
        line-height: 1.45;
        color: #cfe3f0;
        word-break: break-word;
        white-space: pre-wrap;
        max-height: 3.2em;
        overflow: hidden;
    }
    .stext.muted { color: #4c6270; }
    .mini {
        padding: 2px 9px;
        border-radius: 20px;
        font-size: 0.62rem;
        background: #142b33;
        border-color: #2d6a7d;
        color: #8fdcd6;
        flex-shrink: 0;
    }
    .mini:hover { background: #1c3f4b; border-color: #4fc2c2; }
    .side-empty { color: #43606f; font-size: 0.72rem; padding: 14px 6px; text-align: center; }

    /* ---------- 文档区 ---------- */
    .doc-wrap {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        padding: 16px 16px 28px;
    }
    .sheet-doc {
        width: 100%;
        max-width: var(--doc-w, 760px);
        height: fit-content;
        min-height: 100%;
        display: flex;
        flex-direction: column;
    }

    /* 编辑控制区与顶栏同属按需展开的工具浮层 */
    .editor-controls {
        max-width: var(--doc-w, 760px);
        margin: 0 auto;
        padding: 0 12px;
    }

    /* 工具栏 */
    .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 3px;
        padding: 7px 8px;
        margin-bottom: 14px;
        background: rgba(9, 14, 22, 0.94);
        backdrop-filter: blur(10px);
        border: 1px solid #1d2c38;
        border-radius: 14px;
    }
    .tool-row { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin: 0; }
    .tools-toggle { background: transparent; border-color: #263d49; color: #8baab8; padding: 4px 10px; font-size: 0.66rem; }
    .toolbar.collapsed { display: none; }
    .toolbar button {
        background: transparent;
        border: 1px solid transparent;
        color: #a9c6d6;
        padding: 4px 9px;
        border-radius: 8px;
        font-size: 0.72rem;
        min-width: 30px;
    }
    .toolbar button:hover { background: #1a2b36; border-color: #2f4c5c; color: #dff2ff; }
    .toolbar .sep {
        width: 1px;
        height: 16px;
        background: #24343f;
        margin: 0 4px;
    }
    .toolbar .spacer { flex: 1; }
    .toolbar button.raw { color: #d8b978; border-color: #4a3d24; }
    .toolbar button.raw:hover { background: #34291a; border-color: #8f743d; }
    /* 原文模式下隐藏排版按钮 */
    .toolbar.raw-mode button:not(.keep) { display: none; }
    .toolbar.raw-mode .sep { display: none; }

    /* 编辑器（纸张） */
    .editor {
        flex: 1;
        min-height: 46vh;
        outline: none;
        padding: 4px 6px 60px;
        font-size: 0.95rem;
        line-height: 1.78;
        color: #e9f4ff;
        word-break: break-word;
        caret-color: #48ceff;
    }
    .editor h1, .editor h2, .editor h3, .editor h4, .editor h5, .editor h6 {
        font-weight: 600;
        color: #f4fbff;
        line-height: 1.35;
        margin: 1.15em 0 0.45em;
    }
    .editor h1 { font-size: 1.62rem; letter-spacing: -0.01em; }
    .editor h2 { font-size: 1.3rem; }
    .editor h3 { font-size: 1.1rem; }
    .editor h4, .editor h5, .editor h6 { font-size: 0.98rem; }
    .editor > :first-child { margin-top: 0; }
    .editor p { margin: 0.6em 0; }
    .editor ul, .editor ol { margin: 0.6em 0; padding-left: 1.6em; }
    .editor li { margin: 0.22em 0; }
    .editor li[data-task] { list-style: none; margin-left: -1.35em; }
    .editor li[data-task] input[type="checkbox"] { margin: 0 0.48em 0 0; accent-color: #48ceff; vertical-align: -1px; cursor: pointer; }
    .editor blockquote {
        margin: 0.8em 0;
        padding: 0.2em 0 0.2em 0.95em;
        border-left: 3px solid #3d8ba6;
        color: #a9c9d9;
    }
    .editor pre {
        background: #080d14;
        border: 1px solid #1e2d38;
        border-radius: 10px;
        padding: 12px 14px;
        margin: 0.85em 0;
        overflow-x: auto;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.82rem;
        line-height: 1.6;
        color: #cfe8f5;
        white-space: pre-wrap;
        tab-size: 4;                 /* Tab 缩进按 4 空格宽显示（Python 惯例） */
    }
    .editor pre[data-lang]::before {
        content: attr(data-lang);
        display: block;
        margin: -4px 0 8px;
        color: #6e9aab;
        font-size: 0.68rem;
        text-transform: lowercase;
    }
    .editor code {
        background: #14202b;
        border-radius: 5px;
        padding: 1px 5px;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.86em;
        color: #8fe3d6;
    }
    .editor pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .editor hr { border: none; border-top: 1px solid #24404f; margin: 1.4em 0; }
    .editor a { color: #5cc8ff; text-decoration: none; border-bottom: 1px solid rgba(92, 200, 255, 0.4); }
    .editor img { max-width: 100%; height: auto; border-radius: 10px; }
    .editor table {
        border-collapse: collapse;
        margin: 0.85em 0;
        max-width: 100%;
        font-size: 0.9em;
    }
    .editor th, .editor td { border: 1px solid #29404d; padding: 5px 11px; vertical-align: top; }
    .editor [align="center"] { text-align: center; }
    .editor [align="right"] { text-align: right; }
    .editor th { background: #101d27; color: #bde6f3; font-weight: 600; }
    .editor tr:nth-child(even) { background: rgba(20, 35, 46, 0.45); }
    .editor strong, .editor b { color: #ffffff; font-weight: 650; }
    .editor em, .editor i { color: #d6ecf7; }

    /* 原文编辑框（textarea） */
    .rawbox {
        flex: 1;
        display: none;
        width: 100%;
        min-height: 46vh;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        padding: 4px 6px 60px;
        color: #e9f4ff;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.88rem;
        line-height: 1.72;
        caret-color: #48ceff;
        word-break: break-word;
    }
    .rawbox.show { display: block; }
    .doc-stats { display: flex; justify-content: flex-end; gap: 12px; padding: 8px 6px 10px; color: #527181; font: 0.65rem/1.4 ui-monospace, monospace; }

    /* ---------- 总结浮层 ---------- */
    .sheet {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        z-index: 50;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .sheet.open { display: flex; }
    .sheet-card {
        background: #0d141f;
        border: 1px solid #2f5f72;
        border-radius: 1.2rem;
        width: 100%;
        max-width: 620px;
        max-height: 78vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #1f3440;
        font-size: 0.78rem;
        color: #9fe1e6;
    }
    .sheet-body {
        padding: 16px 18px;
        overflow-y: auto;
