    function syncImageBar() {
        if (isReadOnly() || rawMode || !selectedNoteImage || !editor.contains(selectedNoteImage)) { hideImageBar(); return; }
        var bar = ensureImageBar(), wrap = $('docWrap').getBoundingClientRect(), image = selectedNoteImage.getBoundingClientRect();
        if (image.bottom < wrap.top || image.top > wrap.bottom || image.right < wrap.left || image.left > wrap.right) { bar.classList.remove('open'); return; }
        bar.querySelector('[data-image-action="width"]').textContent = '宽度：' + (imageWidth(selectedNoteImage.getAttribute('width')) || '自动') + (imageWidth(selectedNoteImage.getAttribute('width')) ? 'px' : '');
        bar.classList.add('open');
        var size = bar.getBoundingClientRect(), bottom = Math.min(wrap.bottom, window.innerHeight) - size.height - 6;
        var top = Math.max(wrap.top + 6, Math.min(image.bottom + 6, bottom));
        if (image.bottom + size.height + 12 > wrap.bottom && image.top - size.height - 6 >= wrap.top) top = image.top - size.height - 6;
        bar.style.top = Math.max(6, top) + 'px';
        bar.style.left = Math.max(Math.max(6, wrap.left + 6), Math.min(image.left, Math.min(wrap.right, window.innerWidth) - size.width - 6)) + 'px';

    // 读取真实逻辑行：跨 strong/span 等文本节点，同时以 <br> 和块边界隔开。
    function shortcutContext() {
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount || !sel.isCollapsed) return null;
        var caret = sel.getRangeAt(0), node = caret.startContainer;
        if (!editor.contains(node)) return null;
        var el = node.nodeType === 1 ? node : node.parentElement;
        if (el.closest('pre,code,td,th,[data-md-audio]')) return null;
        var block = el.closest('p,div,h1,h2,h3,h4,h5,h6,blockquote,li');
        if (!block || block === editor || !editor.contains(block)) block = editor;
        var line = document.createRange();
        line.selectNodeContents(block);
        var beforeBreak = null, afterBreak = null;
        // 每个块（包括音乐、表格、布局）都是边界，不能把容器内其余正文当作当前行。
        var boundaries = Array.prototype.filter.call(block.querySelectorAll('br,' + BLOCK_SEL), function (boundary) {
            var owner = boundary.parentElement;
            while (owner && owner !== block) {
                if (owner.matches(BLOCK_SEL)) return false;
                owner = owner.parentElement;
            }
            return owner === block;
        });
        boundaries.forEach(function (boundary) {
            var r = document.createRange();
            r.selectNode(boundary);
            if (r.compareBoundaryPoints(Range.END_TO_END, caret) <= 0) beforeBreak = boundary;
            else if (!afterBreak && r.compareBoundaryPoints(Range.START_TO_START, caret) >= 0) afterBreak = boundary;
        });
        if (beforeBreak) line.setStartAfter(beforeBreak);
        if (afterBreak) line.setEndBefore(afterBreak);
        var prefix = line.cloneRange();
        prefix.setEnd(caret.startContainer, caret.startOffset);
        var remainder = line.cloneRange();
        remainder.setStart(caret.startContainer, caret.startOffset);
        return { block: block, caret: caret.cloneRange(), line: line, prefix: prefix, remainder: remainder,
            text: prefix.toString().replace(/\u00a0/g, ' '), beforeBreak: beforeBreak, afterBreak: afterBreak,
            container: block === editor || block.hasAttribute('data-md-layout') || block.hasAttribute('data-md-cell') ||
                boundaries.some(function (boundary) { return boundary.tagName !== 'BR'; }),
            li: listItemOf(node) };
    }

    function fragmentHtml(fragment) {
        var div = document.createElement('div');
        div.appendChild(fragment);
        return div.innerHTML;
    }

    // 格式操作不能悄悄删除已有音乐；原生命令发生异常重排时恢复正文。
    function preserveMusicOnEdit(action) {
        var expected = musicTracks().map(function (block) {
            return audioMarkdown(block.getAttribute('data-audio-title'), block.getAttribute('data-audio-src'));
        });
        var before = captureEditorSnapshot();
        var savedHistory = editorHistory.slice(), savedIndex = editorHistoryIndex;
        var savedGroup = editorHistoryGroup, savedAt = editorHistoryAt, savedMerge = editorHistoryMerge;
        function rollback(message) {
            restoreEditorSnapshot(before);
            editorHistory = savedHistory; editorHistoryIndex = savedIndex;
            editorHistoryGroup = savedGroup; editorHistoryAt = savedAt; editorHistoryMerge = savedMerge;
            toast(message); return false;
        }
        try { action(); }
        catch (error) { return rollback('未能应用此次格式，已恢复原内容'); }
        if (!expected.length) return true;
        function containsExpected(blocks) {
            var index = 0;
            Array.prototype.forEach.call(blocks, function (block) {
                var value = audioMarkdown(block.getAttribute('data-audio-title'), block.getAttribute('data-audio-src'));
                if (value === expected[index]) index++;
            });
            return index === expected.length;
        }
        if (!containsExpected(musicTracks())) return rollback('此次格式操作影响了音乐块，已恢复原内容');
        // 音乐即使还在 DOM 中，也不能被包进标题或代码而在下次读取时变成普通文字。
        try {
            var rendered = document.createElement('div');
            rendered.innerHTML = md2html(html2md(editor));
            if (!containsExpected(rendered.querySelectorAll('[data-md-audio]'))) return rollback('此次格式无法完整保留音乐，已恢复原内容');
        } catch (error) { return rollback('未能保留此次排版，已恢复原内容'); }
        return true;
    }

    // 只替换当前逻辑行；直接操作 Range，避免原生 insertHTML 合并并吞掉相邻音乐等块。
    var shortcutSequence = 0;
    function replaceShortcutLine(context, tag, attrs, kind, keepPrefix) {
        if (context.line.cloneContents().querySelector('[data-md-audio],table,[data-md-layout],[data-md-cell]')) return false;
        var content = fragmentHtml(context.remainder.cloneContents());
        var markerId = String(++shortcutSequence);
        var caretHtml = '<span data-md-caret="' + markerId + '">\u200b</span>';
        var html;
        if (kind === 'hr') html = '<hr><p>' + caretHtml + (content || '<br>') + '</p>';
        else if (tag === 'ul' || tag === 'ol') html = '<' + tag + (attrs || '') + '><li>' + caretHtml + (content || '<br>') + '</li></' + tag + '>';
        else if (kind === 'task') {
            html = '<li data-task="' + (isDoneMark(attrs) ? 'done' : 'todo') + '" data-mark="' + escAttr(attrs) + '"><input type="checkbox" tabindex="-1"' + (isDoneMark(attrs) ? ' checked' : '') + '> ' + caretHtml + (content || '<br>') + '</li>';
            if (!context.li) html = '<ul>' + html + '</ul>';
        }
        else if (tag === 'pre') html = '<pre' + (attrs ? ' data-lang="' + escAttr(esc(attrs)) + '"' : '') + '><code>' + caretHtml + (content || '<br>') + '</code></pre>';
        else html = '<' + tag + '>' + caretHtml + (content || '<br>') + '</' + tag + '>';
        if (keepPrefix) {
            var prefix = context.prefix.cloneContents();
            if (prefix.textContent || prefix.querySelector(CONTENT_SEL)) html = '<p>' + fragmentHtml(prefix) + '</p>' + html;
        }
        var selectionRange = context.line.cloneRange();
        if (!context.container) {
            var oldTag = context.block.tagName.toLowerCase();
            if (context.beforeBreak) {
                var before = document.createRange();
                before.selectNodeContents(context.block);
                before.setEndBefore(context.beforeBreak);
                html = '<' + oldTag + '>' + (fragmentHtml(before.cloneContents()) || '<br>') + '</' + oldTag + '>' + html;
            }
            if (context.afterBreak) {
                var after = document.createRange();
                after.selectNodeContents(context.block);
                after.setStartAfter(context.afterBreak);
                html += '<' + oldTag + '>' + (fragmentHtml(after.cloneContents()) || '<br>') + '</' + oldTag + '>';
            }
            selectionRange.selectNode(context.block);
        }
        var sel = window.getSelection();
        var before = captureEditorSnapshot();
        var protectedNodes = Array.prototype.slice.call(editor.querySelectorAll('[data-md-audio],table,[data-md-layout],[data-md-cell]'));
        try {
            var box = document.createElement('div'); box.innerHTML = html;
            var marker = box.querySelector('[data-md-caret="' + markerId + '"]');
            if (!marker) return false;
            var fragment = document.createDocumentFragment();
            while (box.firstChild) fragment.appendChild(box.firstChild);
            selectionRange.deleteContents();
            selectionRange.insertNode(fragment);
            if (protectedNodes.some(function (node) { return !editor.contains(node); })) throw new Error('块边界变化');
            var next = document.createRange();
            next.setStartBefore(marker); next.collapse(true);
            marker.remove();
            sel.removeAllRanges(); sel.addRange(next);
            rememberEditorSelection();
            return true;
        } catch (error) {
            restoreEditorSnapshot(before);
            toast('未能转换此行，已保留原内容');
            return false;
        }
    }

    function tryMarkdownShortcut(trigger, inserted) {
        var context = shortcutContext();
        if (!context) return false;
        var text = context.text, m;
        if (trigger === 'enter') {
            if (context.li || context.block.closest('blockquote')) return false;
            if (context.remainder.toString().trim()) return false;
            var audio = parseAudioLine(text);
            if (audio && !context.beforeBreak && !context.afterBreak &&
                !context.line.cloneContents().querySelector('img,code,pre,table,input,hr,[data-md-audio]')) {
                // 只转换完整的单段音乐语法；软换行混排留给插入对话框，避免吞并前后正文。
                try {
                    placeAudioBlock(audio.title, audio.url, { range: context.line.cloneRange() });
                    return true;
                } catch (error) {
                    toast('未能转换音乐，请使用链接按钮插入');
                    return false;
                }
            }
            var fence = codeFenceStart(text);
            if (fence) {
                if (context.remainder.cloneContents().querySelector(CONTENT_SEL)) return false;
                return replaceShortcutLine(context, 'pre', fence.info);
            }
            if (/^(?:-{3,}|\*{3,}|_{3,})$/.test(text)) return replaceShortcutLine(context, '', '', 'hr');
            return false;
        }
        if (!inserted) text += ' ';
        if ((m = text.match(/^(?:[-*+] )?\[([ xX\u2714\u2713\u2611])\] $/))) {
            if (context.li) {
                var head = document.createRange();
                head.selectNodeContents(context.li);
                head.setEnd(context.caret.startContainer, context.caret.startOffset);
                if (head.toString().replace(/\u00a0/g, ' ') !== context.text) return false;
                context.block = context.li;
                context.container = false;
                context.beforeBreak = context.afterBreak = null;
                context.remainder = document.createRange();
                context.remainder.selectNodeContents(context.li);
                context.remainder.setStart(context.caret.startContainer, context.caret.startOffset);
            }
            return replaceShortcutLine(context, '', m[1], 'task');
        }
        // 这些块格式不应用到列表、引用中的行，避免序列化时丢失嵌套结构。
        if (context.li || context.block.closest('blockquote')) return false;
        if ((m = text.match(/^(#{1,6}) $/))) return replaceShortcutLine(context, 'h' + m[1].length);
        if (/^[-*+] $/.test(text)) return replaceShortcutLine(context, 'ul');
        if ((m = text.match(/^(\d+)[.)] $/))) return replaceShortcutLine(context, 'ol', ' start="' + Math.max(1, Number(m[1])) + '"');
        if (/^> $/.test(text)) return replaceShortcutLine(context, 'blockquote');
        return false;
    }

    /* ================= 表格编辑 ================= */
    // 以前「表格」按钮只能塞一段固定的「列 1 / 内容」示例：想改结构只能切到原文手敲。
    // 现在改成：点按钮弹尺寸选择器 → 插一张空表 → 光标进去就能打字，
    // 并把「加行/加列/删行/删列/对齐」做成跟着编辑位置走的悬浮条。

    var TBL_ROWS = 8;               // 尺寸选择器的最大行列
    var TBL_COLS = 8;
    var tblBar = null;
    var tblPicker = null;
    var pickHot = { r: 2, c: 2 };   // 选择器里当前悬停到的格子（默认 3×3）

    // 光标所在的单元格（必须在编辑器里，且真的落在 table 内）
    function activeCell() {
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount) return null;
        var node = sel.getRangeAt(0).startContainer;
        if (!node || !editor.contains(node)) return null;
        var el = node.nodeType === 1 ? node : node.parentNode;
        if (!el || !el.closest) return null;
        var cell = el.closest('td,th');
        return cell && editor.contains(cell) ? cell : null;
    }

    function activeTable() {
        var cell = activeCell();
        return cell ? cell.closest('table') : null;
    }

    function rowCellsOf(tr) {
        return Array.prototype.slice.call(tr.children).filter(function (c) { return /^(th|td)$/i.test(c.tagName); });
    }

    function cellMatrix(table) {
        return Array.prototype.slice.call(table.querySelectorAll('tr')).map(rowCellsOf);
    }

    function rowIndexOf(table, cell) {
        return Array.prototype.indexOf.call(table.querySelectorAll('tr'), cell.parentNode);
    }

    function flatCells(table) {
        var out = [];
        cellMatrix(table).forEach(function (row) { row.forEach(function (c) { out.push(c); }); });
        return out;
    }

    // 把光标放进某个单元格。空单元格里有占位的 <br>，必须把光标放在它「之前」，
    // 否则会落到第二行去（按下就能看见的空行）。
    function focusCell(cell) {
        if (!cell) return;
        editor.focus();
        var r = document.createRange();
        if (cell.textContent.trim()) {
            r.selectNodeContents(cell);
            r.collapse(false);
        } else {
            r.setStart(cell, 0);
            r.collapse(true);
        }
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
    }

    // 光标补到编辑器末尾（插入前的兜底）
    function caretToEnd() {
        editor.focus();
        var r = document.createRange();
        r.selectNodeContents(editor);
        r.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
    }

    function blankCell(tag, align) {
        var c = document.createElement(tag);
        if (align) c.setAttribute('align', align);
        c.appendChild(document.createElement('br'));   // 撑高，空单元格才点得进去
        return c;
    }

    // 把某一行的 th/td 统一改名（插到表头上面时，原来的表头要降级成普通行）
    function retagRow(tr, tag) {
        rowCellsOf(tr).forEach(function (c) {
            if (c.tagName.toLowerCase() === tag) return;
            var n = document.createElement(tag);
            while (c.firstChild) n.appendChild(c.firstChild);
            for (var i = 0; i < c.attributes.length; i++) n.setAttribute(c.attributes[i].name, c.attributes[i].value);
            c.parentNode.replaceChild(n, c);
        });
    }

    function insertRow(table, refCell, where) {
        var tr = refCell.parentNode;
        var cols = rowCellsOf(table.querySelector('tr')).length;
        var atTop = table.querySelector('tr') === tr && where === 'before';
        var newTr = document.createElement('tr');
        for (var i = 0; i < cols; i++) newTr.appendChild(blankCell(atTop ? 'th' : 'td'));
        tr.parentNode.insertBefore(newTr, where === 'before' ? tr : tr.nextSibling);
        if (atTop) retagRow(tr, 'td');
        return newTr;
    }

    function insertCol(table, refCell, where) {
        var idx = refCell.cellIndex;
        Array.prototype.slice.call(table.querySelectorAll('tr')).forEach(function (tr) {
            var cells = rowCellsOf(tr);
            if (!cells.length) return;
            var ref = cells[Math.min(idx, cells.length - 1)];
            var nc = blankCell(/^th$/i.test(ref.tagName) ? 'th' : 'td', ref.getAttribute('align') || '');
            tr.insertBefore(nc, where === 'before' ? ref : ref.nextSibling);
        });
    }

    // 删掉整张表，并把光标放到它原来的位置（后面补一个空段落，保证还能继续写）
    function removeTable(table) {
        var p = document.createElement('p');
        p.appendChild(document.createElement('br'));
        p.setAttribute('data-tail', '1');
        table.parentNode.insertBefore(p, table);
        table.parentNode.removeChild(table);
        focusCell(p);
        ensureTail();
    }

    function deleteRow(table, cell) {
        var rows = Array.prototype.slice.call(table.querySelectorAll('tr'));
        if (rows.length <= 1) { removeTable(table); return; }
        var tr = cell.parentNode;
        var idx = rows.indexOf(tr);
        tr.parentNode.removeChild(tr);
        if (idx === 0) retagRow(rows[1], 'th');   // 删掉表头行后，下一行顶上
        return true;
    }

    function deleteCol(table, cell) {
        var rows = Array.prototype.slice.call(table.querySelectorAll('tr'));
        var cells0 = rowCellsOf(rows[0]);
        if (cells0.length <= 1) { removeTable(table); return; }
        var idx = cell.cellIndex;
        rows.forEach(function (tr) {
            var cells = rowCellsOf(tr);
            var c = cells[Math.min(idx, cells.length - 1)];
            if (c) tr.removeChild(c);
        });
        return true;
    }

    function cycleAlign(table, cell) {
        var idx = cell.cellIndex;
        var cur = (cell.getAttribute('align') || '').toLowerCase();
        var next = cur === '' ? 'left' : (cur === 'left' ? 'center' : (cur === 'center' ? 'right' : ''));
        cellMatrix(table).forEach(function (row) {
            var c = row[Math.min(idx, row.length - 1)];
            if (!c) return;

                if (isReadOnly() || rawMode || editorLoadRevision !== compositionRevision || editorModeRevision !== compositionModeRevision) return;

                scheduleSave(compositionGroup);
                if (editorCompositionGroup === compositionGroup) editorCompositionGroup = '';
            }, 0);
        });
        editor.addEventListener('beforeinput', function (e) {
            if (isAudioUiTarget(e.target)) return;
            refreshEditorInputMode();
            if (isReadOnly()) { if (e.cancelable) e.preventDefault(); pendingTaskItem = null; return; }
            if (/^insert/.test(e.inputType || '') && !e.isComposing && !markdownComposing) moveCaretOutsideAudio();
            if (historyRestoring) return;
            if (e.inputType === 'historyUndo' || e.inputType === 'historyRedo') {
                if (e.cancelable) { e.preventDefault(); undoEditorHistory(e.inputType === 'historyRedo'); }
                return;
            }
            if (!markdownTransforming && !layoutEditing) rememberEditorHistoryBoundary(editorInputHistoryGroup(e.inputType));
            if (e.isComposing || markdownComposing || markdownTransforming) return;
            if (e.cancelable && (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward')) {
                if (handleHeadingBoundary(e, 'delete')) return;
                if (handleLayoutBoundary(e, 'delete', e.inputType === 'deleteContentBackward')) return;
            }
            if (e.inputType === 'insertParagraph') {
                if (e.cancelable && handleHeadingBoundary(e, 'enter')) return;
                if (e.cancelable && handleLayoutBoundary(e, 'enter')) return;
                var sel = window.getSelection();
                pendingTaskItem = sel.rangeCount ? listItemOf(sel.getRangeAt(0).startContainer) : null;
                if (e.cancelable && (enterBeforeListFirstItem(e) || handleEnterInPre(e) || convertShortcut('enter', false))) {
                    e.preventDefault();
                    pendingTaskItem = null;
                    ensureTail(); syncEmpty(); scheduleSave();
                }
            } else if (e.cancelable && e.inputType === 'insertText' && /^[ \u00a0]$/.test(e.data || '')) {
                if (convertShortcut('space', false)) {
                    e.preventDefault();
                    ensureTail(); syncEmpty(); scheduleSave();
                }
            }
        });
        editor.addEventListener('input', function (e) {
            if (isAudioUiTarget(e.target)) return;
            refreshEditorInputMode();
            if (historyRestoring || markdownTransforming || layoutEditing) return;
            if (isReadOnly()) {
                pendingTaskItem = null;
                // 任务框由 change 恢复；其他意外输入回到最后一份合法正文。
                if (!(e.target.matches && e.target.matches('input[type="checkbox"]')) && editorHistory[editorHistoryIndex]) restoreEditorSnapshot(editorHistory[editorHistoryIndex]);
                return;
            }
            if (e.inputType === 'historyUndo' || e.inputType === 'historyRedo') {
                if (!undoEditorHistory(e.inputType === 'historyRedo') && editorHistory[editorHistoryIndex]) restoreEditorSnapshot(editorHistory[editorHistoryIndex]);
                return;
            }
            // checkbox 的 change 随后同步 data-task；只在该完整状态完成后记一次。
            if (e.target.matches && e.target.matches('input[type="checkbox"]')) return;
            hideImageBar();
            Array.prototype.forEach.call(editor.querySelectorAll('[data-md-caret]'), function (marker) { marker.remove(); });
            if (!e.isComposing && !markdownComposing && e.inputType === 'insertText' && /^[ \u00a0]$/.test(e.data || '')) convertShortcut('space', true);
            if (pendingTaskItem) {
                var selection = window.getSelection();
                var nextItem = selection.rangeCount ? listItemOf(selection.getRangeAt(0).startContainer) : null;
                if (pendingTaskItem.hasAttribute('data-task') && nextItem && nextItem !== pendingTaskItem && nextItem.parentNode === pendingTaskItem.parentNode) markTaskItem(nextItem, false);
                pendingTaskItem = null;
            }
            ensureTail();
            syncEmpty();
            syncLayoutButtons();
            rememberEditorSelection();
            scheduleSave(editorInputHistoryGroup(e.inputType));
        });

        editor.addEventListener('keydown', function (e) {
            if(e.target.closest&&e.target.closest('[data-md-request]'))return;
            if (isAudioUiTarget(e.target)) return;
            refreshEditorInputMode();
            if (isReadOnly()) return;
            if (e.isComposing || markdownComposing || e.keyCode === 229) return;
            if (e.key === 'Enter') moveCaretOutsideAudio();
            if (e.key === 'Enter' || e.key === 'Tab' || e.key === 'Backspace' || e.key === 'Delete') {
                rememberEditorHistoryBoundary(e.key === 'Backspace' ? 'delete-backward' : e.key === 'Delete' ? 'delete-forward' : '');
            }
            if (!e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
                if ((e.key === 'Backspace' || e.key === 'Delete') && handleHeadingBoundary(e, 'delete')) return;
                if ((e.key === 'Backspace' || e.key === 'Delete') && handleLayoutBoundary(e, 'delete', e.key === 'Backspace')) return;
                if (e.key === 'Enter' && handleHeadingBoundary(e, 'enter')) return;
                if (e.key === 'Enter' && handleLayoutBoundary(e, 'enter')) return;
            }
            // 表格内：Tab 走单元格（最后一格自动补行）、Enter 走下一行、Esc 出表格
            if (activeCell()) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    tabCell(e.shiftKey ? -1 : 1);
                    ensureTail(); syncEmpty(); scheduleSave(); syncTableBar();
                    return;
                }
                if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    e.preventDefault();
                    enterCell();
                    ensureTail(); syncEmpty(); scheduleSave(); syncTableBar();
                    return;
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    exitTable();
                    syncEmpty(); scheduleSave(); syncTableBar();
                    return;
                }
            }
            // 代码块里 Ctrl/Cmd+Enter：跳出代码块（普通 Enter 只负责插换行，见 handleEnterInPre）
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey) {
                var psel = window.getSelection();
                var ppre = psel.rangeCount ? preOf(psel.getRangeAt(0).startContainer) : null;
                if (ppre) {
                    e.preventDefault();
                    exitPre(ppre);
                    ensureTail();
                    syncEmpty();
                    scheduleSave();
                    return;
                }
            }
            if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey && handleLayoutBoundary(e, 'tab', e.shiftKey)) return;
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && handleLayoutBoundary(e, 'exit')) return;
            if (e.key === 'Tab') {
                var sel = window.getSelection();
                var li = sel.rangeCount ? listItemOf(sel.getRangeAt(0).startContainer) : null;
                if (li) {
                    e.preventDefault();
                    document.execCommand(e.shiftKey ? 'outdent' : 'indent');
                    ensureTail();
                    scheduleSave();
                    return;
                }
            }
            if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
                if (convertShortcut('enter', false)) { e.preventDefault(); ensureTail(); syncEmpty(); scheduleSave(); return; }
                var selection = window.getSelection();
                var currentItem = selection.rangeCount ? listItemOf(selection.getRangeAt(0).startContainer) : null;
                if (currentItem && currentItem.hasAttribute('data-task') && currentItem.textContent.trim()) {
                    var taskModeRevision = editorModeRevision;
                    setTimeout(function () {
                        if (isReadOnly() || editorModeRevision !== taskModeRevision) return;
                        var nextSelection = window.getSelection();
                        var nextItem = nextSelection.rangeCount ? listItemOf(nextSelection.getRangeAt(0).startContainer) : null;
                        if (nextItem && nextItem !== currentItem && nextItem.parentNode === currentItem.parentNode) {
                            markTaskItem(nextItem, false);
                            syncEmpty();
                            scheduleSave();
                        }
                    }, 0);
                }
                if (enterBeforeListFirstItem(e)) { ensureTail(); syncEmpty(); scheduleSave(); return; }
                if (handleEnterInPre(e)) { syncEmpty(); scheduleSave(); return; }
            }
        });

        editor.addEventListener('paste', function (e) {
            if (isAudioUiTarget(e.target)) return;
            if (isReadOnly()) { e.preventDefault(); return; }
            moveCaretOutsideAudio();
            var txt = (e.clipboardData || window.clipboardData).getData('text/plain');
            if (!txt) return;
            e.preventDefault();
            rememberEditorHistoryBoundary();
            // 单元格里不能塞块级结构（会插出嵌套表格、把 Markdown 表结构冲垮），
            // 统一按纯文本进，换行转成单元格内的 <br>
            if (activeCell()) {
                document.execCommand('insertHTML', false,
                    esc(txt.replace(/\r\n?/g, '\n')).replace(/\n/g, '<br>'));
                syncEmpty();
                scheduleSave();
                syncTableBar();
                return;
            }
            var pasteSelection = window.getSelection();
            if (pasteSelection && pasteSelection.rangeCount &&
                (layoutAncestor(pasteSelection.anchorNode, 'pre,code', editor) || layoutAncestor(pasteSelection.focusNode, 'pre,code', editor))) {
                if (!preOf(pasteSelection.anchorNode) && !preOf(pasteSelection.focusNode)) txt = txt.replace(/\r\n?|\n/g, ' ');
                document.execCommand('insertText', false, txt);
                syncEmpty(); scheduleSave(); return;
            }
            var selection = window.getSelection();
            var pasteRange = selection && selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
            var singleAudio = parseAudioLine(txt);
            var containsAudio = !!singleAudio || txt.replace(/\r\n?/g, '\n').split('\n').some(function (line) { return !!parseAudioLine(line); });
            var musicRestricted = pasteRange &&
                (layoutAncestor(pasteRange.startContainer, 'li,blockquote,pre,code', editor) ||
                 layoutAncestor(pasteRange.endContainer, 'li,blockquote,pre,code', editor));
            if (containsAudio && musicRestricted) {
                document.execCommand('insertText', false, txt);
                syncEmpty(); scheduleSave();
                return;
            }
            if (singleAudio && pasteRange && editor.contains(pasteRange.startContainer) && editor.contains(pasteRange.endContainer)) {
                try {
                    placeAudioBlock(singleAudio.title, singleAudio.url, { range: pasteRange });
                } catch (error) {
                    // 放置失败时保持字面内容；placeAudioBlock 已恢复原正文和选区。
                    document.execCommand('insertText', false, txt);
                    syncEmpty(); scheduleSave();
                }
                return;
            }
            var looksMd = /\n/.test(txt) || !!singleAudio || /(^|\n)\s*(#{1,6}\s|[-*+]\s|>\s|\d+[.)]\s|```)/.test(txt);
            if (looksMd && txt.trim()) {
                if (!preserveMusicOnEdit(function () { document.execCommand('insertHTML', false, md2html(txt)); })) return;
            }
            else document.execCommand('insertText', false, txt);
            syncEmpty();
            scheduleSave();
        });

        editor.addEventListener('drop', function (e) {
            if (isAudioUiTarget(e.target)) return;
            if (isReadOnly()) { e.preventDefault(); return; }
            rememberEditorHistoryBoundary();
        });
        editor.addEventListener('cut', function (e) {
            if (isAudioUiTarget(e.target)) return;
            if (isReadOnly()) { e.preventDefault(); return; }
            rememberEditorHistoryBoundary();
        });

        editor.addEventListener('change', function (e) {
            if (isAudioUiTarget(e.target)) return;
            var input = e.target.closest && e.target.closest('li[data-task] input[type="checkbox"]');
            if (!input) return;
            var li = input.closest('li[data-task]');
            if (isReadOnly()) {
                input.checked = li.getAttribute('data-task') === 'done';
                if (input.checked) input.setAttribute('checked', ''); else input.removeAttribute('checked');
                input.disabled = true;
                return;
            }
            markTaskItem(li, input.checked);   // 连带同步 data-mark（保留 [X]/[✔]/[✓] 原记号）
            syncEmpty();
            scheduleSave();
        });

        editor.addEventListener('click', function (e) {
            if (isAudioUiTarget(e.target)) return;
            if (isReadOnly()) { hideImageBar(); return; }
            var image = e.target.closest && e.target.closest('img');
            if (!image || !editor.contains(image)) { hideImageBar(); return; }
            e.preventDefault();
            selectedNoteImage = image;
            var range = document.createRange(); range.selectNode(image);
            var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
            rememberEditorSelection(); syncImageBar();
        });
        editor.addEventListener('load', function (e) { if (e.target.tagName === 'IMG') syncImageBar(); }, true);
        document.addEventListener('pointerdown', function (e) {
            if (!selectedNoteImage || e.target === selectedNoteImage || (imageBar && imageBar.contains(e.target))) return;
            hideImageBar();
        });
        $('docWrap').addEventListener('scroll', syncImageBar, { passive: true });
        window.addEventListener('resize', syncImageBar);

        // 表格悬浮条：光标一动就重判「在不在表格里」，位置跟着表格走
        var tableSyncTimer = null;
        function queueTableSync() {
            clearTimeout(tableSyncTimer);
            tableSyncTimer = setTimeout(syncTableBar, 30);
        }
        document.addEventListener('selectionchange', function () {
            var sel = window.getSelection();
            if (isAudioUiTarget(document.activeElement) || (sel && (isAudioUiTarget(sel.anchorNode) || isAudioUiTarget(sel.focusNode)))) return;
            if (!rawMode && !layoutEditing) { rememberEditorSelection(); syncLayoutButtons(); queueTableSync(); }
        });
        editor.addEventListener('focus', queueTableSync);
        editor.addEventListener('blur', function () { setTimeout(syncTableBar, 0); });
        $('docWrap').addEventListener('scroll', queueTableSync);
        window.addEventListener('resize', function () { queueTableSync(); closeTablePicker(); });
        // 点别处就收起尺寸选择器
        document.addEventListener('mousedown', function (e) {
            if (!tblPicker || !tblPicker.classList.contains('open')) return;
            if (tblPicker.contains(e.target)) return;
            if (e.target.closest && e.target.closest('button[data-cmd="table"]')) return;
            closeTablePicker();
        });

        // 原文编辑框
        rawBox.addEventListener('input', function () {
            if (isReadOnly()) { rawBox.value = normMd(html2md(editor)); return; }
            scheduleSave();
        });
        rawBox.addEventListener('keydown', function (e) {
            if (isReadOnly()) return;
            if (e.key !== 'Tab') return;
            e.preventDefault();
            rawBox.setRangeText('  ', rawBox.selectionStart, rawBox.selectionEnd, 'end');
            scheduleSave();
        });
        // 离开页面时兜底保存（仅在自动保存开启时）
        window.addEventListener('pagehide', function () {
            if (autoSaveOn() && hasAutomaticSaveWork()) doSave(true);
        });
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden' && autoSaveOn() && hasAutomaticSaveWork()) doSave(true);
        });
        // 关闭自动保存后，有未保存内容时提醒
        window.addEventListener('beforeunload', function (e) {
            if (!autoSaveOn() && ((lastSavedMd !== null && currentMd() !== lastSavedMd) || (!isReadOnly() && historyNeedsSave))) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        $('saveBtn').addEventListener('click', function () { doSave(false); });
        $('refreshBtn').addEventListener('click', function () { refresh(false); });
        document.querySelector('.favicon-options').addEventListener('click',function(event){var button=event.target.closest('[data-favicon]');if(button)chooseFavicon(button.dataset.favicon);});
        document.querySelector('.favicon-options').addEventListener('keydown',function(event){if(!/^(ArrowLeft|ArrowRight|ArrowUp|ArrowDown|Home|End)$/.test(event.key))return;event.preventDefault();var buttons=Array.prototype.slice.call(this.querySelectorAll('[data-favicon]')),index=buttons.indexOf(event.target);if(index<0)return;index=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(/Left|Up/.test(event.key)?buttons.length-1:1))%buttons.length;chooseFavicon(buttons[index].dataset.favicon);buttons[index].focus();});
        window.addEventListener('storage',function(event){if(event.key==='memos_favicon'||event.key===null)applyFavicon(event.newValue||'default');});
        $('settingsBtn').addEventListener('click', function () {
            var open = $('settings').classList.toggle('open');
            this.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        $('toolsToggle').addEventListener('click', function () {
            if (isReadOnly()) return;
            var open = $('toolbar').classList.toggle('collapsed') === false;
            this.textContent = open ? '收起' : '编辑';
            this.setAttribute('aria-expanded', open ? 'true' : 'false');
            syncImageBar();
        });
        $('rawToggle').addEventListener('click', function (e) {
            e.preventDefault();
            setEditorMode({ read: 'edit', edit: 'raw', raw: 'read' }[editorMode]);
        });
        $('sheetClose').addEventListener('click', closeSheet);
        $('sheet').addEventListener('click', function (e) {
            if (e.target === $('sheet')) closeSheet();
        });
        document.addEventListener('keydown', function (e) {
            var key = e.key.toLowerCase(), target = e.target;
            if (isAudioUiTarget(target)) {
                if ((e.ctrlKey || e.metaKey) && !e.altKey && key === 's') { e.preventDefault(); doSave(false); }
                return;
            }
            var otherField = target && target.closest && target.closest('input,textarea,select,[contenteditable="true"]');
            if (isReadOnly() && (e.ctrlKey || e.metaKey) && !e.altKey &&
                /^(z|y|k|n)$/.test(key) && (!otherField || otherField === editor)) {
                e.preventDefault();
                return;
            }
            if (!isReadOnly() && !rawMode && !e.isComposing && !markdownComposing && e.keyCode !== 229 && (e.ctrlKey || e.metaKey) && !e.altKey &&
                (key === 'z' || key === 'y') && (!otherField || otherField === editor)) {
                e.preventDefault();
                rememberEditorHistoryBoundary();
                undoEditorHistory(key === 'y' || (key === 'z' && e.shiftKey));
                return;
            }
            if (e.key === 'Escape') {
                hideImageBar();
                closeSheet();
                $('side').classList.remove('open');
                closeControls();
                closeTablePicker();
                if (window.innerWidth <= 640) setOutlineOpen(false, false);
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                doSave(false);
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                insertLink();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                startNewNote();
            }
        });

        $('historyBtn').addEventListener('click', function () { $('side').classList.toggle('open'); });
        $('accessBtn').addEventListener('click', showAccess);
        $('accessRefreshBtn').addEventListener('click', showAccess);
        $('resetBtn').addEventListener('click', resetSettings);
        $('logVisit').addEventListener('change', saveSettings);
        $('sideClose').addEventListener('click', function () { $('side').classList.remove('open'); });

        // 拖侧边栏左边缘调宽（窄屏是覆盖层，不参与拖拽）
        var grip = $('sideGrip');
        var mainEl = document.querySelector('.main');
        grip.addEventListener('pointerdown', function (e) {
            if (window.innerWidth <= 640) return;
            e.preventDefault();
            grip.classList.add('dragging');
            if (grip.setPointerCapture) { try { grip.setPointerCapture(e.pointerId); } catch (err) {} }
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';

            function onMove(ev) {
                var r = mainEl.getBoundingClientRect();
                applySideWidth(r.right - ev.clientX);   // 侧边栏贴右，宽度 = 容器右边界 - 鼠标 x
            }
            function onEnd() {
                grip.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                grip.removeEventListener('pointermove', onMove);
                grip.removeEventListener('pointerup', onEnd);
                grip.removeEventListener('pointercancel', onEnd);
                saveSettings();
            }
            grip.addEventListener('pointermove', onMove);
            grip.addEventListener('pointerup', onEnd);
            grip.addEventListener('pointercancel', onEnd);
        });

        // 连接相关设置：改动后重新拉取
        ['apiKey', 'bookId', 'userId'].forEach(function (id) {
            $(id).addEventListener('change', function () {
                saveSettings();
                notebookRevision++;
                notesRequestId++;
                clearTimeout(saveTimer);
                saveTimer = null;
                stopAudioPlayback();
                lastEditorRange = null;
                selectedHistoryState = null;
                historyNeedsSave = false;
                notes = []; live = []; loadedIdx = -1;
                $('bookLabel').textContent = $('bookId').value.trim();
                syncEditorModeUI();
                $('saveBtn').disabled = true;
                renderSide();
                setStatus('读取中…');
                refresh(true);
            });
        });

        // 普通设置：只落本地
        ['saveDelay'].forEach(function (id) {
            $(id).addEventListener('change', saveSettings);
            $(id).addEventListener('input', saveSettings);
        });

        // 历史条数改动后立即保存设置并按新上限刷新
        $('historyLimit').addEventListener('change', function () {
            this.value = String(historyLimit());
            saveSettings();
            refresh(true);
        });

        // 纸张宽度拖动条：即时生效 + 落本地
        $('docWidth').addEventListener('input', function () {
            applyDocWidth(parseFloat(this.value));
            saveSettings();
        });

        $('autoSave').addEventListener('change', function () {
            saveSettings();
            if (autoSaveOn()) {
                scheduleSave();
                toast('已开启自动保存（间隔 ' + saveDelaySec() + ' 秒）');
            } else {
                clearTimeout(saveTimer);
                saveTimer = null;
                showIdleStatus();
                toast('已关闭自动保存，改按 Ctrl+S 保存');
            }
        });
        $('saveDelay').addEventListener('change', function () {
            saveSettings();
            if (autoSaveOn()) scheduleSave();
        });

        // 自绘的数字加减按钮（原生箭头已隐藏）
        $('settings').addEventListener('click', function (e) {
            var btn = e.target.closest ? e.target.closest('.numspin button') : null;
            if (!btn) return;
            e.preventDefault();
            var box = btn.closest('.numwrap');
            var input = box && box.querySelector('input');
            if (!input) return;
            var step = parseFloat(input.step) || 1;
            var dir = parseFloat(btn.dataset.step) || 1;
            var lo = (input.min === '' ? -Infinity : parseFloat(input.min));
            var hi = (input.max === '' ? Infinity : parseFloat(input.max));
            var v = parseFloat(input.value);
            if (isNaN(v)) v = isFinite(lo) ? lo : 0;
            v = v + dir * step;
            if (isFinite(lo)) v = Math.max(lo, v);
            if (isFinite(hi)) v = Math.min(hi, v);
            input.value = String(Math.round(v * 1e6) / 1e6);
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
        });
    }

    function init() {
        loadSettings();
        $('bookLabel').textContent = $('bookId').value.trim();
        bind();
        bindAudioPlayers();
        syncEditorModeUI();
        setStatus('读取中…');
        refresh(true);
        // 访问上报独立走：不占用 busy 锁、失败静默，绝不干扰笔记本身的读写
        reportVisit();
    }

    init();
})();
</script>
