<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mqmux.github.io</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;color:#e6edf3;line-height:1.7;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .box{text-align:center;padding:44px 52px;border:1px solid #30363d;border-radius:16px;background:#161b22}
  .dot{width:10px;height:10px;border-radius:50%;background:#3fb950;display:inline-block;margin-right:8px;vertical-align:middle}
  h1{margin:0 0 6px;font-size:30px;letter-spacing:.5px;font-family:ui-monospace,Consolas,monospace}
  .ok{color:#3fb950;font-size:15px;margin:0 0 18px;font-weight:500}
  .desc{color:#8b949e;font-size:14px;margin:0 0 20px}
  .meta{color:#6e7681;font-size:13px;margin:0;border-top:1px solid #30363d;padding-top:16px}
  code{background:#0d1117;border:1px solid #30363d;border-radius:5px;padding:1px 6px;font-size:13px;color:#79c0ff;font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
  <div class="box">
    <h1>mqmux.github.io</h1>
    <p class="ok"><span class="dot"></span>GitHub Pages 已就绪</p>
    <p class="desc">这个页面是通过 <code>git push</code> 上传的</p>
    <p class="meta">部署时间 2026-10-09</p>
  </div>
</body>
</html>
