<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Note</title>
<link id="noteFavicon" rel="icon" type="image/x-icon" href="https://mqmux.github.io/favicon.ico">
<script>
(function(){var icons={default:'https://mqmux.github.io/favicon.ico',pink:'https://mqmux.github.io/favicon-current.ico',purple:'https://mqmux.github.io/favicon-purple.ico'},choice='default';try{choice=localStorage.getItem('memos_favicon')||'default';}catch(_){}document.getElementById('noteFavicon').setAttribute('href',Object.prototype.hasOwnProperty.call(icons,choice)?icons[choice]:icons.default);})();
</script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* 让浏览器原生控件（数字框上下箭头、下拉、滚动条）都走暗色渲染，跟主题一致 */
    /* --doc-w 是纸张宽度（设置里的拖动条改它），写成 CSS 变量而不是内联样式，
       否则会盖掉下面窄屏的媒体查询 */
    :root { color-scheme: dark; --doc-w: 760px; --task-box: 14px; --task-gap: 7px; }

    /* 选中文字：跟着主题走，不用浏览器默认的蓝底白字 */
    ::-moz-selection { background: rgba(72, 206, 255, 0.34); color: #f4ffff; }
    ::selection { background: rgba(72, 206, 255, 0.34); color: #f4ffff; }

    body {
        background: #030507;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
        height: 100vh;
        height: 100dvh;
        color: #eef2ff;
        overflow: hidden;
    }

    /* 不再有「外框」这一层：原先 body 留 8px 边 + .app 圆角/青边/投影，
       整个页面被框成一个圆角卡片。四角圆弧是纯装饰且会跟窗口圆角打架，
       直接去掉 → 直角满铺，滚动条也就贴到窗口右缘了 */
    .app {
        position: relative;
        width: 100%;
        height: 100%;
        background: rgba(8, 12, 20, 0.85);
        backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* 轻量触发点 + 按需展开的全部工具。
       外观 = 右上角一个「⋯」小按钮，点它展开工具栏面板；面板展开后自动隐去
       （面板自带 × 收起）。点状用三个 <i> 画，不依赖字体里省略号的字形位置 */
    .chrome-trigger {
        position: absolute;
        top: 6px;
        right: 10px;
        z-index: 50;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 32px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 7px;
        background: transparent;
        opacity: 0.34;
        transition: opacity 0.18s, background 0.18s;
        touch-action: manipulation;
    }
    .chrome-trigger:hover, .chrome-trigger:focus-visible { opacity: 1; background: rgba(96, 210, 230, 0.12); }
    .chrome-trigger-dots { display: flex; align-items: center; gap: 4px; color: #a8c2cf; }
    /* 4px 整数尺寸：3.5px 这类半像素在 1x 屏上抗锯齿会糊成椭圆条 */
    .chrome-trigger-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
    .chrome-trigger-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }
    .chrome-panel {
        position: relative;
        width: 100%;
        min-height: 0;
        max-height: 0;
        flex-shrink: 0;
        z-index: 40;
        overflow: hidden;
        overscroll-behavior: contain;
        background: rgba(8, 12, 20, 0.96);
        backdrop-filter: blur(14px);
        border: 0 solid rgba(64, 200, 220, 0.18);
        /* 顶栏+设置是同一条「顶抽屉」，横向满铺；圆角在窗口边缘会留出黑色缺口
           （外框去掉后就露出来了），所以这里也必须直角 */
        box-shadow: none;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: max-height 0.22s ease, opacity 0.18s ease, visibility 0s linear 0.22s;
    }
    .app.controls-open .chrome-panel {
        max-height: min(88vh, 760px);
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        overflow-y: auto;
        border-width: 1px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
        transition: max-height 0.22s ease, opacity 0.18s ease, visibility 0s;
    }
    .app.controls-open .chrome-trigger { opacity: 0; pointer-events: none; }
    .chrome-aux {
        min-width: 30px;
        padding: 4px 8px;
        color: #9ebbc8;
        background: transparent;
        border-color: #263d49;
        line-height: 1.1;
    }
    .chrome-close { font-size: 1rem; padding-inline: 9px; }
    @media (prefers-reduced-motion: reduce) {
        .chrome-trigger, .chrome-panel { transition: none; }
    }

    /* ---------- 顶栏 ---------- */
    .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 0.55rem 0.9rem;
        background: rgba(0, 0, 0, 0.55);
        border-bottom: 1px solid rgba(0, 255, 255, 0.15);
        flex-shrink: 0;
    }
    .brand {
        font-size: 0.82rem;
        font-weight: 500;
        color: #9fe1e6;
        letter-spacing: 0.06em;
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }
    .brand-mark { color: #d1f7fb; font-weight: 700; letter-spacing: 0.13em; }
    .brand .bk {
        color: #4d7f92;
        font-family: monospace;
        font-size: 0.7rem;
        letter-spacing: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 180px;
    }
    .bar-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    .status {
        font-size: 0.66rem;
        color: #5f8a9c;
        font-family: monospace;
        letter-spacing: 0.02em;
        padding-right: 4px;
        white-space: nowrap;
    }
    .status.saving { color: #c9a35a; }
    .status.saved { color: #4fbfa0; }
    .status.error { color: #e0708a; }

    /* 工具栏收起时，状态栏藏在面板里就看不见了 —— 用这颗悬浮胶囊常显保存状态。
       放在左下角：不挡顶部的触发细线、也不跟右侧历史抽屉打架。
       pointer-events:none 所以纯提示、不拦点击；工具栏展开时自动让位（顶栏里已有状态）。 */
    .status-float {
        position: absolute;
        left: 14px;
        bottom: 11px;
        z-index: 6;
        max-width: min(62%, 340px);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding: 3px 11px;
        border-radius: 999px;
        background: rgba(7, 14, 22, 0.74);
        border: 1px solid rgba(64, 200, 220, 0.14);
        backdrop-filter: blur(8px);
        opacity: 0.9;
        pointer-events: none;
        transition: opacity 0.2s ease, color 0.2s ease;
    }
    .status-float:empty { display: none; }
    .app.controls-open .status-float { display: none; }

    button {
        background: #15232e;
        border: 1px solid #3c6474;
        color: #e3f2fc;
        padding: 5px 13px;
        border-radius: 32px;
        font-size: 0.7rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.15s;
        font-family: inherit;
    }
    button:hover { background: #2d4f60; border-color: #68d0ff; }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #48ceff; outline-offset: 2px; }

    /* ---------- 设置面板 ---------- */
    /* 单行右对齐的紧凑工具条，空间不足时整项自然换行。 */
    .settings {
        display: none;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.4);
        border-bottom: 1px solid #1e2e38;
        font-size: 0.7rem;
        flex-shrink: 0;
        max-height: 46vh;
        overflow-y: auto;
    }
    .settings.open { display: block; }
    .settings-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 6px 18px;
        min-width: 0;
    }
    .fld {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
        gap: 6px;
        min-width: 0;
        max-width: 100%;
        min-height: 28px;
    }
    .fld label { color: #8db3cc; white-space: nowrap; }
    .fld .field-unit { color: #648492; white-space: nowrap; }
    .fld input {
        background: #020408;
        border: 1px solid #2b404e;
        border-radius: 6px;
        height: 28px;
        padding: 4px 7px;
        color: #d0f0ff;
        font-family: monospace;
        font-size: 0.7rem;
        outline: none;
    }
    .fld input:focus { border-color: #48ceff; }
    #apiKey, #bookId { width: 96px; }
    #userId { width: 80px; }
    #saveDelay { width: 58px; }
    #historyLimit { width: 52px; }
    /* 身份由链接参数指定（?n= / ?u=）：换个底色标出来，聚焦时仍走高亮色 */
    .fld input.from-url { border-color: #2f7f9e; background: #04141c; color: #9fe6ff; }
    .fld input.from-url:focus { border-color: #48ceff; }

    /* 数字框的上下调节：原生箭头在不同浏览器/主题下颜色不可控（实测加 color-scheme 或改 background
       都不稳定），所以直接隐藏原生箭头，自绘一组跟随主题的加减按钮 */
    .numwrap { position: relative; display: inline-flex; align-items: center; }
    .numwrap input[type="number"] { padding-right: 19px; -moz-appearance: textfield; }
    .numwrap input[type="number"]::-webkit-inner-spin-button,
    .numwrap input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        appearance: none;
        margin: 0;
    }
    .numspin {
        position: absolute;
        right: 3px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        width: 14px;
        height: 22px;
        border-radius: 7px;
        overflow: hidden;
        border: 1px solid #24343f;
        background: #101a22;
    }
    .numspin button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        padding: 0;
        margin: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        color: #7aa9be;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
    }
    .numspin button + button { border-top: 1px solid #24343f; }
    .numspin button::before {
        content: '';
        width: 0;
        height: 0;
        border-left: 3px solid transparent;
        border-right: 3px solid transparent;
    }
    .numspin button[data-step="1"]::before { border-bottom: 4px solid currentColor; }
    .numspin button[data-step="-1"]::before { border-top: 4px solid currentColor; }
    .numspin button:hover { background: #1d4553; color: #e6f9ff; }
    .numspin button:active { transform: none; background: #2c6678; color: #ffffff; }

    /* 开关式复选框（自动保存），暗色主题 */
    .fld input[type="checkbox"] {
        -webkit-appearance: none;
        appearance: none;
        width: 34px;
        height: 18px;
        margin: 0;
        padding: 0;
        flex-shrink: 0;
        border-radius: 10px;
        border: 1px solid #2b404e;
        background: #0a1219;
        position: relative;
        cursor: pointer;
        transition: background 0.18s, border-color 0.18s;
    }
    .fld input[type="checkbox"]::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #46606f;
        transition: left 0.18s, background 0.18s, box-shadow 0.18s;
    }
    .fld input[type="checkbox"]:checked {
        background: #10333f;
        border-color: #3d9fbd;
    }
    .fld input[type="checkbox"]:checked::after {
        left: 18px;
        background: #48ceff;
        box-shadow: 0 0 7px rgba(72, 206, 255, 0.75);
    }
    /* 拖动条（纸张宽度）：暗色主题，原生 range 默认太亮，全部自绘 */
    .fld input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 112px;
        height: 4px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: #1b2b36;
        cursor: pointer;
        outline: none;
    }
    .fld input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 4px;
        background: #1b2b36;
    }
    .fld input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        margin-top: -4.5px;
        border: none;
        border-radius: 50%;
        background: #48ceff;
        box-shadow: 0 0 7px rgba(72, 206, 255, 0.55);
        cursor: pointer;
        transition: box-shadow 0.15s;
    }
    .fld input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 0 11px rgba(72, 206, 255, 0.9); }
    .fld input[type="range"]::-moz-range-track {
        height: 4px;
        border-radius: 4px;
        background: #1b2b36;
    }
    .fld input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: none;
        border-radius: 50%;
        background: #48ceff;
        box-shadow: 0 0 7px rgba(72, 206, 255, 0.55);
        cursor: pointer;
    }
    .rng-val {
        color: #7fb7cc;
        font-family: monospace;
        font-size: 0.66rem;
        min-width: 42px;
        text-align: right;
    }

    .fld.settings-actions {
        flex-wrap: wrap;
        gap: 6px;
    }
    .settings-actions button {
        min-height: 28px;
        padding: 4px 10px;
        border-radius: 6px;
        background: transparent;
        border-color: #263d49;
    }
    .settings-actions button:hover { background: #152b36; border-color: #3d8ba6; }

    /* ---------- 主体：侧边栏 + 文档 ---------- */
    .main {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative;
    }

    /* 标题目录参与桌面布局，收起后保留一个轻量入口。 */
    .toc-panel {
        position: relative;
        width: var(--toc-w, 232px);
        flex-shrink: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #1b2b36;
        background: rgba(5, 10, 16, 0.45);
    }
    .toc-head { display: flex; align-items: center; gap: 5px; padding: 9px 8px; min-height: 42px; }
    .toc-title { flex: 1; font-size: 0.82rem; color: #9ab8c8; }
    .toc-toggle, .toc-tree-toggle { padding: 3px 6px; border: 0; border-radius: 5px; background: transparent; color: #7595a7; }
    .toc-toggle { width: 28px; min-width: 28px; font-size: 1rem; line-height: 1.3; }
    .toc-tree-toggle { font-size: 0.68rem; }
    .toc-tree-toggle:disabled { display: none; }
    .toc-toggle:hover, .toc-tree-toggle:hover { background: #15242f; color: #d9edf8; }
    .toc-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 7px 20px; }
    .toc-list ol { list-style: none; padding-left: 12px; }
    .toc-list > ol { padding-left: 0; }
    .toc-row { display: flex; align-items: center; min-width: 0; border-radius: 5px; margin: 2px 0; }
    .toc-row:hover { background: rgba(55, 105, 135, 0.12); }
    .toc-row.active { background: rgba(55, 145, 180, 0.17); }
    .toc-branch, .toc-branch-space { width: 20px; min-width: 20px; }
    .toc-branch { border: 0; padding: 4px 0; border-radius: 3px; background: transparent; color: #63899d; }
    .toc-link { flex: 1; min-width: 0; border: 0; border-radius: 0; background: transparent; padding: 6px 5px; color: #829eaf; font-size: 0.84rem; font-weight: 400; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toc-link:hover { background: transparent; color: #d5eaf5; }
    .toc-row.active .toc-link { color: #79d7ef; }
    .toc-row[data-level="1"] .toc-link { font-weight: 600; color: #bfd4e2; }
    .toc-row.active[data-level="1"] .toc-link { color: #79d7ef; }
    .toc-empty { padding: 12px 10px; color: #4f6a7c; font-size: 0.8rem; }
    .toc-grip { position: absolute; inset: 0 -3px 0 auto; width: 7px; z-index: 3; cursor: col-resize; touch-action: none; }
    .toc-grip:hover, .toc-grip:focus-visible, .toc-grip.dragging { background: rgba(72, 206, 255, 0.25); }
    .toc-grip:focus-visible { outline: 1px solid #48ceff; outline-offset: -2px; }
    body.toc-resizing, body.toc-resizing * { cursor: col-resize !important; user-select: none !important; }
    .toc-panel.collapsed { width: 38px; background: transparent; border-right-color: transparent; }
    .toc-panel.collapsed .toc-head { padding: 8px 5px; }
    .toc-panel.collapsed .toc-title, .toc-panel.collapsed .toc-tree-toggle, .toc-panel.collapsed .toc-list, .toc-panel.collapsed .toc-grip { display: none; }
    .toc-backdrop { display: none; }

    /* 侧边栏（历史，贴右侧） */
    .side {
        width: var(--side-w, 272px);
        flex-shrink: 0;
        display: none;
        flex-direction: column;
        position: relative;
        border-left: 1px solid #1f3440;
        background: rgba(0, 0, 0, 0.4);
        overflow: hidden;
    }
    .side.open { display: flex; }

    /* 左边缘拖拽调宽 */
    .side-grip {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 6px;
        z-index: 3;
        cursor: col-resize;
        background: transparent;
        transition: background 0.15s;
    }
    .side-grip:hover, .side-grip.dragging { background: rgba(72, 206, 255, 0.3); }
    .side-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px;
        border-bottom: 1px solid #1f3440;
        font-size: 0.72rem;
        color: #9fe1e6;
        flex-shrink: 0;
    }
    .side-head em { font-style: normal; color: #5c7f92; font-family: monospace; font-size: 0.66rem; }
    .side-head .icon {
        padding: 2px 9px;
        border-radius: 8px;
        font-size: 0.8rem;
        line-height: 1.2;
        background: transparent;
        border-color: transparent;
        color: #8fb8cc;
    }
    .side-head .icon:hover { background: #1a2b36; border-color: #2f4c5c; }
    .side-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 12px; }

    .sitem {
        border: 1px solid transparent;
        border-radius: 9px;
        padding: 6px 8px;
        margin-bottom: 3px;
        cursor: pointer;
    }
    .sitem:hover { background: rgba(40, 80, 100, 0.28); }
    .sitem.cur { background: rgba(50, 130, 165, 0.2); border-color: rgba(80, 190, 220, 0.35); }
    .srow { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .stime {
        font-family: monospace;
        font-size: 0.63rem;
        color: #5c7f92;
        letter-spacing: -0.01em;
        white-space: nowrap;
    }
    .stext {
        margin-top: 3px;
        font-size: 0.75rem;
        line-height: 1.45;
        color: #cfe3f0;
        word-break: break-word;
        white-space: pre-wrap;
        max-height: 3.2em;
        overflow: hidden;
    }
    .stext.muted { color: #4c6270; }
    .mini {
        padding: 2px 9px;
        border-radius: 20px;
        font-size: 0.62rem;
        background: #142b33;
        border-color: #2d6a7d;
        color: #8fdcd6;
        flex-shrink: 0;
    }
    .mini:hover { background: #1c3f4b; border-color: #4fc2c2; }
    .side-empty { color: #43606f; font-size: 0.72rem; padding: 14px 6px; text-align: center; }

    /* ---------- 文档区 ---------- */
    .doc-wrap {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        /* 顶部留白：飞书文档纸张上方也不是贴顶的，之前 16px 太挤 */
        padding: 28px 16px 28px;
    }
    .sheet-doc {
        width: 100%;
        max-width: var(--doc-w, 760px);
        height: fit-content;
        min-height: 100%;
        display: flex;
        flex-direction: column;
    }

    /* 编辑工具铺满顶部抽屉的可用宽度，独立于正文纸张宽度。 */
    .editor-controls {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0 12px;
    }

    /* 工具栏 */
    .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 8px 0;
        margin: 0;
        background: transparent;
        border: 0;
        border-radius: 0;
    }
    .tool-row { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin: 0; }
    .tools-toggle { background: transparent; border-color: #263d49; color: #8baab8; padding: 4px 10px; font-size: 0.66rem; }
    .tools-toggle[hidden] { display: none; }
    .toolbar.collapsed { display: none; }
    .toolbar button {
        background: transparent;
        border: 1px solid transparent;
        color: #a9c6d6;
        padding: 4px 9px;
        border-radius: 8px;
        font-size: 0.72rem;
        min-width: 30px;
    }
    .toolbar button:hover { background: #1a2b36; border-color: #2f4c5c; color: #dff2ff; }
    .toolbar button[aria-pressed="true"] { background: #173541; border-color: #32677b; color: #dff8ff; }
    .toolbar .sep {
        width: 1px;
        height: 16px;
        background: #24343f;
        margin: 0 4px;
    }
    .toolbar button.raw { color: #d8b978; border-color: #4a3d24; }
    .toolbar button.raw:hover { background: #34291a; border-color: #8f743d; }
    /* 原文模式下隐藏排版按钮 */
    .toolbar.raw-mode button:not(.keep) { display: none; }
    .toolbar.raw-mode .sep { display: none; }

    /* 编辑器（纸张） */
    .editor {
        flex: 1;
        min-height: 46vh;
        outline: none;
        padding: 4px 6px 60px;
        font-size: 0.95rem;
        line-height: 1.78;
        color: #e9f4ff;
        word-break: break-word;
        caret-color: #48ceff;
    }
    .editor.read-only { caret-color: transparent; }
    .editor h1, .editor h2, .editor h3, .editor h4, .editor h5, .editor h6 {
        font-weight: 600;
        color: #f4fbff;
        line-height: 1.35;
        margin: 1.15em 0 0.45em;
    }
    .editor h1 { font-size: 1.62rem; letter-spacing: -0.01em; }
    .editor h2 { font-size: 1.3rem; }
    .editor h3 { font-size: 1.1rem; }
    .editor h4, .editor h5, .editor h6 { font-size: 0.98rem; }
    .editor > :first-child { margin-top: 0; }
    .editor p { margin: 0.6em 0; }
    .editor ul, .editor ol { margin: 0.6em 0; padding-left: 1.6em; }
    .editor li { margin: 0.22em 0; }
    /* 任务清单的悬挂缩进：负外边距必须加在**勾选框**上，不能加在 li 上。
       加在 li 上会让 li 的内容盒整体左移 → 换行后的第二行会跑回勾选框底下（悬挂缩进失效）。
       加在勾选框上则：第一行 = 框 + 框的右外边距（正好回到正文列），换行行 = li 内容盒左缘，
       两者天然相等，无需 text-indent。
       ⚠️ 尺寸用 px 变量，不要用 em —— 表单控件（input）的 em 按控件自身 font-size 解析
       （Chrome 约 13.33px 而非正文字号），会把正文推出 1px 级偏差。 */
    .editor li[data-task] { list-style: none; }
    .editor li[data-task] > input[type="checkbox"] {
        width: var(--task-box);
        height: var(--task-box);
        flex: none;
        margin: 0 var(--task-gap) 0 calc(-1 * (var(--task-box) + var(--task-gap)));
        accent-color: #48ceff;
        vertical-align: -1.5px;   /* 14px 的框配 -1.5px，框中心与文字视觉中心偏差实测为 0 */
        cursor: pointer;
    }
    .editor.read-only li[data-task] > input[type="checkbox"] { cursor: default; }
    .editor blockquote {
        margin: 0.8em 0;
        padding: 0.2em 0 0.2em 0.95em;
        border-left: 3px solid #3d8ba6;
        color: #a9c9d9;
    }
    .editor pre {
        background: #080d14;
        border: 1px solid #1e2d38;
        border-radius: 10px;
        padding: 12px 14px;
        margin: 0.85em 0;
        overflow-x: auto;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.82rem;
        line-height: 1.6;
        color: #cfe8f5;
        white-space: pre-wrap;
        tab-size: 4;                 /* Tab 缩进按 4 空格宽显示（Python 惯例） */
    }
    .editor pre[data-lang]::before {
        content: attr(data-lang);
        display: block;
        margin: -4px 0 8px;
        color: #6e9aab;
        font-size: 0.68rem;
        text-transform: lowercase;
    }
    .editor code {
        background: #14202b;
        border-radius: 5px;
        padding: 1px 5px;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.86em;
        color: #8fe3d6;
    }
    .editor pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .editor hr { border: none; border-top: 1px solid #24404f; margin: 1.4em 0; }
    .editor a { color: #5cc8ff; text-decoration: none; border-bottom: 1px solid rgba(92, 200, 255, 0.4); }
    .editor img { max-width: 100%; height: auto; border-radius: 10px; }
    :is(.editor, .sheet-body) img { max-width: 100%; height: auto; }
    :is(.editor, .sheet-body) u { text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
    .editor table {
        border-collapse: collapse;
        margin: 0.85em 0;
        margin-inline-start: var(--md-block-start, 0px);
        margin-inline-end: var(--md-block-end, 0px);
        max-width: 100%;
        font-size: 0.9em;
    }
    .editor th, .editor td { border: 1px solid #29404d; padding: 5px 11px; vertical-align: top; }
    .editor [align="center"] { text-align: center; }
    .editor [align="right"] { text-align: right; }
    .editor th { background: #101d27; color: #bde6f3; font-weight: 600; }
    .editor tr:nth-child(even) { background: rgba(20, 35, 46, 0.45); }
    .editor strong, .editor b { color: #ffffff; font-weight: 650; }
    .editor em, .editor i { color: #d6ecf7; }
    /* 空单元格靠 <br> 撑高，不然点不进去；给个最小宽度免得新表格挤成一条线 */
    .editor table th, .editor table td { min-width: 2.6em; word-break: break-word; }

    /* Markdown 排版容器只改变内容排版，不增加卡片边框。 */
    :is(.editor, .sheet-body) [data-md-layout] { margin: 0.6em 0; min-width: 0; }
    :is(.editor, .sheet-body) [data-md-layout] > :first-child { margin-top: 0; }
    :is(.editor, .sheet-body) [data-md-layout] > :last-child { margin-bottom: 0; }
    :is(.editor, .sheet-body) [data-md-layout="center"] { text-align: center; --md-block-start: auto; --md-block-end: auto; }
    :is(.editor, .sheet-body) [data-md-layout="right"] { text-align: right; --md-block-start: auto; --md-block-end: 0px; }
    :is(.editor, .sheet-body) [data-md-layout="small"] { font-size: 0.85em; color: #a9c9d9; }
    .editor [data-md-layout="small"] :is(h1,h2,h3,h4,h5,h6) { font-size: 1em; }
    :is(.editor, .sheet-body) [data-md-layout="row"] {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        column-gap: 1.5em;
        row-gap: 0.25em;
        text-align: left;
        --md-block-start: 0px;
        --md-block-end: 0px;
    }
    :is(.editor, .sheet-body) [data-md-layout="row"]:has(img) { align-items: flex-start; }
    :is(.editor, .sheet-body) [data-md-cell] { min-width: min(4em, 100%); max-width: 100%; flex: 0 1 auto; }
    :is(.editor, .sheet-body) [data-md-cell="right"] { margin-left: auto; text-align: right; --md-block-start: auto; --md-block-end: 0px; }
    :is(.editor, .sheet-body) [data-md-cell] > :first-child { margin-top: 0; }
    :is(.editor, .sheet-body) [data-md-cell] > :last-child { margin-bottom: 0; }
    .editor [data-md-cell] { min-height: 1.78em; }
    .editor [data-md-layout="row"]:focus-within { outline: 1px dashed rgba(99, 160, 185, 0.28); outline-offset: 4px; }

    /* ---------- 表格：尺寸选择器 + 悬浮操作条 ---------- */
    .tbl-picker {
        position: fixed;
        z-index: 90;
        display: none;
        padding: 9px 10px 8px;
        background: rgba(9, 14, 22, 0.97);
        border: 1px solid #24404f;
        border-radius: 12px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
    }
    .tbl-picker.open { display: block; }
    .tbl-picker .grid { display: grid; grid-template-columns: repeat(8, 19px); gap: 3px; }
    .tbl-picker i {
        width: 19px;
        height: 19px;
        border: 1px solid #2a4451;
        border-radius: 4px;
        background: #0d161e;
        cursor: pointer;
    }
    .tbl-picker i.hot { background: rgba(72, 206, 255, 0.3); border-color: #48ceff; }
    .tbl-picker .cap { margin-top: 7px; text-align: center; color: #8fb3c2; font: 0.66rem/1 ui-monospace, monospace; }

    .tbl-bar {
        position: fixed;
        z-index: 80;
        display: none;
        align-items: center;
        flex-wrap: wrap;
        max-width: calc(100vw - 12px);
        gap: 2px;
        padding: 4px 5px;
        background: rgba(9, 14, 22, 0.97);
        border: 1px solid #24404f;
        border-radius: 10px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(10px);
        white-space: nowrap;
    }
    .tbl-bar.open { display: flex; }
    .tbl-bar button {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        color: #a9c6d6;
        padding: 3px 7px;
        font-size: 0.68rem;
        line-height: 1.5;
    }
    .tbl-bar button:hover { background: #1a2b36; border-color: #2f4c5c; color: #dff2ff; }
    .tbl-bar button.danger:hover { background: #3a1520; border-color: #a84a5e; color: #ffd9e2; }
    .tbl-bar .sep { width: 1px; height: 14px; background: #24343f; margin: 0 3px; }

    /* 原文编辑框（textarea） */
    .rawbox {
        flex: 1;
        display: none;
        width: 100%;
        min-height: 46vh;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        padding: 4px 6px 60px;
        color: #e9f4ff;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.88rem;
        line-height: 1.72;
        caret-color: #48ceff;
        word-break: break-word;
    }
    .rawbox.show { display: block; }

    /* ---------- 总结浮层 ---------- */
    .sheet {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        z-index: 50;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .sheet.open { display: flex; }
    /* 访问记录一行信息量大（还带 UA 原文），单独放宽这张卡。 */
    .sheet.wide .sheet-card { max-width: min(1180px, 94vw); }
    .sheet-card {
        background: #0d141f;
        border: 1px solid #2f5f72;
        border-radius: 1.2rem;
        width: 100%;
        max-width: 620px;
        max-height: 78vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #1f3440;
        font-size: 0.78rem;
        color: #9fe1e6;
    }
    .sheet-actions { display: flex; align-items: center; gap: 6px; }
    .sheet-body {
        padding: 16px 18px;
        overflow-y: auto;
        font-size: 0.86rem;
        line-height: 1.7;
        color: #dfeaf5;
        word-break: break-word;
    }
    .sheet-body :first-child { margin-top: 0; }
    .sheet-body h1, .sheet-body h2, .sheet-body h3 { color: #f0faff; margin: 0.9em 0 0.4em; font-size: 1.05rem; }
    .sheet-body ul, .sheet-body ol { margin: 0.5em 0; padding-left: 1.5em; }
    .sheet-body code { background: #14202b; border-radius: 4px; padding: 1px 5px; font-family: monospace; font-size: 0.85em; }
    .sheet-body strong { color: #fff; }

    /* 音乐控件不参与正文编辑，所有播放状态只存在页面内。 */
    .md-audio {
        max-width: 100%;
        width: 100%;
        margin: 0.6rem 0;
        margin-inline-start: var(--md-block-start, 0px);
        margin-inline-end: var(--md-block-end, 0px);
        padding: 9px 11px;
        background: #0d1922;
        border: 1px solid #243d4b;
        border-radius: 9px;
        font: 0.74rem/1.5 system-ui, sans-serif;
        text-align: left;
        user-select: none;
    }
    /* 音乐卡片横纵间距一致，左右平分宽度；列宽不足时各占一行。 */
    :is(.editor, .sheet-body) [data-md-layout="row"]:has(> [data-md-cell] [data-md-audio]) {
        align-items: flex-start;
        gap: 0.6rem;
    }
    :is(.editor, .sheet-body) [data-md-layout="row"]:has(> [data-md-cell] [data-md-audio]) > [data-md-cell] {
        flex: 1 1 calc(50% - 0.3rem);
        min-width: min(16rem, 100%);
        margin-left: 0;
    }
    .audio-ui { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 9px; }
    .audio-ui button { padding: 3px 7px; min-height: 27px; border-radius: 5px; background: transparent; border-color: transparent; font-size: 0.68rem; }
    .audio-ui button:hover { background: #17313e; border-color: #34667b; }
    .audio-ui .audio-play { color: #83d9ee; width: 29px; padding: 3px; font-size: 0.86rem; flex-shrink: 0; }
    .audio-heading { display: flex; align-items: center; gap: 6px; flex: 1 1 100px; min-width: 0; }
    .audio-name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dceef7; }
    .audio-time { color: #80a3b5; font: 0.64rem/1.5 ui-monospace, Consolas, monospace; white-space: nowrap; }
    .audio-seek { flex: 1 1 100px; width: 100px; min-width: 45px; height: 18px; margin: 0; padding: 0; accent-color: #62cce6; cursor: pointer; }
    .audio-seek:disabled { opacity: 0.35; cursor: default; }
    .audio-mode { color: #83b6cb; white-space: nowrap; }
    .audio-status { flex: 0 0 auto; min-width: 0; max-width: 65%; padding: 1px 4px; border-radius: 4px; background: rgba(98, 204, 230, 0.1); color: #83bbc9; font-size: 0.6rem; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .audio-status:empty { display: none; }
    .md-audio[data-audio-state="playing"] { border-color: #3f8296; }
    .md-audio[data-audio-state="error"] .audio-status { color: #e8ad9d; background: rgba(232, 173, 157, 0.1); }
    .md-audio[data-audio-state="blocked"] .audio-status { color: #d8c18b; background: rgba(216, 193, 139, 0.1); }
    .editor.read-only .audio-edit { display: none; }
    @media (max-width: 540px) {
        .audio-heading { flex-basis: calc(100% - 50px); }
        .audio-seek { flex-grow: 1; }
    }

    .link-dialog[hidden] { display: none; }
    .link-dialog { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.62); }
    .link-form { width: 380px; max-width: 100%; max-height: 85dvh; overflow-y: auto; padding: 19px; border: 1px solid #2c5266; border-radius: 12px; background: #0d1620; box-shadow: 0 18px 60px #0008; }
    .link-form h2 { font-size: 0.9rem; font-weight: 500; color: #bce6ef; margin-bottom: 14px; }
    .link-form label { display: block; color: #8faebb; font-size: 0.72rem; margin: 11px 0 5px; }
    .link-form input, .link-form select { display: block; width: 100%; min-height: 34px; padding: 7px 9px; border: 1px solid #2a4251; border-radius: 6px; color: #dcecf5; background: #060d14; font-family: inherit; font-size: 0.76rem; line-height: 1.4; }
    .link-form select:disabled { opacity: 0.6; }
    .link-error { color: #edb2a2; font-size: 0.72rem; margin-top: 10px; }
    .link-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 17px; }
    .link-actions button { border-radius: 6px; padding: 6px 13px; }

    /* ---------- 访问记录列表 ---------- */
    .log-stat {
        color: #7fd0dd; font-size: 0.76rem; margin-bottom: 10px;
        display: flex; align-items: center; gap: 10px;
    }
    .log-stat button { padding: 2px 9px; font-size: 0.66rem; }
    .log-list { font: 0.73rem/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    /* 折叠态只留关键信息（约 90 字符），其余点开才看 —— 否则 100 行 × 300 字符糊满一屏 */
    .log-row { padding: 5px 7px; border-radius: 5px; color: #cfe3ef; word-break: break-all; }
    .log-row + .log-row { margin-top: 4px; }
    .log-row:nth-child(odd) { background: rgba(72, 206, 255, 0.045); }
    .log-row.has-detail { cursor: pointer; }
    .log-row.has-detail:hover { background: rgba(72, 206, 255, 0.1); }
    .log-row .lg-time { color: #7fd0dd; white-space: nowrap; }
    .log-row .lg-who { color: #ffd479; font-weight: 600; white-space: nowrap; }
    /* UA 原文又长又次要，压暗让它「退后」，不淹掉前面的关键信息 */
    .log-row .lg-ua { color: #648492; }
    /* 展开箭头用伪元素：切换只改 class，不必重建 DOM（重建会把滚动位置弹回顶部） */
    .log-row .lg-arrow { display: inline-block; width: 13px; color: #527181; }
    .log-row.has-detail .lg-arrow::before { content: '\25B8'; }
    .log-row.has-detail.open .lg-arrow::before { content: '\25BE'; }
    .log-row.open .lg-arrow { color: #7fd0dd; }
    /* 「+N」= 这行还折着几项，一眼知道值不值得点开。做成小胶囊，不然会粘在前一个字段上
       （「来自 mux.rth1.xyz+9」看着像网址的一部分） */
    .log-row .lg-count {
        color: #7fa5b8; font-size: 0.64rem; margin-left: 6px;
        padding: 0 6px; border-radius: 9px; background: rgba(72, 206, 255, 0.12);
        display: inline-block; white-space: nowrap;   /* 宁可整体换行，也别把「+9」拆成两行 */
    }
    /* 展开区：左侧竖线当缩进参照，避免被当成新的一条记录 */
    .log-row .lg-detail {
        display: none;
        margin: 3px 0 1px 13px;
        padding-left: 9px;
        border-left: 1px solid rgba(72, 206, 255, 0.22);
        color: #8fb3c4;
    }
    .log-row.open .lg-detail { display: block; }
    .log-empty { color: #527181; }
    .log-more { margin-top: 12px; }
    .log-more button { width: 100%; }

    /* ---------- 提示 ---------- */
    .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translate(-50%, 20px);
        background: #123240;
        border: 1px solid #3d8ba6;
        color: #d8f2ff;
        padding: 9px 18px;
        border-radius: 30px;
        font-size: 0.75rem;
        opacity: 0;
        pointer-events: none;
        transition: 0.22s;
        z-index: 90;
        max-width: 88vw;
        text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.err { background: #3a1520; border-color: #a84a5e; color: #ffd9e2; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #11161f; }
    ::-webkit-scrollbar-thumb { background: #2f697e; border-radius: 8px; }

    @media (max-width: 640px) {
        .toc-panel { position: absolute; inset: 0 auto 0 0; width: min(280px, 82vw); z-index: 25; background: #080f18; box-shadow: 8px 0 24px rgba(0, 0, 0, 0.45); }
        .toc-grip { display: none; }
        .toc-panel.collapsed { width: 34px; bottom: auto; box-shadow: none; }
        .toc-panel.collapsed .toc-head { padding: 5px 3px; }
        .toc-backdrop.open { display: block; position: absolute; inset: 0; z-index: 24; background: rgba(0, 0, 0, 0.4); }
        .doc-wrap { padding: 36px 10px 24px; }
        .chrome-trigger {
            top: 4px;
            right: 7px;
            width: 30px;
            height: 22px;
            opacity: 0.44;
        }
        .editor { font-size: 0.9rem; padding: 4px 2px 48px; }
        .brand .bk { display: none; }
        .brand-mark { display: none; }
        .bar { padding: 0.45rem 0.55rem; gap: 4px; }
        .bar-right { gap: 2px; }
        .bar-right button { padding: 4px; font-size: 0.6rem; }
        .bar-right .tool-row { gap: 2px; }
        .toolbar button { padding: 4px 7px; font-size: 0.68rem; }
        .status { font-size: 0.6rem; }
        .bar-right .status { display: block; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
        .side {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            left: auto;
            z-index: 20;
            width: 84%;
            max-width: 310px;
            box-shadow: -8px 0 26px rgba(0, 0, 0, 0.65);
        }
        .side-grip { display: none; }   /* 窄屏是浮层，不给拖宽 */
    }

    /* Explicit enhanced Markdown cards share one layout in all reading/editing views. */
    :is(.editor,.sheet-body) [data-md-layout="cards"] > ul[data-card-list]{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;list-style:none;padding:0;margin:12px 0}

<script>
(function () {
    'use strict';

    var API = 'https://memos.memtensor.cn/api/openmem/v1';
    var DEFAULT_KEY = 'mpg-NFH2/LVRbJ1/oRoyWQyxq+hhbwG0ncnBphNvuue/';

    var DEFAULT_HISTORY_LIMIT = 10;
    // 访问记录：写死在独立会话里，和笔记完全隔离（不占笔记本的 50 条额度）。
    // 因为 MemOS 没有「修改消息」接口，"追加"只能做成「读回最新一条 → 末尾加一行 → 整条重新写成一条新消息」。
    // 🔑 2026-10-14 改为「单条滚动」：不再分片，永远只维护一条消息，超过上限就从**头部丢掉最老的**。
    //   为什么废掉分片：片长 100 + 读取窗口 50 条时，保留量会在 50~149 之间锯齿波动
    //   —— 老片只靠"它自己的最后一条"占 1 个窗口位存活，新片涨到第 50 行时老片 100 行整段被挤出去。
    //   滚动方案保留量恒定 = LOG_MAX 行，而且读回只需要最新 1 条（它就装着全部历史）。
    var LOG_USER = '__log';
    var LOG_CONV = '__access';
    // 保留行数上限（同时也是单条消息的容量上限）：单次写入量恒定，不会 O(N²)、也不撞单条 40k token 上限。
    // ⚠️ 2026-10-14 从 200 降到 100 —— 加了 UA 原文等字段后一行涨到 ~300 字符，200 行就顶到 40k 上限了。
    var LOG_MAX = 100;
    // 上报只需要最新 1 条：滚动方案里最新那条就装着全部历史（此前要拉 50 条 = ~215KB，现在 ~28KB）。
    var LOG_READ_TIP = 1;
    // 开面板时多读几条：多标签页并发会各写一条，靠合并取并集才不会丢记录（代价很小，面板是手动开的）。
    var LOG_READ_VIEW = 5;
    var LOG_KEEP = LOG_MAX;         // 面板里默认显示最近多少行（滚动后最多也就这么多）
    var LOG_LINE = /^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})(?: · (.*))?$/;
    var LOG_SEP = ' · ';
    // MemOS 存储层会「洗」content（以下均实测确认）：
    //   1) \n / \r\n 被折叠成空格，<br> 被当标签删掉 → 多行 Markdown 被压成一行；
    //   2) 连续空格被折叠，**行首缩进被整段吃掉**（'    return x' → 'return x'）→ 对 Python 代码是致命的；
    //   3) \t 被吃掉，U+00A0(NBSP) 也被当空白处理掉；
    //   4) 正文会被做一次 HTML 实体解码，而 <br> 这类标签会被洗成一个空格（实测：
    //      A<br>B → "A B"，A&lt;br&gt;B → "A<br>B"）。
    //      表格单元格里的换行在 Markdown 里只能写成 <br>，所以传输时多包一层实体：
    //      <br> → &amp;lt;br&amp;gt; → 落库正好是 &lt;br&gt; → 读回再还原成 <br>。
    // 实测 U+2028 / U+2002 / U+2003 等能原样存回，故统一「编码后存储、读回再还原」。
    var NL = '\u2028';   // 换行的替身 → 读回还原为 \n
    var SP = '\u2002';   // 空格的替身 → 读回还原为普通空格 U+0020
    var TB = '\u2003';   // 制表符的替身 → 读回还原为 \t
    // 单独的 # 是空白状态标记；kindOf 必须先精确匹配它，再检查普通占位符。
    var EMPTY_STATE_MARKER = '#';
    var PLACEHOLDER = /^[\s\-—–~.。·…*#_]*$/;   // 占位符：整条视为「作废」
    // 本应用自己发出的总结请求（旧版直接把 query 写进了笔记本，这里挡掉）
    var INTERNAL = /^(请总结我最近的笔记|以下是我的笔记)/;
    var SIDE_MIN = 190;             // 侧边栏可拖拽宽度的下限 / 上限
    var SIDE_MAX = 640;
    var DOC_MIN = 420;              // 纸张宽度滑块范围
    var DOC_MAX = 1400;
    var DOC_DEF = 840;

    var $ = function (id) { return document.getElementById(id); };
    var editor = $('editor');
    var rawBox = $('rawBox');

    var notes = [];         // 全部 user 消息（含占位）
    var live = [];          // 过滤后的有效笔记
    var busy = false;
    var notebookRevision = 0, notesRequestId = 0;
    var activeNotebook = null, refreshQueued = false;
    var editorMode = 'read'; // 每次打开默认只读；read → edit → raw → read
    var rawMode = false;     // 由 editorMode 派生，供 Markdown 原文相关逻辑使用
    var editorModeRevision = 0;

    function md2html(md, allowAudio, depth) {
        depth = depth || 0;

        var src = String(md == null ? '' : md).replace(/\r\n?/g, '\n');
        var lines = src.split('\n');

        var list = null;     // {type, items}

            }

                            md2html(lines.slice(layoutBounds.split + 1, layoutBounds.end).join('\n'), allowAudio, depth + 1)));

        if (html.length && pendingBlank > 2) {

    }

        while (underline && parent) {

            var parentDecoration = parentTag === 'span' ? (parent.style.textDecorationLine || parent.style.textDecoration || '') : '';
            if (parentTag === 'u' || /\bunderline\b/.test(parentDecoration)) { underline = false; break; }
            parent = parent.parentElement;
        }
        if (strike) inner = '~~' + inner + '~~';
        if (underline) inner = '++' + inner + '++';
        if (strike || underline) return inner;
        if (tag === 'a') return '[' + inner.replace(/\n/g, '<br>') + '](' + escapeMdLinkUrl(node.getAttribute('href') || '') + ')' + (node.hasAttribute('data-card-custom') && noteCardIcons[node.getAttribute('data-card-icon')] ? ' {icon:' + node.getAttribute('data-card-icon') + '}' : '');
        return inner;
    }

    function inlineToMd(node) {
        var s = '';
        var kids = node.childNodes || [];
        for (var i = 0; i < kids.length; i++) {
            var n = kids[i];
            if (n.nodeType === 3) {
                s += node.closest && node.closest('a') ? escapeMdLinkLabel(n.nodeValue) : escapeUnderlineMd(n.nodeValue);
                continue;
            }
            if (n.nodeType !== 1) continue;
            s += nodeToMd(n);
        }
        return s;
    }

    // 代码块取文本：<br> 也要算成换行。
    // 浏览器在 contenteditable 的 <pre> 里按回车插的是 <br>，而 textContent 不认 <br>，
    // 于是整段代码被压成一行 —— 这就是「代码块保存后刷新格式就没了」的根因。
    function preText(el) {
        var out = '';
        (function walk(node) {
            for (var i = 0; i < node.childNodes.length; i++) {
                var n = node.childNodes[i];
                if (n.nodeType === 3) { out += n.nodeValue; continue; }
                if (n.nodeType !== 1) continue;
                var tg = n.tagName.toLowerCase();
                if (tg === 'br') { out += '\n'; continue; }
                if ((tg === 'div' || tg === 'p') && out && !/\n$/.test(out)) out += '\n';
                walk(n);
            }
        })(el);
        return out.replace(/\u00a0/g, ' ');
    }

    var BLOCK_SEL = 'h1,h2,h3,h4,h5,h6,p,ul,ol,blockquote,pre,hr,div,table';
    var CONTENT_SEL = 'img,hr,pre,table,ul,ol,input,[data-md-request],[data-md-request-invalid],[data-md-audio],[data-md-layout],[data-md-cell]';

    function isEmptyEditableParagraph(el) {
        return !!el && /^(P|DIV)$/.test(el.tagName) && !el.hasAttribute('data-md-audio') &&
            !el.hasAttribute('data-md-layout') && !el.hasAttribute('data-md-cell') && !el.hasAttribute('data-md-request') && !el.hasAttribute('data-md-request-invalid') &&
            !el.textContent.replace(/[\u200b\u00a0]/g, ' ').trim() && !el.querySelector(CONTENT_SEL);
    }

    function layoutToMd(el) {
        var type = mdLayoutType(el.getAttribute('data-md-layout'));
        if (!type) return html2md(el);
        if (type !== 'row') return ':::' + type + '\n' + html2md(el) + '\n:::';

        var left = document.createElement('div'), right = document.createElement('div');
        var children = Array.prototype.slice.call(el.childNodes);
        var hasCells = children.some(function (node) {
            return node.nodeType === 1 && /^(left|right)$/.test(node.getAttribute('data-md-cell') || '');
        });
        var first = true;
        children.forEach(function (node) {
            if (node.nodeType === 3 && !node.nodeValue.trim()) return;
            var side = node.nodeType === 1 ? node.getAttribute('data-md-cell') : '';
            if (hasCells && /^(left|right)$/.test(side || '')) {
                var target = side === 'left' ? left : right;
                Array.prototype.forEach.call(node.childNodes, function (child) { target.appendChild(child.cloneNode(true)); });
            } else {
                (hasCells || !first ? right : left).appendChild(node.cloneNode(true));
                first = false;
            }
        });
        // 显式分隔同时保留空左侧、空右侧，避免用空行数量猜列边界。
        return ':::row\n' + html2md(left) + '\n:::split\n' + html2md(right) + '\n:::';
    }

    function html2md(root) {
        var out = [];

        function emitBlock(el) {
            if(el.hasAttribute('data-md-request')||el.hasAttribute('data-md-request-invalid')){out.push(nodeToMd(el));return;}
            if (el.hasAttribute('data-md-audio')) { out.push(nodeToMd(el)); return; }
            if (mdLayoutType(el.getAttribute('data-md-layout'))) { out.push(layoutToMd(el)); return; }
            var tag = el.tagName.toLowerCase();
            if (/^h[1-6]$/.test(tag)) {
                // 空标题 = 不是内容。在标题最前面按回车时浏览器会造一个 <h1><br></h1>，
                // 若照常序列化成一行 '#'，重开后会被当成普通段落（正文里凭空多出个 #）。
                // 所以降级成空块 —— 和空段落一个待遇，变成用户留的那行白。
                if (!el.textContent.trim() && !el.querySelector('img,[data-md-audio]')) { out.push(''); return; }
                out.push(new Array(Number(tag[1]) + 1).join('#') + ' ' + inlineToMd(el).trim().replace(/\n/g, '<br>'));
                return;
            }
            if (tag === 'p') {
                // 占位的尾段落（ensureTail 补的）不算内容，否则每次编辑都会多出一行空白
                if (el.getAttribute && el.getAttribute('data-tail') === '1' && isEmptyEditableParagraph(el)) return;
                if (el.querySelector(BLOCK_SEL)) { walk(el); return; }
                out.push(inlineToMd(el).replace(/\s+$/, ''));
                return;
            }
            if (tag === 'ul' || tag === 'ol') {
                var markdownList = listToMd(el, 0);
                // 整表都空（在列表最前面按回车时浏览器会造一个空 <li>）→ 不是内容。
                // 否则 md 里会多出一个裸 '- '，重开后变成空列表项而不是用户留的那行白。
                if (listIsEmpty(el)) { out.push(''); return; }
                if (markdownList) out.push(markdownList);
                return;
            }
            if (tag === 'table') {
                var rows = Array.prototype.slice.call(el.querySelectorAll('tr'));
                if (!rows.length) return;
                function rowCells(row) {
                    return Array.prototype.slice.call(row.children).filter(function (cell) {
                        return /^(th|td)$/i.test(cell.tagName);
                    }).map(function (cell) {
                        // 单元格里的 <br>（单元格内换行）序列化成 <br>，其它位置照旧
                        return inlineToMd(cell).trim().replace(/\|/g, '\\|').replace(/\n+/g, '<br>');
                    });
                }
                var headCells = rowCells(rows[0]);
                if (!headCells.length) return;
                var aligns = Array.prototype.slice.call(rows[0].children).map(function (cell) {
                    var a = (cell.getAttribute('align') || '').toLowerCase();
                    return a === 'center' ? ':---:' : (a === 'right' ? '---:' : (a === 'left' ? ':---' : '---'));
                }).slice(0, headCells.length);
                var tableLines = ['| ' + headCells.join(' | ') + ' |', '| ' + aligns.join(' | ') + ' |'];
                for (var ri = 1; ri < rows.length; ri++) {
                    var row = rowCells(rows[ri]);
                    while (row.length < headCells.length) row.push('');
                    tableLines.push('| ' + row.slice(0, headCells.length).join(' | ') + ' |');
                }
                out.push(tableLines.join('\n'));
                return;
            }
            if (tag === 'blockquote') {
                var qInline = html2md(el).trim();
                // 空引用（在引用最前面按回车时浏览器会造一个空 <blockquote>）→ 不是内容，
                // 降级成空块，别在 md 里留下一个孤零零的 '>'（重开会变成空引用）
                if (!qInline && !el.querySelector('img,pre,table,hr,[data-md-audio]')) { out.push(''); return; }
                out.push('> ' + qInline.replace(/\n/g, '\n> '));
                return;
            }
            if (tag === 'pre') {
                // 保留围栏的语言标识（```python），否则刷新后语言就没了；
                // 尾巴上的空行也照原样留着 —— 用户在代码里敲的空行不该被吃掉（来回仍逐字一致）
                var lng = el.getAttribute('data-lang') || '';
                var code = preText(el), fenceLength = 3, fenceSymbol = lng.indexOf('`') >= 0 ? '~' : '`';
                (code.match(fenceSymbol === '`' ? /`+/g : /~+/g) || []).forEach(function (run) { fenceLength = Math.max(fenceLength, run.length + 1); });
                var fence = new Array(fenceLength + 1).join(fenceSymbol);
                out.push(fence + lng + '\n' + code + '\n' + fence);
                return;
            }
            if (tag === 'hr') { out.push('---'); return; }
            if (tag === 'div' || tag === 'table' || tag === 'tbody') {
                walk(el);
                return;
            }
            if (el.querySelector(BLOCK_SEL)) { walk(el); return; }
            var t = inlineToMd(el);
            if (t.trim()) out.push(t);
        }

        function walk(el) {
            var kids = el.childNodes || [];
            var buffer = '';
            for (var i = 0; i < kids.length; i++) {
                var n = kids[i];
                if (n.nodeType === 3) { buffer += escapeUnderlineMd(n.nodeValue); continue; }
                if (n.nodeType !== 1) continue;
                if (n.matches && (n.matches(BLOCK_SEL) || n.querySelector(BLOCK_SEL))) {
                    if (buffer.trim()) { out.push(buffer.replace(/\s+$/, '')); buffer = ''; }
                    else if (buffer) { buffer = ''; }
                    emitBlock(n);
                } else {
                    buffer += nodeToMd(n);
                }
            }
            if (buffer.trim()) out.push(buffer.replace(/\s+$/, ''));
        }

        walk(root);

        // 块与块之间空一行（'\n\n'）。空块 = 用户刻意留的空段落，每个再补一个空行。
        // 和 md2html 那边「n 个连续空行 → n-1 个空段落」互为反向，空行才能原样往返；
        // 不这么做的话，正文里的空行会在「保存 → 重开」之间被悄悄吃掉。
        // 文档开头的空段落也要留着（md 里就是前导的换行）：开头没有前置块、不占分隔符，
        // 所以 k 个空段落 = k 个换行 —— md2html 那边按同样的账还原。
        // 结尾的空块攒到最后一起吐（md2html 那边按 pendingBlank-2 还原）。
        var md = '';
        var head = 0;       // 文档开头的空块数 → 前导换行
        var extra = 0;      // 待补的额外空行（每个空块算一行）
        var started = false;
        for (var k = 0; k < out.length; k++) {
            // 各文字块自行裁尾；这里不能全局裁剪，否则会改动代码行末的空格和缩进。
            var v = out[k].replace(/\u00a0/g, ' ');
            if (v.trim() === '') { if (started) extra++; else head++; continue; }
            md += (started ? new Array(2 + extra + 1).join('\n') : new Array(head + 1).join('\n')) + v;
            extra = 0;
            started = true;
        }
        // 末尾还剩空块（用户在文档最后留的白）也要吐出来 —— md2html 那边按 pendingBlank-2 还原
        if (started && extra) md += new Array(2 + extra + 1).join('\n');
        return md;
    }

    // Markdown 归一化：md -> html -> md（幂等）。
    // 块之间统一补空行等是「规范化」，不是内容变化；不归一化的话，
    // 每次 原文 <-> MD 切换都会因为这点差异误报「未保存」。
    function normMd(md) {
        var d = document.createElement('div');
        d.innerHTML = md2html(md == null ? '' : md);
        return html2md(d);
    }
    function sameMd(a, b) {
        if (a === b) return true;
        return normMd(a) === normMd(b);
    }

    /* ================= 设置 ================= */

    function autoSaveOn() { return $('autoSave').checked; }

    function saveDelaySec() {
        var v = parseFloat($('saveDelay').value);
        if (isNaN(v) || v < 0) v = 5;
        if (v > 600) v = 600;

    }

    // 侧边栏宽度：写成 :root 上的 CSS 变量（不用元素内联样式，否则会盖掉窄屏媒体查询）
    function applySideWidth(px) {
        var w = Math.round(px);
        if (!isFinite(w)) return;
        sideWidth = Math.max(SIDE_MIN, Math.min(SIDE_MAX, w));
        document.documentElement.style.setProperty('--side-w', sideWidth + 'px');
    }

    // 纸张宽度（拖动条），同样走 CSS 变量
    function applyDocWidth(px) {
        var w = Math.round(px);
        if (!isFinite(w)) return;
        docWidth = Math.max(DOC_MIN, Math.min(DOC_MAX, w));
        document.documentElement.style.setProperty('--doc-w', docWidth + 'px');
        var sl = $('docWidth');
        if (sl && String(sl.value) !== String(docWidth)) sl.value = String(docWidth);
        var lb = $('docWidthVal');
        if (lb) lb.textContent = docWidth + 'px';
    }

    function saveSettings() {
        try {
            localStorage.setItem('memos_sidew', String(sideWidth));
            localStorage.setItem('memos_docw', String(docWidth));
            localStorage.setItem('memos_key', $('apiKey').value);
            // 链接参数指定的身份不落盘：发出去的链接不该改写本机的默认值
            if (!urlIdent('n')) localStorage.setItem('memos_book', $('bookId').value);
            if (!urlIdent('u')) localStorage.setItem('memos_user', $('userId').value);
            localStorage.setItem('memos_autosave', autoSaveOn() ? '1' : '0');
            localStorage.setItem('memos_delay', $('saveDelay').value);
            localStorage.setItem('memos_history_limit', String(historyLimit()));
            localStorage.setItem('memos_logvisit', logVisitOn() ? '1' : '0');
        } catch (e) {}
    }
    function applyFavicon(choice){
        var icons={default:'https://mqmux.github.io/favicon.ico',pink:'https://mqmux.github.io/favicon-current.ico',purple:'https://mqmux.github.io/favicon-purple.ico'};
        if(!Object.prototype.hasOwnProperty.call(icons,choice||''))choice='default';
        $('noteFavicon').setAttribute('href',icons[choice]);
        Array.prototype.forEach.call(document.querySelectorAll('[data-favicon]'),function(button){var selected=button.dataset.favicon===choice;button.setAttribute('aria-checked',String(selected));button.tabIndex=selected?0:-1;});
    }
    function chooseFavicon(choice){applyFavicon(choice);try{localStorage.setItem('memos_favicon',choice);}catch(_){}}
    function updateDocumentTitle(){
        var lines=String(currentMd()||'').split(/\r?\n/),title='';
        for(var i=0;i<lines.length;i++){
            var line=lines[i].trim();if(line===':::request'){var bounds=mdLayoutBounds(lines,i,'request');if(bounds){try{title=normalizeRequestConfig(JSON.parse(lines.slice(i+1,bounds.end).join('\n'))).title;break;}catch(_){i=bounds.end;continue;}}}if(!line||/^:::(?:[ \t]*(?:center|right|small|row|cards|split))?[ \t]*$/.test(line)||/^(`{3,}|~{3,})/.test(line)||/^([-*_])(?:[ \t]*\1){2,}[ \t]*$/.test(line))continue;
            line=line.replace(/^(?:>\s*)+/,'').replace(/^#{1,6}(?:\s+|$)/,'').replace(/^(?:[-+*]|\d+[.)])\s+(?:\[[ xX✓✔☑]\]\s*)?/,'').replace(/\s*\{(?:icon:[a-z-]+|audio|card|file|width=[^}]+)\}/gi,'');
            var box=document.createElement('div');box.innerHTML=inlineMd(esc(line),true);
            Array.prototype.forEach.call(box.querySelectorAll('img'),function(image){image.replaceWith(document.createTextNode(image.getAttribute('alt')||''));});
            title=box.textContent.replace(/[\u200b\u00a0]/g,' ').replace(/\s+/g,' ').trim();if(title)break;
        }
        var next=title?title.slice(0,120):'Note';if(document.title!==next)document.title=next;
    }

    function loadSettings() {
        var iconChoice='default';try{iconChoice=localStorage.getItem('memos_favicon')||'default';}catch(_){}applyFavicon(iconChoice);
        var k = localStorage.getItem('memos_key');
        $('apiKey').value = k || DEFAULT_KEY;
        // 身份：链接参数 > 本地设置 > 内置默认（?n=/ ?u= 只在本次打开生效）
        $('bookId').value = urlIdent('n') || localStorage.getItem('memos_book') || 'note';
        $('userId').value = urlIdent('u') || localStorage.getItem('memos_user') || 'user';
        markUrlIdents();
        // 自动保存：默认关闭；保留用户之前明确保存的开关选择
        $('autoSave').checked = localStorage.getItem('memos_autosave') === '1';
        var d = localStorage.getItem('memos_delay');
        $('saveDelay').value = (d === null || d === '') ? '5' : d;

        var historyCount = parseInt(localStorage.getItem('memos_history_limit'), 10);
        $('historyLimit').value = String(isNaN(historyCount) ? DEFAULT_HISTORY_LIMIT :
            Math.max(1, Math.min(MAX_MESSAGES, historyCount)));

        $('logVisit').checked = localStorage.getItem('memos_logvisit') !== '0';

        // 侧边栏宽度
        var sw = parseFloat(localStorage.getItem('memos_sidew'));
        if (!isNaN(sw) && sw > 0) applySideWidth(sw);

        // 纸张宽度
        var dw = parseFloat(localStorage.getItem('memos_docw'));

    // 只清除此版本实际使用的配置；完整版 note 的模型、温度和总结提示词保持原值。
    // 笔记内容存在服务器上，不受影响；清完直接重新载入，回到刚打开时的默认状态。
    function resetSettings() {

            '· API Key（回落到内置默认）\n' +
            '· 笔记本 / 用户\n' +
            '· 历史条数、目录展开状态\n' +
            '· 纸张宽度、侧栏宽度\n' +
            '· 自动保存、保存延迟\n' +
            '· 记录访问开关和浏览器图标\n\n' +
            '笔记内容存在服务器上，不受影响。\n' +
            '（若当前链接带 ?n= / ?u=，重置后身份仍由链接决定，属正常。）\n\n确定重置吗？')) return;
        var keys = [
            'memos_key', 'memos_book', 'memos_user', 'memos_autosave', 'memos_delay',
            'memos_history_limit', 'memos_docw', 'memos_sidew', 'memos_logvisit',

    /* ================= 工具 ================= */

    // MemOS 读回的 content 是一个「JSON 字符串字面量」：首尾带引号，内部的双引号和反斜杠
    // 都被转义（写入 `AA"BB` 读回是 `"AA\"BB"`）。所以必须按 JSON 解码，
    // 只剥首尾引号会留下 `\"`、`\\` 残渣。实测 JSON.parse 在引号/反斜杠/中文/emoji 下均正确。
    function unquote(s) {
        if (s.length >= 2 && s.charAt(0) === '"' && s.charAt(s.length - 1) === '"') {
            try { return JSON.parse(s); } catch (e) { return s.substring(1, s.length - 1); }
        }
        return s;
    }

    // 存储层 <-> 显示层 的互转：换行、空格、制表符都要用替身字符（否则会被 MemOS 洗掉）
    // 注意 nbsp 要先归一成普通空格，contenteditable 在 <p> 里打/粘的空格常是 U+00A0
    function encodeNl(md) {
        return String(md)
            .replace(/\r\n?/g, '\n')
            .replace(/\u00A0/g, ' ')
            .replace(/<br\s*\/?>/gi, '&amp;lt;br&amp;gt;')   // 见上：多包一层实体，落库才是 &lt;br&gt;
            .replace(/\t/g, TB)
            .replace(/ /g, SP)
            .replace(/\n/g, NL);
    }
    function decodeNl(s) {
        return String(s)
            .split(NL).join('\n')
            .split(TB).join('\t')
            .split(SP).join(' ')
            .split('&lt;br&gt;').join('<br>');
    }

    var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };

    // 完整日期时间：2026-09-29 13:53:03
    function fmtFull(ms) {
        if (!ms) return '';
        var d = new Date(Number(ms));
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
               ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }

    function kindOf(text) {
        var s = String(text).trim();
        if (s === EMPTY_STATE_MARKER) return 'blank';
        if (PLACEHOLDER.test(s)) return 'void';
        if (INTERNAL.test(s)) return 'internal';
        return 'note';
    }

    function latestState() {
        for (var i = notes.length - 1; i >= 0; i--) {
            var kind = kindOf(notes[i].text);
            if (kind === 'note' || kind === 'blank') return notes[i];
        }
        return null;
    }

    function stateContent(note) {
        return note && kindOf(note.text) === 'blank' ? '' : (note ? note.text : '');
    }

    function setStatus(text, cls) {
        var fullText = text || '';
