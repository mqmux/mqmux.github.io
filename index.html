<script>
(function () {
    'use strict';

    var API = 'https://memos.memtensor.cn/api/openmem/v1';
    var DEFAULT_KEY = 'mpg-NFH2/LVRbJ1/oRoyWQyxq+hhbwG0ncnBphNvuue/';
    var MAX_MESSAGES = 50;          // get/message 的接口最大值
    var DEFAULT_HISTORY_LIMIT = 10;
    var SUM_SUFFIX = '__sum';       // 总结用的影子会话后缀（固定值，不是随机）
    // MemOS 存储层会「洗」content（以下均实测确认）：
    //   1) \n / \r\n 被折叠成空格，<br> 被当标签删掉 → 多行 Markdown 被压成一行；
    //   2) 连续空格被折叠，**行首缩进被整段吃掉**（'    return x' → 'return x'）→ 对 Python 代码是致命的；
    //   3) \t 被吃掉，U+00A0(NBSP) 也被当空白处理掉。
    // 实测 U+2028 / U+2002 / U+2003 等能原样存回，故统一「编码后存储、读回再还原」。
    var NL = '\u2028';   // 换行的替身 → 读回还原为 \n
    var SP = '\u2002';   // 空格的替身 → 读回还原为普通空格 U+0020
    var TB = '\u2003';   // 制表符的替身 → 读回还原为 \t
    // 单独的 # 是空白状态标记；kindOf 必须先精确匹配它，再检查普通占位符。
    var EMPTY_STATE_MARKER = '#';
    var PLACEHOLDER = /^[\s\-—–~.。·…*#_]*$/;   // 占位符：整条视为「作废」
    // 本应用自己发出的总结请求（旧版直接把 query 写进了笔记本，这里挡掉）
    var INTERNAL = /^(请总结我最近的笔记|以下是我的笔记)/;
    var SIDE_MIN = 190;             // 侧边栏可拖拽宽度的下限 / 上限
    var SIDE_MAX = 640;
    var DOC_MIN = 420;              // 纸张宽度滑块范围
    var DOC_MAX = 1400;
    var DOC_DEF = 760;

    // 旧版默认提示词（针对多条笔记归纳）；仅用于把用户浏览器里存的旧默认值升级掉
    var DEFAULT_SUM_PROMPT_V1 =
        '你是笔记整理助手。请对我提供的笔记按主题归纳成简洁的要点，最后补一句整体总结。' +
        '用 Markdown 输出（可用标题和列表），不要编造不存在的内容。';
    var DEFAULT_SUM_PROMPT =
        '你是笔记整理助手。请对我提供的这一条笔记做整理：提炼要点、理顺结构、必要时润色文字，' +
        '最后给一句简短总结。用 Markdown 输出，不要编造不存在的内容。';

    var $ = function (id) { return document.getElementById(id); };
    var editor = $('editor');
    var rawBox = $('rawBox');

    var notes = [];         // 全部 user 消息（含占位）
    var live = [];          // 过滤后的有效笔记
    var busy = false;
    var rawMode = false;    // false = Markdown 排版编辑；true = 原文编辑
    var lastSavedMd = null; // 最近一次成功写入 MemOS 的 markdown（null = 尚未与远端对齐）
    var lastSavedIsBlankState = false;
    var historyNeedsSave = false; // 用户从历史选中的版本，按保存时重新追加为最新版本
    var lastSavedAt = 0;    // 最近一次成功保存的时间戳
    var saveTimer = null;
    var loadedIdx = -1;     // 当前编辑器内容来自哪条历史（-1 = 新笔记）
    var sideWidth = 272;    // 侧边栏宽度（可拖拽，存 localStorage）
    var docWidth = DOC_DEF; // 纸张宽度（设置里拖动条调，存 localStorage）

    /* ================= Markdown 解析：md -> html ================= */

    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escAttr(s) {
        return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function safeHref(raw) {
        var value = String(raw || '').trim();
        if (/^(https?:|mailto:)/i.test(value) || /^(#|\/|\.\/|\.\.\/)/.test(value)) return value;
        return '';
    }

    function inlineMd(s) {
        // 1) 行内代码先抠出来寄存。否则里面的内容会被后面的规则二次解析：
        //    `__file__` 会先变成 <code>__file__</code>，再被 __x__ 规则吃成 <strong>file</strong>，
        //    序列化回 Markdown 就只剩 file —— 代码里的双下划线会凭空消失。
        // 2) 只支持 **粗体** / *斜体*，**不再支持下划线系（__粗体__ / _斜体_）**：
        //    Python 的 __file__ / __init__ / __name__ 太常见，按 Markdown 语义会被吃成粗体。
        var codes = [];
        s = s.replace(/`([^`]+)`/g, function (_, c) {
            codes.push(c);
            return '\u0001' + (codes.length - 1) + '\u0001';
        });
        s = s
            .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
            .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
            .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
            .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, src) {
                var safe = safeHref(src);
                return safe ? '<img src="' + escAttr(safe) + '" alt="' + escAttr(alt) + '" loading="lazy">' : alt;
            })
            .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, href) {
                var safe = safeHref(href);
                return safe ? '<a href="' + escAttr(safe) + '" target="_blank" rel="noreferrer">' + label + '</a>' : label;
            });
        return s.replace(/\u0001(\d+)\u0001/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
    }

    function isBlockStart(line) {
        return /^\s*(#{1,6}\s|>|[-*+]\s|\d+[.)]\s|```)/.test(line) ||
               /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line);
    }

    function tableCells(line) {
        var s = String(line).trim();
        if (s.charAt(0) === '|') s = s.slice(1);
        if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
        var cells = [], cell = '', escaped = false;
        for (var i = 0; i < s.length; i++) {
            var ch = s.charAt(i);
            if (escaped) { cell += ch; escaped = false; }
            else if (ch === '\\') escaped = true;
            else if (ch === '|') { cells.push(cell.trim()); cell = ''; }
            else cell += ch;
        }
        if (escaped) cell += '\\';
        cells.push(cell.trim());
        return cells;
    }

    function tableAlignments(line, count) {
        var cells = tableCells(line);
        if (cells.length !== count || !cells.length) return null;
        var aligns = [];
        for (var i = 0; i < cells.length; i++) {
            if (!/^:?-{3,}:?$/.test(cells[i])) return null;
            aligns.push(cells[i].charAt(0) === ':' && cells[i].charAt(cells[i].length - 1) === ':' ? 'center' :
                (cells[i].charAt(cells[i].length - 1) === ':' ? 'right' : (cells[i].charAt(0) === ':' ? 'left' : '')));
        }
        return aligns;
    }

    function listToken(line) {
        var m = String(line).match(/^([ \t]*)([-*+]|\d+[.)])\s+(.*)$/);
        if (!m) return null;
        var marker = m[2];
        return {
            indent: m[1].replace(/\t/g, '    ').length,
            type: /^\d/.test(marker) ? 'ol' : 'ul',
            start: /^\d/.test(marker) ? (parseInt(marker, 10) || 1) : 1,
            text: m[3]
        };
    }

    function newList(token) {
        return { type: token.type, start: token.start, items: [] };
    }

    function renderList(list) {
        var attr = list.type === 'ol' && list.start > 1 ? ' start="' + list.start + '"' : '';
        var html = '<' + list.type + attr + '>';
        for (var i = 0; i < list.items.length; i++) {
            var item = list.items[i];
            var task = list.type === 'ul' ? item.text.match(/^\[([ xX])\]\s*(.*)$/) : null;
            var content = task ? task[2] : item.text;
            html += '<li' + (task ? ' data-task="' + (task[1].toLowerCase() === 'x' ? 'done' : 'todo') + '"' : '') + '>' +
                (task ? '<input type="checkbox" tabindex="-1"' + (task[1].toLowerCase() === 'x' ? ' checked' : '') + '> ' : '') +
                inlineMd(esc(content));
            for (var j = 0; j < item.children.length; j++) html += renderList(item.children[j]);
            html += '</li>';
        }
        return html + '</' + list.type + '>';
    }

    function listToMd(list, depth) {
        var lines = [];
        var idx = Number(list.getAttribute('start')) || 1;
        for (var i = 0; i < list.children.length; i++) {
            var li = list.children[i];
            if (li.tagName.toLowerCase() !== 'li') continue;
            var taskState = li.getAttribute('data-task');
            var check = li.querySelector(':scope > input[type="checkbox"]');
            var content = '';
            var nested = [];
            for (var j = 0; j < li.childNodes.length; j++) {
                var child = li.childNodes[j];
                if (child.nodeType === 1 && child.tagName.toLowerCase() === 'input') continue;
                if (child.nodeType === 1 && /^(ul|ol)$/i.test(child.tagName)) { nested.push(child); continue; }
                content += child.nodeType === 1 ? nodeToMd(child) : (child.nodeType === 3 ? child.nodeValue : '');
            }
            var prefix = list.tagName.toLowerCase() === 'ul' ?
                (taskState ? '- [' + (check && check.checked ? 'x' : ' ') + '] ' : '- ') : (idx++) + '. ';
            var indent = new Array(depth + 1).join('  ');
            lines.push(indent + prefix + content.trim().replace(/\n/g, '\n' + indent + '  '));
            for (var n = 0; n < nested.length; n++) lines.push(listToMd(nested[n], depth + 1));
        }
        return lines.join('\n');
    }

    function md2html(md) {
        var src = String(md == null ? '' : md).replace(/\r\n?/g, '\n');
        var lines = src.split('\n');
        var html = [];
        var list = null;     // {type, items}
        var quote = null;    // [line]
        var i;

        function closeList() {
            if (list) {
                var attr = list.type === 'ol' && list.start > 1 ? ' start="' + list.start + '"' : '';
                html.push('<' + list.type + attr + '>' + list.items.join('') + '</' + list.type + '>'); list = null;
            }
        }
        function closeQuote() {
            if (quote) {
                html.push('<blockquote>' + quote.map(function (t) { return inlineMd(esc(t)); }).join('<br>') + '</blockquote>');
                quote = null;
            }
        }
        function closeAll() { closeList(); closeQuote(); }

        for (i = 0; i < lines.length; i++) {
            var line = lines[i];

            // 代码块
            if (/^\s*```/.test(line)) {
                closeAll();
                var lang = line.replace(/^\s*```/, '').replace(/[`\s]+$/, '').trim();
                var buf = [];
                i++;
                while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
                html.push('<pre' + (lang ? ' data-lang="' + escAttr(esc(lang)) + '"' : '') + '><code>' +
                    esc(buf.join('\n')) + '</code></pre>');
                continue;
            }

            // 空行
            if (!line.trim()) { closeAll(); continue; }

            // GFM 表格
            if (line.indexOf('|') >= 0 && i + 1 < lines.length) {
                var headers = tableCells(line);
                var aligns = tableAlignments(lines[i + 1], headers.length);
                if (aligns) {
                    closeAll();
                    var tableHtml = '<table><thead><tr>';
                    for (var th = 0; th < headers.length; th++) {
                        tableHtml += '<th' + (aligns[th] ? ' align="' + aligns[th] + '"' : '') + '>' + inlineMd(esc(headers[th])) + '</th>';
                    }
                    tableHtml += '</tr></thead><tbody>';
                    i += 2;
                    while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim()) {
                        var cells = tableCells(lines[i]);
                        tableHtml += '<tr>';
                        for (var td = 0; td < headers.length; td++) {
                            tableHtml += '<td' + (aligns[td] ? ' align="' + aligns[td] + '"' : '') + '>' + inlineMd(esc(cells[td] || '')) + '</td>';
                        }
                        tableHtml += '</tr>';
                        i++;
                    }
                    i--;
                    html.push(tableHtml + '</tbody></table>');
                    continue;
                }
            }

            // 分隔线
            if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeAll(); html.push('<hr>'); continue; }

            // 标题
            var hm = line.match(/^\s*(#{1,6})\s+(.*)$/);
            if (hm) {
                closeAll();
                var lv = hm[1].length;
                html.push('<h' + lv + '>' + inlineMd(esc(hm[2].trim())) + '</h' + lv + '>');
                continue;
            }

            // 引用
            var qm = line.match(/^\s*>\s?(.*)$/);
            if (qm) {
                closeList();
                if (!quote) quote = [];
                quote.push(qm[1]);
                continue;
            }
            closeQuote();

            // 有序、无序及缩进嵌套列表
            var firstItem = listToken(line);
            if (firstItem) {
                closeAll();
                var rootIndent = firstItem.indent;
                var rootList = newList(firstItem);
                var stack = [{ indent: rootIndent, list: rootList, owner: null }];
                var cursor = i;
                while (cursor < lines.length) {
                    var itemToken = listToken(lines[cursor]);
                    if (!itemToken || itemToken.indent < rootIndent) break;
                    var frame = stack[stack.length - 1];
                    if (itemToken.indent === rootIndent && itemToken.type !== rootList.type) break;
                    while (stack.length > 1 && itemToken.indent < stack[stack.length - 1].indent) stack.pop();
                    frame = stack[stack.length - 1];
                    if (itemToken.indent > frame.indent) {
                        var owner = frame.list.items[frame.list.items.length - 1];
                        if (!owner) break;
                        var childList = newList(itemToken);
                        owner.children.push(childList);
                        stack.push({ indent: itemToken.indent, list: childList, owner: owner });
                        frame = stack[stack.length - 1];
                    } else if (itemToken.type !== frame.list.type) {
                        if (!frame.owner) break;
                        var siblingList = newList(itemToken);
                        frame.owner.children.push(siblingList);
                        frame.list = siblingList;
                    }
                    frame.list.items.push({ text: itemToken.text, children: [] });
                    cursor++;
                }
                html.push(renderList(rootList));
                i = cursor - 1;
                continue;
            }

            // 段落：把连续普通行并进同一个 <p>（行内换行用 <br>）
            closeAll();
            var pb = [line];
            while (i + 1 < lines.length && lines[i + 1].trim() && !isBlockStart(lines[i + 1])) {
                i++;
                pb.push(lines[i]);
            }
            html.push('<p>' + pb.map(function (t) { return inlineMd(esc(t)); }).join('<br>') + '</p>');
        }
        closeAll();
        return html.join('\n');
    }

    /* ================= Markdown 序列化：html -> md ================= */

    // 单个元素 -> Markdown。列表序列化会把 li 的直接子元素逐个取出，
    // 所以必须在元素本身识别 strong/code 等标签；只遍历它的子节点会丢掉包裹标记。
    function nodeToMd(node) {
        var tag = node.tagName.toLowerCase();
        if (tag === 'img') return '![' + (node.getAttribute('alt') || '') + '](' + (node.getAttribute('src') || '') + ')';
        if (tag === 'br') return '\n';
        var inner = inlineToMd(node);
        if (tag === 'strong' || tag === 'b') return '**' + inner + '**';
        if (tag === 'em' || tag === 'i') return '*' + inner + '*';
        if (tag === 'code') return '`' + inner + '`';
        if (tag === 'del' || tag === 's' || tag === 'strike') return '~~' + inner + '~~';
        if (tag === 'a') return '[' + inner + '](' + (node.getAttribute('href') || '') + ')';
        return inner;
    }

    function inlineToMd(node) {
        var s = '';
        var kids = node.childNodes || [];
        for (var i = 0; i < kids.length; i++) {
            var n = kids[i];
            if (n.nodeType === 3) { s += n.nodeValue; continue; }
            if (n.nodeType !== 1) continue;
            s += nodeToMd(n);
        }
        return s;
    }

    // 代码块取文本：<br> 也要算成换行。
    // 浏览器在 contenteditable 的 <pre> 里按回车插的是 <br>，而 textContent 不认 <br>，
    // 于是整段代码被压成一行 —— 这就是「代码块保存后刷新格式就没了」的根因。
    function preText(el) {
        var out = '';
        (function walk(node) {
            for (var i = 0; i < node.childNodes.length; i++) {
                var n = node.childNodes[i];
                if (n.nodeType === 3) { out += n.nodeValue; continue; }
                if (n.nodeType !== 1) continue;
                var tg = n.tagName.toLowerCase();
                if (tg === 'br') { out += '\n'; continue; }
                if ((tg === 'div' || tg === 'p') && out && !/\n$/.test(out)) out += '\n';
                walk(n);
            }
        })(el);
        return out.replace(/\u00a0/g, ' ');
    }

    var BLOCK_SEL = 'h1,h2,h3,h4,h5,h6,p,ul,ol,blockquote,pre,hr,div,table';

    function html2md(root) {
        var out = [];

        function emitBlock(el) {
            var tag = el.tagName.toLowerCase();
            if (/^h[1-6]$/.test(tag)) {
                out.push(new Array(Number(tag[1]) + 1).join('#') + ' ' + inlineToMd(el).trim());
                return;
            }
            if (tag === 'p') { out.push(inlineToMd(el).replace(/\s+$/, '')); return; }
            if (tag === 'ul' || tag === 'ol') {
                var markdownList = listToMd(el, 0);
                if (markdownList) out.push(markdownList);
                return;
            }
            if (tag === 'table') {
                var rows = Array.prototype.slice.call(el.querySelectorAll('tr'));
                if (!rows.length) return;
                function rowCells(row) {
                    return Array.prototype.slice.call(row.children).filter(function (cell) {
                        return /^(th|td)$/i.test(cell.tagName);
                    }).map(function (cell) { return inlineToMd(cell).trim().replace(/\|/g, '\\|'); });
                }
                var headCells = rowCells(rows[0]);
                if (!headCells.length) return;
                var aligns = Array.prototype.slice.call(rows[0].children).map(function (cell) {
                    var a = (cell.getAttribute('align') || '').toLowerCase();
                    return a === 'center' ? ':---:' : (a === 'right' ? '---:' : (a === 'left' ? ':---' : '---'));
                }).slice(0, headCells.length);
                var tableLines = ['| ' + headCells.join(' | ') + ' |', '| ' + aligns.join(' | ') + ' |'];
                for (var ri = 1; ri < rows.length; ri++) {
                    var row = rowCells(rows[ri]);
                    while (row.length < headCells.length) row.push('');
                    tableLines.push('| ' + row.slice(0, headCells.length).join(' | ') + ' |');
                }
                out.push(tableLines.join('\n'));
                return;
            }
            if (tag === 'blockquote') {
                out.push('> ' + inlineToMd(el).trim().replace(/\n/g, '\n> '));
                return;
            }
            if (tag === 'pre') {
                // 保留围栏的语言标识（```python），否则刷新后语言就没了
                var lng = el.getAttribute('data-lang') || '';
                out.push('```' + lng + '\n' + preText(el).replace(/\n+$/, '') + '\n```');
                return;
            }
            if (tag === 'hr') { out.push('---'); return; }
            if (tag === 'div' || tag === 'table' || tag === 'tbody') {
                walk(el);
                return;
            }
            var t = inlineToMd(el);
            if (t.trim()) out.push(t);
        }

        function walk(el) {
            var kids = el.childNodes || [];
            var buffer = '';
            for (var i = 0; i < kids.length; i++) {
                var n = kids[i];
                if (n.nodeType === 3) { buffer += n.nodeValue; continue; }
                if (n.nodeType !== 1) continue;
                if (n.matches && n.matches(BLOCK_SEL)) {
                    if (buffer.trim()) { out.push(buffer.replace(/\s+$/, '')); buffer = ''; }
                    else if (buffer) { buffer = ''; }
                    emitBlock(n);
                } else {
                    buffer += inlineToMd(n);
                }
            }
            if (buffer.trim()) out.push(buffer.replace(/\s+$/, ''));
        }

        walk(root);

        // 去掉空块、合并连续空行，块间空一行
        var res = [];
        for (var k = 0; k < out.length; k++) {
            var v = out[k].replace(/\u00a0/g, ' ');
            if (v.trim() === '') continue;
            res.push(v.replace(/[ \t]+$/gm, ''));
        }
        return res.join('\n\n');
    }

    // Markdown 归一化：md -> html -> md（幂等）。
    // 块之间统一补空行等是「规范化」，不是内容变化；不归一化的话，
    // 每次 原文 <-> MD 切换都会因为这点差异误报「未保存」。
    function normMd(md) {
        var d = document.createElement('div');
        d.innerHTML = md2html(md == null ? '' : md);
        return html2md(d);
    }
    function sameMd(a, b) {
        if (a === b) return true;
        return normMd(a) === normMd(b);
    }

    /* ================= 设置 ================= */

    function autoSaveOn() { return $('autoSave').checked; }

    function saveDelaySec() {
        var v = parseFloat($('saveDelay').value);
        if (isNaN(v) || v < 0) v = 5;
        if (v > 600) v = 600;
        return v;
    }

    function sumPrompt() {
        var v = $('sumPrompt').value.trim();
        return v || DEFAULT_SUM_PROMPT;
    }

    // 侧边栏宽度：写成 :root 上的 CSS 变量（不用元素内联样式，否则会盖掉窄屏媒体查询）
    function applySideWidth(px) {
        var w = Math.round(px);
        if (!isFinite(w)) return;
        sideWidth = Math.max(SIDE_MIN, Math.min(SIDE_MAX, w));
        document.documentElement.style.setProperty('--side-w', sideWidth + 'px');
    }

    // 纸张宽度（拖动条），同样走 CSS 变量
    function applyDocWidth(px) {
        var w = Math.round(px);
        if (!isFinite(w)) return;
        docWidth = Math.max(DOC_MIN, Math.min(DOC_MAX, w));
        document.documentElement.style.setProperty('--doc-w', docWidth + 'px');
        var sl = $('docWidth');
        if (sl && String(sl.value) !== String(docWidth)) sl.value = String(docWidth);
        var lb = $('docWidthVal');
        if (lb) lb.textContent = docWidth + 'px';
    }

    function saveSettings() {
        try {
            localStorage.setItem('memos_sidew', String(sideWidth));
            localStorage.setItem('memos_docw', String(docWidth));
            localStorage.setItem('memos_key', $('apiKey').value);
            localStorage.setItem('memos_book', $('bookId').value);
            localStorage.setItem('memos_user', $('userId').value);
            localStorage.setItem('memos_model', $('modelSelect').value);
            localStorage.setItem('memos_temp', $('temperature').value);
            localStorage.setItem('memos_autosave', autoSaveOn() ? '1' : '0');
            localStorage.setItem('memos_delay', $('saveDelay').value);
            localStorage.setItem('memos_history_limit', String(historyLimit()));
            localStorage.setItem('memos_sumprompt', $('sumPrompt').value);
            localStorage.setItem('memos_rawmode', rawMode ? '1' : '0');
        } catch (e) {}
    }
    function loadSettings() {
        var k = localStorage.getItem('memos_key');
        $('apiKey').value = k || DEFAULT_KEY;
        $('bookId').value = localStorage.getItem('memos_book') || 'note';
        $('userId').value = localStorage.getItem('memos_user') || 'u1';
        var m = localStorage.getItem('memos_model');
        var opts = Array.prototype.slice.call($('modelSelect').options).map(function (o) { return o.value; });
        // 存的模型可能已经不在列表里（比如以前的 qwen2.5-72b-instruct），否则会选成空值
        $('modelSelect').value = (m && opts.indexOf(m) >= 0) ? m : 'qwen3-32b';
        var t = localStorage.getItem('memos_temp');
        if (t) $('temperature').value = t;

        // 自动保存：默认关闭；保留用户之前明确保存的开关选择
        $('autoSave').checked = localStorage.getItem('memos_autosave') === '1';
        var d = localStorage.getItem('memos_delay');
        $('saveDelay').value = (d === null || d === '') ? '5' : d;

        var historyCount = parseInt(localStorage.getItem('memos_history_limit'), 10);
        $('historyLimit').value = String(isNaN(historyCount) ? DEFAULT_HISTORY_LIMIT :
            Math.max(1, Math.min(MAX_MESSAGES, historyCount)));

        // 总结提示词：本地保存，默认值直接显示在输入框里
        var sp = localStorage.getItem('memos_sumprompt');
        // 旧版默认提示词（按多条归纳）自动升级为新默认（按单条整理）；用户自定义过的原样保留
        if (sp === DEFAULT_SUM_PROMPT_V1) {
            sp = DEFAULT_SUM_PROMPT;
            try { localStorage.setItem('memos_sumprompt', sp); } catch (e) {}
        }
        $('sumPrompt').value = (sp === null) ? DEFAULT_SUM_PROMPT : sp;

        // 侧边栏宽度
        var sw = parseFloat(localStorage.getItem('memos_sidew'));
        if (!isNaN(sw) && sw > 0) applySideWidth(sw);

        // 纸张宽度
        var dw = parseFloat(localStorage.getItem('memos_docw'));
        applyDocWidth(!isNaN(dw) && dw > 0 ? dw : DOC_DEF);
    }

    /* ================= 工具 ================= */

    // MemOS 读回的 content 是一个「JSON 字符串字面量」：首尾带引号，内部的双引号和反斜杠
    // 都被转义（写入 `AA"BB` 读回是 `"AA\"BB"`）。所以必须按 JSON 解码，
    // 只剥首尾引号会留下 `\"`、`\\` 残渣。实测 JSON.parse 在引号/反斜杠/中文/emoji 下均正确。
    function unquote(s) {
        if (s.length >= 2 && s.charAt(0) === '"' && s.charAt(s.length - 1) === '"') {
            try { return JSON.parse(s); } catch (e) { return s.substring(1, s.length - 1); }
        }
        return s;
    }

    // 存储层 <-> 显示层 的互转：换行、空格、制表符都要用替身字符（否则会被 MemOS 洗掉）
    // 注意 nbsp 要先归一成普通空格，contenteditable 在 <p> 里打/粘的空格常是 U+00A0
    function encodeNl(md) {
        return String(md)
            .replace(/\r\n?/g, '\n')
            .replace(/\u00A0/g, ' ')
            .replace(/\t/g, TB)
            .replace(/ /g, SP)
            .replace(/\n/g, NL);
    }
    function decodeNl(s) {
        return String(s)
            .split(NL).join('\n')
            .split(TB).join('\t')
            .split(SP).join(' ');
    }

    var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };

    // 完整日期时间：2026-09-29 13:53:03
    function fmtFull(ms) {
        if (!ms) return '';
        var d = new Date(Number(ms));
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
               ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }

    function kindOf(text) {
        var s = String(text).trim();
        if (s === EMPTY_STATE_MARKER) return 'blank';
        if (PLACEHOLDER.test(s)) return 'void';
        if (INTERNAL.test(s)) return 'internal';
        return 'note';
    }

    function latestState() {
        for (var i = notes.length - 1; i >= 0; i--) {
            var kind = kindOf(notes[i].text);
            if (kind === 'note' || kind === 'blank') return notes[i];
        }
        return null;
    }

    function stateContent(note) {
        return note && kindOf(note.text) === 'blank' ? '' : (note ? note.text : '');
    }

    function setStatus(text, cls) {
        var el = $('status');
        var fullText = text || '';
        var compactTime = fullText.match(/^(已保存|已同步)\s+.*?(\d{2}:\d{2}:\d{2})$/);
        el.textContent = window.innerWidth <= 640 && compactTime ? compactTime[1] + ' ' + compactTime[2] : fullText;
        el.title = fullText;
        el.className = 'status' + (cls ? ' ' + cls : '');
    }

    var toastTimer = null;
    function toast(msg, isErr) {
        var t = $('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isErr ? ' err' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
    }

    function setBusy(b) {
        busy = b;
        $('refreshBtn').disabled = b;
        $('sumBtn').disabled = b;
        $('saveBtn').disabled = b;
    }

    function savedLabel() { return lastSavedAt ? '已保存 ' + fmtFull(lastSavedAt) : '未保存 · Ctrl+S'; }

    // 无未保存改动时，状态栏显示最近一次保存的完整时间
    function showIdleStatus() {
        if (historyNeedsSave) {
            setStatus(currentMd().trim() ? '历史版本待保存 · Ctrl+S' : '空白待保存 · Ctrl+S', 'saving');
            return;
        }
        if (lastSavedMd !== null && sameMd(currentMd(), lastSavedMd) && lastSavedAt) {
            setStatus(savedLabel(), 'saved');
        } else {
            setStatus('未保存 · Ctrl+S', 'saving');
        }
    }

    /* ================= API ================= */

    async function callApi(path, body, keepalive) {
        var key = $('apiKey').value.trim();
        if (!key) throw new Error('缺少 API Key');
        var res = await fetch(API + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Token ' + key },
            body: JSON.stringify(body),
            keepalive: !!keepalive
        });
        if (!res.ok) {
            if (res.status === 401) throw new Error('鉴权失败，请检查 Key');
            throw new Error('HTTP ' + res.status);
        }
        var json = await res.json();
        if (json.code !== 0) throw new Error(json.message || ('接口返回 code ' + json.code));
        return json.data || {};
    }

    function book() {
        return { user_id: $('userId').value.trim(), conversation_id: $('bookId').value.trim() };
    }

    function historyLimit() {
        var input = $('historyLimit');
        var value = parseInt(input.value, 10);
        if (isNaN(value)) value = DEFAULT_HISTORY_LIMIT;
        value = Math.max(1, Math.min(MAX_MESSAGES, value));
        input.value = String(value);
        return value;
    }

    async function fetchNotes() {
        var b = book();
        if (!b.user_id || !b.conversation_id) throw new Error('请先在设置里填写笔记本 ID 和用户 ID');
        var data = await callApi('/get/message', {
            user_id: b.user_id,
            conversation_id: b.conversation_id,
            message_limit_number: historyLimit()
        });
        var list = data.message_detail_list || [];
        notes = list
            .filter(function (m) { return m && m.role === 'user'; })
            .map(function (m) {
                return { t: m.create_time, text: decodeNl(unquote(m.content == null ? '' : String(m.content))) };
            });
        // 不依赖接口返回数组的顺序；按消息时间升序，保证新写入的空白标记是最新状态。
        notes.sort(function (a, b) {
            var at = Number(a.t), bt = Number(b.t);
            if (!isFinite(at) || !isFinite(bt)) return 0;
            return at - bt;
        });
        live = notes.filter(function (n) { return kindOf(n.text) === 'note'; });
    }

    // 写一条消息进笔记本（唯一写入路径）
    async function writeNote(md, keepalive) {
        var b = book();
        return callApi('/add/message', {
            user_id: b.user_id,
            conversation_id: b.conversation_id,
            messages: [{ role: 'user', content: encodeNl(md) }],
            async_mode: false,
            // 空数组 = 不抽取任何种类的记忆（默认会抽 detail_factual/preference/skill/profile/event/tool_memory）
            allow_memory_view: []
        }, keepalive);
    }

    /* ================= 编辑器状态 ================= */

    function syncEmpty() {
        var txt = editor.textContent.replace(/\u200b/g, '');
        var hasBlock = editor.querySelector('img,hr,pre,table,ul,ol,blockquote');
        editor.classList.toggle('is-empty', !txt.trim() && !hasBlock);
    }

    // 末尾块是代码块/引用/列表/分割线时，浏览器里点最下面点不出光标（进不去新的一行）。
    // 这里保证最后永远跟一个空段落：它序列化成 Markdown 时会被丢掉，不污染内容。
    function ensureTail() {
        var last = editor.lastElementChild;
        if (!last) return;
        var tag = last.tagName.toLowerCase();
        if (tag === 'p' || tag === 'div') return;
        var p = document.createElement('p');
        p.appendChild(document.createElement('br'));
        editor.appendChild(p);
    }

    // 同时把内容灌进两个编辑器（Markdown 视图与原文视图），保证切换不丢内容。
    // savedAt 用「这一版在服务器上的写入时间」，这样刚打开页面时状态栏显示的就是
    // 「已保存 2026-09-29 13:53:03」而不是误报未保存。
    function loadIntoEditor(md, savedAt) {
        var blankState = md === EMPTY_STATE_MARKER;
        md = blankState ? '' : normMd(md || '');
        editor.innerHTML = md ? md2html(md) : '';
        rawBox.value = md;
        lastSavedMd = md;
        lastSavedIsBlankState = blankState;
        historyNeedsSave = false;
        lastSavedAt = savedAt ? Number(savedAt) : 0;
        ensureTail();
        syncEmpty();
        updateStats();
    }

    function currentMd() {
        return rawMode ? rawBox.value : html2md(editor);
    }

    function updateStats() {
        var md = currentMd();
        var plain = md.replace(/```[\s\S]*?```/g, ' code ')
            .replace(/!?\[([^\]]*)\]\([^)]+\)/g, '$1')
            .replace(/^\s{0,3}(#{1,6}|>|[-*+] |\d+[.)] |[-*_]{3,})\s*/gm, ' ')
            .replace(/[*_~`|]/g, ' ').trim();
        var chars = Array.from(plain.replace(/\s/g, '')).length;
        var cjk = (plain.match(/[\u3400-\u9fff]/g) || []).length;
        var latin = (plain.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;
        var words = cjk + latin;
        $('docStats').textContent = chars + ' 字符 · ' + words + ' 词 · Ctrl+K 链接 · Ctrl+N 新建';
    }

    function setRawMode(on) {
        if (on === rawMode) return;
        // 切换前先归一化，两个视图保持一致；否则切回来会因为「块间补空行」误报未保存
        var md = normMd(currentMd());
        rawMode = on;
        rawBox.value = md;
        editor.innerHTML = md ? md2html(md) : '';
        if (!on) ensureTail();
        editor.style.display = on ? 'none' : '';
        rawBox.classList.toggle('show', on);
        $('toolbar').classList.toggle('raw-mode', on);
        $('toolsToggle').hidden = on;
        if (on) $('toolbar').classList.add('collapsed');
        $('rawToggle').textContent = on ? '排版' : '原文';
        $('rawToggle').title = on ? '切回排版编辑' : '切换到 Markdown 原文编辑';
        syncEmpty();
        updateStats();
        showIdleStatus();
        saveSettings();
    }

    /* ================= 保存 ================= */

    function scheduleSave() {
        updateStats();
        if (autoSaveOn()) {
            setStatus('编辑中…', 'saving');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function () { doSave(false); }, saveDelaySec() * 1000);
        } else {
            // 关掉自动保存后，只有 Ctrl+S（或点保存）才会写
            clearTimeout(saveTimer);
            saveTimer = null;
            showIdleStatus();
        }
    }

    async function doSave(keepalive, deferRefresh) {
        clearTimeout(saveTimer);
        saveTimer = null;
        var b = book();
        if (!b.user_id || !b.conversation_id) return false;
        var md = normMd(currentMd());
        var blankState = !md.trim();
        if (md === lastSavedMd && (!blankState || lastSavedIsBlankState) && !historyNeedsSave) {
            if (lastSavedMd !== null) setStatus(savedLabel(), 'saved');
            return true;
        }

        setStatus('保存中…', 'saving');
        try {
            await writeNote(blankState ? EMPTY_STATE_MARKER : md, keepalive);
            lastSavedMd = md;
            lastSavedIsBlankState = blankState;
            historyNeedsSave = false;
            lastSavedAt = Date.now();
            loadedIdx = -1;
            setStatus(savedLabel(), 'saved');
            if (!deferRefresh) {
                await fetchNotes();
                var latest = latestState();
                loadedIdx = latest ? notes.lastIndexOf(latest) : -1;
                renderSide();
            }
            return true;
        } catch (e) {
            setStatus('保存失败', 'error');
            if (!keepalive) toast('保存失败：' + e.message, true);
            return false;
        }
    }

    /* ================= 渲染：侧边栏历史 ================= */

    function renderSide() {
        var list = $('sideList');
        list.textContent = '';
        if (!notes.length) {
            var em = document.createElement('div');
            em.className = 'side-empty';
            em.textContent = '还没有历史记录';
            list.appendChild(em);
        }
        for (var i = notes.length - 1; i >= 0; i--) {
            var n = notes[i];
            var k = kindOf(n.text);
            var isState = k === 'note' || k === 'blank';
            var row = document.createElement('div');
            row.className = 'sitem' + (isState && i === loadedIdx ? ' cur' : '');

            var head = document.createElement('div');
            head.className = 'srow';
            var t = document.createElement('span');
            t.className = 'stime';
            t.textContent = fmtFull(n.t);
            head.appendChild(t);

            if (isState) {
                var rb = document.createElement('button');
                rb.className = 'mini';
                rb.textContent = '还原';
                rb.title = k === 'blank' ? '把空白状态重新设为最新版本' : '把这一版重新写入笔记本，成为最新版本';
                (function (idx) {
                    rb.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        restoreNote(idx);
                    });
                })(i);
                head.appendChild(rb);
            }
            row.appendChild(head);

            var c = document.createElement('div');
            c.className = 'stext' + (k === 'note' ? '' : ' muted');
            var flat = n.text.replace(/[#>*`~]/g, ' ').replace(/\s+/g, ' ').trim();
            if (k === 'void') c.textContent = '（占位符）' + flat.slice(0, 60);
            else if (k === 'internal') c.textContent = '（总结请求，不计入笔记）' + flat.slice(0, 40);
            else if (k === 'blank') c.textContent = '（空白状态，可重新编辑）';
            else c.textContent = flat.slice(0, 90) || '（空）';
            row.appendChild(c);

            if (isState) {
                (function (idx) {
                    row.addEventListener('click', function () { loadFromHistory(idx); });
                })(i);
            }
            list.appendChild(row);
        }
        $('sideCount').textContent = notes.length + ' 条' +
            (notes.length !== live.length ? '（有效 ' + live.length + '）' : '') +
            (live.length >= historyLimit() ? ' · 已达 ' + historyLimit() + ' 条读取上限' : '');
    }

    function loadFromHistory(idx) {
        var note = notes[idx];
        var txt = stateContent(note);
        var blankState = kindOf(note.text) === 'blank';
        if (txt === currentMd() && idx === loadedIdx) {
            historyNeedsSave = true;
            if (blankState) {
                // 用户明确从历史选中空白记录后，点保存应重新写入 #，使空白成为最新版本。
                setStatus('空白待保存 · Ctrl+S', 'saving');
                toast('空白状态已选中，点击保存可将它设为最新版本');
            } else {
                setStatus('历史版本待保存 · Ctrl+S', 'saving');
                toast('历史版本已选中，点击保存可将它设为最新版本');
            }
            return;
        }
        loadIntoEditor(note.text, note.t);
        historyNeedsSave = true;
        if (blankState) {
            setStatus('空白待保存 · Ctrl+S', 'saving');
        } else {
            setStatus('历史版本待保存 · Ctrl+S', 'saving');
        }
        loadedIdx = idx;
        renderSide();
        $('docWrap').scrollTop = 0;
        toast(blankState ? '已载入空白状态，点击保存可将它设为最新版本' : '已载入历史版本，点击保存可将它设为最新版本');
    }

    // 「还原」= 把这一版重新发送一次，成为最新版本（MemOS 无法删改消息，只能追加）
    async function restoreNote(idx) {
        if (busy) { toast('当前操作尚未完成，请稍后再还原', true); return; }
        var n = notes[idx];
        var kind = n ? kindOf(n.text) : '';
        if (!n || (kind !== 'note' && kind !== 'blank')) { toast('这条记录无法还原', true); return; }
        var b = book();
        if (!b.user_id || !b.conversation_id) { toast('请先在设置里填写笔记本 ID 和用户 ID', true); return; }

        setBusy(true);
        setStatus('还原中…', 'saving');
        try {
            var payload = kind === 'blank' ? EMPTY_STATE_MARKER : n.text;
            await writeNote(payload, false);
            await fetchNotes();
            var latest = latestState();
            if (!latest || (kind === 'blank' ? kindOf(latest.text) !== 'blank' : latest.text !== n.text)) {
                throw new Error('接口已接收写入，但最新历史尚未读回该版本；请稍后刷新确认');
            }
            loadIntoEditor(latest.text, latest.t);
            loadedIdx = latest ? notes.lastIndexOf(latest) : -1;
            renderSide();
            setStatus(savedLabel(), 'saved');
            toast('已还原并重新发送为最新版本');
        } catch (e) {
            setStatus('还原失败', 'error');
            toast('还原失败：' + e.message, true);
        } finally {
            setBusy(false);
        }
    }

    /* ================= 动作 ================= */

    // 刷新时把服务器上「最新一条笔记」同步进编辑纸张。
    // MemOS 的消息不可改，所以「刷新」唯一有意义的落点就是：让纸张跟上最新一版。
    // 返回：'synced' 已更新 / 'same' 本来就是最新 / 'dirty' 有未保存改动，不覆盖 / 'empty' 没有笔记
    function syncEditorFromServer() {
        var last = latestState();
        if (!last) return 'empty';
        var idx = notes.lastIndexOf(last);
        // 编辑器有未保存改动时不覆盖，避免把正在写的内容冲掉（lastSavedMd === null 表示尚未与远端对齐，不算脏）
        if (lastSavedMd !== null && !sameMd(currentMd(), lastSavedMd)) return 'dirty';
        if (idx === loadedIdx && sameMd(stateContent(last), lastSavedMd || '')) {
            historyNeedsSave = false;
            return 'same';
        }
        loadIntoEditor(last.text, last.t);
        loadedIdx = idx;
        return 'synced';
    }

    async function refresh(silent) {
        if (busy) return;
        setBusy(true);
        setStatus('读取中…');
        try {
            // 用户清空了已有笔记后点刷新，应先把明确的空白状态写到服务器，
            // 否则服务器最新版本仍是旧正文，刷新会把它重新载入。
            var blankNeedsSave = lastSavedMd !== null && !currentMd().trim() &&
                (!lastSavedIsBlankState || !sameMd(currentMd(), lastSavedMd));
            if (blankNeedsSave && !await doSave(false, true)) return;
            await fetchNotes();
            var r = syncEditorFromServer();
            renderSide();
            if (r === 'dirty') showIdleStatus();
            else setStatus('已同步 ' + fmtFull(Date.now()), 'saved');
            if (!silent) {
                if (r === 'dirty') toast('编辑纸张有未保存的改动，已保留；先 Ctrl+S 再刷新可同步最新');
                else if (r === 'synced') toast('已刷新，编辑纸张已同步到最新');
                else toast('已刷新');
            }
        } catch (e) {
            setStatus('读取失败', 'error');
            if (!silent) toast('读取失败：' + e.message, true);
        } finally {
            setBusy(false);
        }
    }

    // 只把「最新一条」笔记原文拼成 query（只用 /chat，不传任何记忆参数）
    function buildSummaryQuery() {
        var latest = latestState();
        if (!latest || kindOf(latest.text) !== 'note') return '';
        return '以下是我的笔记（Markdown 格式）：\n\n[' + fmtFull(latest.t) + ']\n' + latest.text;
    }

    async function summarize() {
        if (busy) return;
        var b = book();
        if (!b.user_id || !b.conversation_id) { toast('请先在设置里填写笔记本 ID 和用户 ID', true); return; }
        if (!currentMd().trim()) { toast('当前内容为空，无法总结'); return; }

        setBusy(true);
        $('sheetBody').textContent = '正在读取笔记…';
        $('sheet').classList.add('open');
        try {
            await doSave(false);
            await fetchNotes();
            renderSide();
            var latest = latestState();
            if (!latest || kindOf(latest.text) !== 'note') { $('sheetBody').textContent = '还没有可总结的笔记。'; return; }

            var temp = parseFloat($('temperature').value);
            if (isNaN(temp)) temp = 0.7;
            $('sheetBody').textContent = '正在总结最新一条笔记…';

            var data = await callApi('/chat', {
                user_id: b.user_id,
                // /chat 会把「提问 + 回答」写回会话消息列表，故走影子会话，避免污染笔记本
                conversation_id: b.conversation_id + SUM_SUFFIX,
                query: buildSummaryQuery(),
                model_name: $('modelSelect').value,
                temperature: temp,
                stream: false,
                max_tokens: 4096,
                add_message_on_answer: false,
                system_prompt: sumPrompt()
            });
            var out = data && typeof data.response === 'string' ? data.response.trim() : '';
            // 模型常把整段输出套在 ```markdown 围栏里，剥掉外层围栏再渲染，否则会变成一整个代码块
            var fence = out.match(/^```[a-zA-Z]*[ \t]*\r?\n([\s\S]*?)\r?\n?```$/);
            if (fence) out = fence[1].trim();
            $('sheetBody').innerHTML = out ? md2html(out) : '（没有返回内容）';
        } catch (e) {
            $('sheetBody').textContent = '总结失败：' + e.message;
        } finally {
            setBusy(false);
        }
    }

    /* ================= 编辑器交互 ================= */

    // 从光标节点往上找到最近的块级元素（p/div/pre/blockquote/h1-h6）
    function blockOf(node) {
        var el = node && node.nodeType === 1 ? node : (node ? node.parentNode : null);
        while (el && el !== editor) {
            var t = el.tagName ? el.tagName.toLowerCase() : '';
            if (t === 'p' || t === 'div' || t === 'pre' || t === 'blockquote' || /^h[1-6]$/.test(t)) return el;
            el = el.parentNode;
        }
        return null;
    }

    function preOf(node) {
        var el = blockOf(node);
        return el && el.tagName.toLowerCase() === 'pre' ? el : null;
    }

    function listItemOf(node) {
        var el = node && node.nodeType === 1 ? node : (node ? node.parentNode : null);
        while (el && el !== editor) {
            if (el.tagName && el.tagName.toLowerCase() === 'li') return el;
            el = el.parentNode;
        }
        return null;
    }

    function markTaskItem(li, checked) {
        if (!li) return;
        li.setAttribute('data-task', checked ? 'done' : 'todo');
        var box = li.querySelector(':scope > input[type="checkbox"]');
        if (!box) {
            box = document.createElement('input');
            box.type = 'checkbox';
            box.tabIndex = -1;
            li.insertBefore(box, li.firstChild);
            li.insertBefore(document.createTextNode(' '), box.nextSibling);
        }
        box.checked = !!checked;
    }

    // 光标在该块里是否已经到末尾
    function atEndOfBlock(blk, range) {
        var r = range.cloneRange();
        r.selectNodeContents(blk);
        try { r.setStart(range.endContainer, range.endOffset); } catch (e) { return false; }
        return r.toString().replace(/[\u00a0 ]/g, '') === '';
    }

    // 代码块里的回车：插真实换行（<br> 序列化时会丢换行 → 代码被压成一行）；
    // 在末尾空行再按一次回车则跳出代码块，方便在下方继续写。
    function handleEnterInPre(e) {
        var sel = window.getSelection();
        if (!sel.rangeCount) return false;
        var range = sel.getRangeAt(0);
        var pre = preOf(range.startContainer);
        if (!pre) return false;
        e.preventDefault();

        var head = range.cloneRange();
        head.selectNodeContents(pre);
        var before = '';
        var after = '';
        try { head.setEnd(range.startContainer, range.startOffset); before = head.toString(); } catch (err) {}
        try { head.setStart(range.endContainer, range.endOffset); after = head.toString(); } catch (err) {}

        if (/\n$/.test(before) && !after.replace(/[\n\u00a0 ]/g, '')) {
            // 末尾空行 → 跳出代码块。若后面已经有个空段落就复用它，避免多出一个空行
            var next = pre.nextSibling;
            var p = null;
            if (next && next.nodeType === 1 && /^(p|div)$/.test(next.tagName.toLowerCase()) && !next.textContent.trim()) {
                p = next;
            } else {
                p = document.createElement('p');
                p.appendChild(document.createElement('br'));
                editor.insertBefore(p, pre.nextSibling);
            }
            var nr = document.createRange();
            nr.setStart(p, 0);
            nr.collapse(true);
            sel.removeAllRanges();
            sel.addRange(nr);
            return true;
        }

        var tn = document.createTextNode('\n');
        range.deleteContents();
        range.insertNode(tn);
        range.setStart(tn, 1);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
        return true;
    }

    // 段落里输入 ``` 再回车 → 直接换成真代码块。
    // （否则 ``` 会作为普通文字留着，刷新后和正文里的 ``` 错误配对，代码格式就散了）
    function tryFenceToPre(e) {
        var sel = window.getSelection();
        if (!sel.rangeCount) return false;
        var range = sel.getRangeAt(0);
        if (!editor.contains(range.startContainer)) return false;
        if (preOf(range.startContainer)) return false;
        var blk = blockOf(range.startContainer);
        if (!blk || blk === editor) return false;
        if (!/^```\s*$/.test(blk.textContent.replace(/\u200b/g, ''))) return false;
        if (!atEndOfBlock(blk, range)) return false;

        e.preventDefault();
        var pre = document.createElement('pre');
        pre.appendChild(document.createElement('br'));
        blk.parentNode.replaceChild(pre, blk);
        var nr = document.createRange();
        nr.setStart(pre, 0);
        nr.collapse(true);
        sel.removeAllRanges();
        sel.addRange(nr);
        ensureTail();
        return true;
    }

    function makeRange(sNode, sOff, eNode, eOff) {
        var r = document.createRange();
        r.setStart(sNode, sOff);
        r.setEnd(eNode, eOff);
        return r;
    }

    function wrapSelection(tag) {
        var sel = window.getSelection();
        if (!sel.rangeCount || sel.isCollapsed) return;
        var r = sel.getRangeAt(0);
        var box = document.createElement(tag);
        try { r.surroundContents(box); }
        catch (e) { box.appendChild(r.extractContents()); r.insertNode(box); }
        sel.removeAllRanges();
        var nr = document.createRange();
        nr.selectNodeContents(box);
        sel.addRange(nr);
    }

    function insertMarkdownSnippet(md) {
        if (rawMode) {
            var start = rawBox.selectionStart;
            var end = rawBox.selectionEnd;
            rawBox.setRangeText(md, start, end, 'end');
            rawBox.dispatchEvent(new Event('input', { bubbles: true }));
            rawBox.focus();
            return;
        }
        editor.focus();
        document.execCommand('insertHTML', false, md2html(md));
        ensureTail();
        syncEmpty();
        scheduleSave();
    }

    function insertLink() {
        var selected = window.getSelection().toString();
        var url = window.prompt('输入链接地址', 'https://');
        if (url === null) return;
        var href = safeHref(url);
        if (!href) { toast('链接请使用 http、https、mailto 或站内地址', true); return; }
        if (rawMode) {
            var label = selected || '链接文字';
            insertMarkdownSnippet('[' + label + '](' + href + ')');
        } else if (selected) {
            document.execCommand('createLink', false, href);
            scheduleSave();
        } else {
            document.execCommand('insertHTML', false, '<a href="' + escAttr(href) + '" target="_blank" rel="noreferrer">链接文字</a>');
            scheduleSave();
        }
    }

    function insertImage() {
        var src = window.prompt('输入图片地址', 'https://');
        if (src === null) return;
        var safe = safeHref(src);
        if (!safe) { toast('图片地址请使用 http、https 或站内地址', true); return; }
        var alt = window.prompt('图片说明（可选）', '') || '';
        if (rawMode) insertMarkdownSnippet('![' + alt + '](' + safe + ')');
        else {
            document.execCommand('insertHTML', false, '<img src="' + escAttr(safe) + '" alt="' + escAttr(alt) + '" loading="lazy">');
            syncEmpty();
            scheduleSave();
        }
    }

    // 光标所在行、光标之前的纯文本（只在单一文本节点里判断，足够覆盖手输场景）
    function prefixText() {
        var sel = window.getSelection();
        if (!sel.rangeCount || !sel.isCollapsed) return null;
        var node = sel.getRangeAt(0).startContainer;
        if (!node || node.nodeType !== 3 || !editor.contains(node)) return null;
        return node.nodeValue.slice(0, sel.getRangeAt(0).startOffset);
    }

    function deletePrefix(len) {
        var sel = window.getSelection();
        var r = sel.getRangeAt(0);
        var node = r.startContainer;
        var dr = makeRange(node, 0, node, Math.min(len, node.nodeValue.length));
        dr.deleteContents();
        sel.removeAllRanges();
        var nr = document.createRange();
        nr.setStart(node, 0);
        nr.collapse(true);
        sel.addRange(nr);
    }

    // 块级 Markdown 快捷输入
    function tryMarkdownShortcut() {
        var pre = prefixText();
        if (!pre) return false;
        var m;

        if ((m = pre.match(/^[-*+] \[([ xX])\] $/))) {
            deletePrefix(pre.length);
            document.execCommand('insertHTML', false, md2html('- [' + m[1] + '] '));
            return true;
        }

        if ((m = pre.match(/^(#{1,6}) $/))) {
            deletePrefix(m[1].length + 1);
            document.execCommand('formatBlock', false, 'H' + m[1].length);
            return true;
        }
        if (/^[-*+] $/.test(pre)) {
            deletePrefix(2);
            document.execCommand('insertUnorderedList');
            return true;
        }
        if (/^\d+\. $/.test(pre)) {
            deletePrefix(pre.length);
            document.execCommand('insertOrderedList');
            return true;
        }
        if (/^> $/.test(pre)) {
            deletePrefix(2);
            document.execCommand('formatBlock', false, 'BLOCKQUOTE');
            return true;
        }
        if (/^```\s?$/.test(pre)) {
            deletePrefix(pre.length);
            document.execCommand('formatBlock', false, 'PRE');
            return true;
        }
        if (/^(---|\*\*\*)$/.test(pre)) {
            deletePrefix(3);
            document.execCommand('insertHorizontalRule');
            return true;
        }
        return false;
    }

    function cmdOf(cmd) {
        if (cmd === 'undo') document.execCommand('undo');
        else if (cmd === 'redo') document.execCommand('redo');
        else if (cmd === 'bold') document.execCommand('bold');
        else if (cmd === 'italic') document.execCommand('italic');
        else if (cmd === 'code') wrapSelection('code');
        else if (cmd === 'ul') document.execCommand('insertUnorderedList');
        else if (cmd === 'ol') document.execCommand('insertOrderedList');
        else if (cmd === 'task') insertMarkdownSnippet('- [ ] 任务');
        else if (cmd === 'quote') document.execCommand('formatBlock', false, 'BLOCKQUOTE');
        else if (cmd === 'pre') document.execCommand('formatBlock', false, 'PRE');
        else if (cmd === 'hr') document.execCommand('insertHorizontalRule');
        else if (cmd === 'link') insertLink();
        else if (cmd === 'image') insertImage();
        else if (cmd === 'table') insertMarkdownSnippet('| 列 1 | 列 2 | 列 3 |\n| --- | --- | --- |\n| 内容 | 内容 | 内容 |');
        else if (cmd === 'h1' || cmd === 'h2' || cmd === 'h3') {
            document.execCommand('formatBlock', false, cmd.toUpperCase());
        }
    }

    function startNewNote() {
        if (currentMd().trim() && !window.confirm('清空编辑器，开始写一条新笔记？（未保存的改动会丢失）')) return;
        editor.innerHTML = '';
        rawBox.value = '';
        loadedIdx = -1;
        syncEmpty();
        scheduleSave();
        renderSide();
        (rawMode ? rawBox : editor).focus();
        toast('已清空，写新的一条');
    }

    function bind() {
        var appEl = document.querySelector('.app');
        var chromePanel = $('chromePanel');
        var chromeTrigger = $('chromeTrigger');
        function showControls() {
            appEl.classList.add('controls-open');
            chromeTrigger.setAttribute('aria-expanded', 'true');
        }
        function closeControls() {
            if (chromePanel.contains(document.activeElement)) {
                chromeTrigger.focus();
            }
            appEl.classList.remove('controls-open');
            chromeTrigger.setAttribute('aria-expanded', 'false');
            $('settings').classList.remove('open');
            $('settingsBtn').setAttribute('aria-expanded', 'false');
        }
        chromeTrigger.addEventListener('click', function () {
            if (appEl.classList.contains('controls-open')) closeControls();
            else showControls();
        });
        $('closeControlsBtn').addEventListener('click', closeControls);

        // 工具栏（mousedown 阻止默认，保住编辑器选区）
        var tb = $('toolbar');
        tb.addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });
        tb.addEventListener('click', function (e) {
            var btn = e.target.closest('button');
            if (!btn) return;
            var cmd = btn.dataset.cmd;
            if (!cmd) return;       // 非排版按钮（例如「原文」开关）：不要顺手 focus + 触发保存
            if (rawMode) return;    // 原文模式没有排版按钮
            editor.focus();
            cmdOf(cmd);
            ensureTail();
            syncEmpty();
            scheduleSave();
        });

        editor.addEventListener('input', function () {
            ensureTail();
            syncEmpty();
            scheduleSave();
        });

        editor.addEventListener('keydown', function (e) {
            if (e.key === 'Tab') {
                var sel = window.getSelection();
                var li = sel.rangeCount ? listItemOf(sel.getRangeAt(0).startContainer) : null;
                if (li) {
                    e.preventDefault();
                    document.execCommand(e.shiftKey ? 'outdent' : 'indent');
                    ensureTail();
                    scheduleSave();
                    return;
                }
            }
            if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
                var selection = window.getSelection();
                var currentItem = selection.rangeCount ? listItemOf(selection.getRangeAt(0).startContainer) : null;
                if (currentItem && currentItem.hasAttribute('data-task') && currentItem.textContent.trim()) {
                    setTimeout(function () {
                        var nextSelection = window.getSelection();
                        var nextItem = nextSelection.rangeCount ? listItemOf(nextSelection.getRangeAt(0).startContainer) : null;
                        if (nextItem && nextItem !== currentItem && nextItem.parentNode === currentItem.parentNode) {
                            markTaskItem(nextItem, false);
                            syncEmpty();
                            scheduleSave();
                        }
                    }, 0);
                }
                if (handleEnterInPre(e)) { syncEmpty(); scheduleSave(); return; }
                if (tryFenceToPre(e)) { syncEmpty(); scheduleSave(); return; }
            }
            if (e.key === ' ' || e.key === 'Enter') {
                // 先让字符落地，再判断
                setTimeout(function () {
                    if (tryMarkdownShortcut()) { ensureTail(); syncEmpty(); scheduleSave(); }
                }, 0);
            }
        });

        editor.addEventListener('paste', function (e) {
            var txt = (e.clipboardData || window.clipboardData).getData('text/plain');
            if (!txt) return;
            e.preventDefault();
            var looksMd = /\n/.test(txt) || /(^|\n)\s*(#{1,6}\s|[-*+]\s|>\s|\d+[.)]\s|```)/.test(txt);
            if (looksMd && txt.trim()) document.execCommand('insertHTML', false, md2html(txt));
            else document.execCommand('insertText', false, txt);
            syncEmpty();
            scheduleSave();
        });

        editor.addEventListener('change', function (e) {
            var input = e.target.closest && e.target.closest('li[data-task] input[type="checkbox"]');
            if (!input) return;
            var li = input.closest('li[data-task]');
            li.setAttribute('data-task', input.checked ? 'done' : 'todo');
            syncEmpty();
            scheduleSave();
        });

        // 原文编辑框
        rawBox.addEventListener('input', function () { scheduleSave(); });
        rawBox.addEventListener('keydown', function (e) {
            if (e.key !== 'Tab') return;
            e.preventDefault();
            rawBox.setRangeText('  ', rawBox.selectionStart, rawBox.selectionEnd, 'end');
            scheduleSave();
        });
        // 离开页面时兜底保存（仅在自动保存开启时）
        window.addEventListener('pagehide', function () {
            if (autoSaveOn() && (saveTimer || historyNeedsSave || currentMd() !== lastSavedMd)) doSave(true);
        });
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden' && autoSaveOn() && (saveTimer || historyNeedsSave || currentMd() !== lastSavedMd)) doSave(true);
        });
        // 关闭自动保存后，有未保存内容时提醒
        window.addEventListener('beforeunload', function (e) {
            if (!autoSaveOn() && (historyNeedsSave || currentMd() !== lastSavedMd)) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        $('saveBtn').addEventListener('click', function () { doSave(false); });
        $('refreshBtn').addEventListener('click', function () { refresh(false); });
        $('sumBtn').addEventListener('click', summarize);
        $('settingsBtn').addEventListener('click', function () {
            var open = $('settings').classList.toggle('open');
            this.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        $('toolsToggle').addEventListener('click', function () {
            var open = $('toolbar').classList.toggle('collapsed') === false;
            this.textContent = open ? '收起工具' : '编辑工具';
            this.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        $('rawToggle').addEventListener('click', function (e) { e.preventDefault(); setRawMode(!rawMode); });
        $('sheetClose').addEventListener('click', function () { $('sheet').classList.remove('open'); });
        $('sheet').addEventListener('click', function (e) {
            if (e.target === $('sheet')) $('sheet').classList.remove('open');
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                $('sheet').classList.remove('open');
                $('side').classList.remove('open');
                closeControls();
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                doSave(false);
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                insertLink();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                startNewNote();
            }
        });

        $('historyBtn').addEventListener('click', function () { $('side').classList.toggle('open'); });
        $('sideClose').addEventListener('click', function () { $('side').classList.remove('open'); });

        // 拖侧边栏左边缘调宽（窄屏是覆盖层，不参与拖拽）
        var grip = $('sideGrip');
        var mainEl = document.querySelector('.main');
        grip.addEventListener('pointerdown', function (e) {
            if (window.innerWidth <= 640) return;
            e.preventDefault();
            grip.classList.add('dragging');
            if (grip.setPointerCapture) { try { grip.setPointerCapture(e.pointerId); } catch (err) {} }
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';

            function onMove(ev) {
                var r = mainEl.getBoundingClientRect();
                applySideWidth(r.right - ev.clientX);   // 侧边栏贴右，宽度 = 容器右边界 - 鼠标 x
            }
            function onEnd() {
                grip.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                grip.removeEventListener('pointermove', onMove);
                grip.removeEventListener('pointerup', onEnd);
                grip.removeEventListener('pointercancel', onEnd);
                saveSettings();
            }
            grip.addEventListener('pointermove', onMove);
            grip.addEventListener('pointerup', onEnd);
            grip.addEventListener('pointercancel', onEnd);
        });

        // 连接相关设置：改动后重新拉取
        ['apiKey', 'bookId', 'userId'].forEach(function (id) {
            $(id).addEventListener('change', function () {
                saveSettings();
                lastSavedMd = null;
                lastSavedIsBlankState = false;
                historyNeedsSave = false;
                $('bookLabel').textContent = $('bookId').value.trim();
                refresh(true).then(function () {
                    // 纸张由 refresh 同步到新本子的最新一条；新本子是空的就清空纸张，
                    // 否则会把上一个本子的内容留在编辑区里。
                    if (!latestState()) { loadIntoEditor(''); loadedIdx = -1; }
                    renderSide();
                });
            });
        });

        // 普通设置：只落本地
        ['modelSelect', 'temperature', 'saveDelay', 'sumPrompt'].forEach(function (id) {
            $(id).addEventListener('change', saveSettings);
            $(id).addEventListener('input', saveSettings);
        });

        // 历史条数改动后立即保存设置并按新上限刷新
        $('historyLimit').addEventListener('change', function () {
            this.value = String(historyLimit());
            saveSettings();
            refresh(true);
        });

        // 纸张宽度拖动条：即时生效 + 落本地
        $('docWidth').addEventListener('input', function () {
            applyDocWidth(parseFloat(this.value));
            saveSettings();
        });

        $('autoSave').addEventListener('change', function () {
            saveSettings();
            if (autoSaveOn()) {
                scheduleSave();
                toast('已开启自动保存（间隔 ' + saveDelaySec() + ' 秒）');
            } else {
                clearTimeout(saveTimer);
                saveTimer = null;
                showIdleStatus();
                toast('已关闭自动保存，改按 Ctrl+S 保存');
            }
        });
        $('saveDelay').addEventListener('change', function () {
            saveSettings();
            if (autoSaveOn()) scheduleSave();
        });

        // 自绘的数字加减按钮（原生箭头已隐藏）
        $('settings').addEventListener('click', function (e) {
            var btn = e.target.closest ? e.target.closest('.numspin button') : null;
            if (!btn) return;
            e.preventDefault();
            var box = btn.closest('.numwrap');
            var input = box && box.querySelector('input');
            if (!input) return;
            var step = parseFloat(input.step) || 1;
            var dir = parseFloat(btn.dataset.step) || 1;
            var lo = (input.min === '' ? -Infinity : parseFloat(input.min));
            var hi = (input.max === '' ? Infinity : parseFloat(input.max));
            var v = parseFloat(input.value);
            if (isNaN(v)) v = isFinite(lo) ? lo : 0;
            v = v + dir * step;
            if (isFinite(lo)) v = Math.max(lo, v);
            if (isFinite(hi)) v = Math.min(hi, v);
            input.value = String(Math.round(v * 1e6) / 1e6);
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
        });
    }

    function init() {
        loadSettings();
        $('bookLabel').textContent = $('bookId').value.trim();
        bind();
        setRawMode(localStorage.getItem('memos_rawmode') === '1');
        setStatus('读取中…');
        refresh(true).then(function () {
            var last = latestState();
            if (last) {
                loadIntoEditor(last.text, last.t);
                loadedIdx = notes.lastIndexOf(last);
            } else {
                loadIntoEditor('');
            }
            renderSide();
            setStatus('已同步 ' + fmtFull(Date.now()), 'saved');
            editor.focus();
        });
    }

    init();
})();
</script>
</body>
</html>
