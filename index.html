        var shown = window.innerWidth <= 640 && compactTime ? compactTime[1] + ' ' + compactTime[2] : fullText;
        // 顶栏里的状态 + 收起工具栏时的悬浮状态，两处一起更新（改 class 用 classList，
        // 不能整串覆盖，否则会把 status-float 这个标记类冲掉）
        var els = document.querySelectorAll('.status');
        for (var i = 0; i < els.length; i++) {
            els[i].textContent = shown;
            els[i].title = fullText;
            els[i].classList.remove('saving', 'saved', 'error');
            if (cls) els[i].classList.add(cls);
        }
    }

    var toastTimer = null;
    function toast(msg, isErr) {
        var t = $('toast');
        t.textContent = msg;
        t.className = 'toast show' + (isErr ? ' err' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
    }

    function setBusy(b) {
        busy = b;
        $('refreshBtn').disabled = b;
        $('accessBtn').disabled = b;
        $('accessRefreshBtn').disabled = b;
        $('saveBtn').disabled = b || !notebookReady();
        if (!b && refreshQueued) {
            refreshQueued = false;
            Promise.resolve().then(function () { refresh(true); });
        }
    }

    function savedLabel() { return lastSavedAt ? '已保存 ' + fmtFull(lastSavedAt) : '未保存 · Ctrl+S'; }

    // 「已同步」显示的是**服务器上最新一条笔记的时间**，与右侧历史列表第一行的
    // 时间同源，避免每次刷新页面都显示成"当前这一刻"（那样和历史列表对不上）。
    function syncedLabel() {
        var last = latestState();
        var t = last ? Number(last.t) : 0;
        return t ? '已同步 ' + fmtFull(t) : '已同步';
    }

    // 无未保存改动时，状态栏显示最近一次保存的完整时间
    function showIdleStatus() {
        if (historyNeedsSave) {
            setStatus(currentMd().trim() ? '历史版本待保存 · Ctrl+S' : '空白待保存 · Ctrl+S', 'saving');
            return;
        }
        if (lastSavedMd !== null && sameMd(currentMd(), lastSavedMd) && lastSavedAt) {
            setStatus(savedLabel(), 'saved');
        } else {
            setStatus('未保存 · Ctrl+S', 'saving');
        }
    }

    /* ================= API ================= */

    // keyOverride：访问记录要用写死的 Key（不受设置里那把影响），其余调用沿用设置值
    async function callApi(path, body, keepalive, keyOverride) {
        var key = (keyOverride || $('apiKey').value).trim();
        if (!key) throw new Error('缺少 API Key');
        var res = await fetch(API + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Token ' + key },
            body: JSON.stringify(body),
            keepalive: !!keepalive
        });
        if (!res.ok) {
            if (res.status === 401) throw new Error('鉴权失败，请检查 Key');
            throw new Error('HTTP ' + res.status);
        }
        var json = await res.json();
        if (json.code !== 0) throw new Error(json.message || ('接口返回 code ' + json.code));
        return json.data || {};
    }

    function book() {
        return { user_id: $('userId').value.trim(), conversation_id: $('bookId').value.trim() };
    }

    function notebookContext() {
        var b = book();
        return { revision: notebookRevision, user_id: b.user_id, conversation_id: b.conversation_id,
            key: $('apiKey').value.trim() };
    }

    function notebookMatches(context) {
        if (!context) return false;
        var current = notebookContext();
        return context.revision === current.revision && context.user_id === current.user_id &&
            context.conversation_id === current.conversation_id && context.key === current.key;
    }

    function notebookReady() { return notebookMatches(activeNotebook); }

    function historyLimit() {
        var input = $('historyLimit');
        var value = parseInt(input.value, 10);
        if (isNaN(value)) value = DEFAULT_HISTORY_LIMIT;
        value = Math.max(1, Math.min(MAX_MESSAGES, value));
        input.value = String(value);
        return value;
    }

    async function fetchNotes() {
        var context = notebookContext(), requestId = ++notesRequestId;
        var b = book();
        if (!b.user_id || !b.conversation_id) throw new Error('请先在设置里填写笔记本 ID 和用户 ID');
        var data = await callApi('/get/message', {
            user_id: b.user_id,
            conversation_id: b.conversation_id,
            message_limit_number: historyLimit()
        });
        // 设置改变或更新的读取已发出时，旧响应不能再改写当前笔记本。
        if (!notebookMatches(context) || requestId !== notesRequestId) return false;
        var list = data.message_detail_list || [];
        notes = list
            .filter(function (m) { return m && m.role === 'user'; })
            .map(function (m) {
                return { t: m.create_time, text: decodeNl(unquote(m.content == null ? '' : String(m.content))) };
            });
        // 不依赖接口返回数组的顺序；按消息时间升序，保证新写入的空白标记是最新状态。
        notes.sort(function (a, b) {
            var at = Number(a.t), bt = Number(b.t);
            if (!isFinite(at) || !isFinite(bt)) return 0;
            return at - bt;
        });
        live = notes.filter(function (n) { return kindOf(n.text) === 'note'; });
        return true;
    }

    // 写一条消息进笔记本（唯一写入路径）
    async function writeNote(md, keepalive) {
        var b = book();
        return callApi('/add/message', {
            user_id: b.user_id,
            conversation_id: b.conversation_id,
            messages: [{ role: 'user', content: encodeNl(md) }],
            async_mode: false,
            // 空数组 = 不抽取任何种类的记忆（默认会抽 detail_factual/preference/skill/profile/event/tool_memory）
            allow_memory_view: []
        }, keepalive);
    }

    /* ================= 访问记录 ================= */

    function logVisitOn() { return $('logVisit').checked; }

    // 从 UA 抠出「浏览器 + 完整版本」和「系统 + 版本」——不引第三方库，够用即可
    function parseUA(ua) {
        var s = String(ua || ''), m;
        var browser = '未知浏览器', os = '未知系统';
        // 版本号写全（Edg/155.0.0.0 → `Edge 155.0.0.0`），不截成主版本 —— 用户要看全量信息
        var ver = function (x) { return String(x[1]).replace(/\.+$/, ''); };
        if ((m = s.match(/Edg(?:e|A|iOS)?\/([\d.]+)/))) browser = 'Edge ' + ver(m);
        else if ((m = s.match(/OPR\/([\d.]+)/))) browser = 'Opera ' + ver(m);
        else if ((m = s.match(/(?:Firefox|FxiOS)\/([\d.]+)/))) browser = 'Firefox ' + ver(m);
        else if ((m = s.match(/Chrome\/([\d.]+)/))) browser = 'Chrome ' + ver(m);
        else if ((m = s.match(/Version\/([\d.]+)\s+(?:Mobile\/\S+\s+)?Safari/))) browser = 'Safari ' + ver(m);
        else if (/Safari\//.test(s)) browser = 'Safari';

        if (/Windows NT 10\.0/.test(s)) os = 'Windows 10/11';
        else if ((m = s.match(/Windows NT ([\d.]+)/))) os = 'Windows ' + m[1];
        else if (/iPhone|iPad|iPod/.test(s)) os = 'iOS';
        else if ((m = s.match(/Mac OS X ([\d_]+)/))) os = 'macOS ' + m[1].split('_').join('.');
        else if ((m = s.match(/Android ([\d.]+)/))) os = 'Android ' + m[1];
        else if (/Linux/.test(s)) os = 'Linux';
        return { browser: browser, os: os };
    }

    // ---- URL 身份参数：?n=<本子>&u=<用户> ----
    // 不带参数 = 沿用本地设置（首次打开即 note / user），所以「无参」等价于 ?n=note&u=user。
    // ⚠️ 只对「本次打开」生效，绝不写回 localStorage（见 saveSettings）：
    //    链接是临时身份，不能因为别人打开一次就把本机的默认设置改掉。
    function urlIdent(name) {
        try {
            var m = String(location.search || '').match(new RegExp('(?:^|[?&])' + name + '=([^&]*)'));
            if (!m) return '';
            // 控掉换行/制表/分隔符：否则访问记录会被撑成两行、或把行内字段切错位
            var v = decodeURIComponent(String(m[1]).replace(/\+/g, ' '))
                .replace(/[\u0000-\u001f\u2028\u2029]+/g, ' ').trim().slice(0, 40);
            // __log / __access 是访问记录占用的保留通道，别被链接参数撞上（撞了会把笔记塞进记录里）
            return /^__/.test(v) ? '' : v;
        } catch (e) { return ''; }
    }

    // ?u=张三 既当身份也当署名：发给谁的链接就带谁的名字，访客零操作。
    // ⚠️ 没传 ?u= 时身份回落到内置的 user，但**不署名** —— 记录里绝不出现默认值，只有显式带参才记名字。
    // 浏览器拿不到 IP 也拿不到身份，这是唯一能知道「谁」的手段。
    function visitWho() {
        return urlIdent('u').split('\u00b7').join('/').slice(0, 24);
    }

    // 标出「身份来自链接参数」的输入框，免得和本地设置混起来分不清
    function markUrlIdents() {
        [['bookId', 'n'], ['userId', 'u']].forEach(function (p) {
            var el = $(p[0]);
            if (!el) return;
            if (urlIdent(p[1])) {
                el.classList.add('from-url');
                el.title = '本次由链接参数 ?' + p[1] + '= 指定（不会写入本地设置）';
            } else {
                el.classList.remove('from-url');
                el.removeAttribute('title');
            }
        });
    }

    // ---- 访客信息字段（2026-10-14 按「能取到的全加上」实现，先看效果、之后再逐项删）----
    // 🔑 增删字段只动 visitLine 里那一串 push：取不到值的字段自动跳过，行里不会留空档。
    // ⚠️ 署名固定放最后一段、且带 '@' 前缀 —— 面板靠它定位，不再依赖「第 N 段」（字段增减不再影响高亮）。

    // 显卡渲染器（WebGL 调试扩展）。偏指纹，属于"先看效果"的字段，不想要就删掉这段 push。
    function gpuName() {
        // jsdom 之类环境根本没有 WebGL 接口，直接跳过 —— 既省一次无用的 getContext，
        // 也避免触发 jsdom 的 "not implemented" 噪音
        if (typeof WebGLRenderingContext === 'undefined') return '';
        try {
            var c = document.createElement('canvas');
            var g = c.getContext('webgl') || c.getContext('experimental-webgl');
            if (!g) return '';
            var d = g.getExtension('WEBGL_debug_renderer_info');
            var s = d ? String(g.getParameter(d.UNMASKED_RENDERER_WEBGL) || '') : '';
            if (!s) return '';
            // `ANGLE (Intel, Intel(R) Iris(R) Xe Graphics (0xA7A0) Direct3D11 vs_5_0 ps_5_0, D3D11)`
            // → 取中间那段显卡名，再去掉驱动标记
            if (/^ANGLE\s*\(/i.test(s)) {
                var seg = s.replace(/^ANGLE\s*\(/i, '').replace(/\)\s*$/, '').split(/,\s*/);
                s = seg.length > 1 ? seg[1] : seg[0];
            }
            return s.replace(/\s*\(0x[0-9a-f]+\)/ig, '')
                .replace(/\s+(?:Direct3D|OpenGL|D3D|vs_|ps_)\S*/ig, '')
                .replace(/\s+/g, ' ').trim().slice(0, 48);
        } catch (e) { return ''; }
    }

    // UA-CH 高熵值：唯一能区分 Win10 / Win11 的手段（UA 里一律是 `Windows NT 10.0`）。
    // ⚠️ 这张映射表 Chrome 一直在调（实测本机报 19.0.0），只能当线索、别用来精确判定。
    // Firefox / Safari 没有 userAgentData，取不到就返回空、字段自动跳过。
    function uaPlatform() {
        try {
            var d = navigator.userAgentData;
            if (!d || !d.getHighEntropyValues) return Promise.resolve('');
            return d.getHighEntropyValues(['platformVersion']).then(function (hv) {
                return (hv && hv.platformVersion) ? String(hv.platformVersion) : '';
            }).catch(function () { return ''; });
        } catch (e) { return Promise.resolve(''); }
    }

    // 来源：区分「直接打开」和「从别的页面点进来」（微信/QQ/同事转的链接都算）。file:// 打开必为空。
    function refText() {
        var r = '';
        try { r = document.referrer || ''; } catch (e) {}
        if (!r) return '直接打开';
        try {
            var u = new URL(r);
            return '来自 ' + u.host + (u.pathname && u.pathname !== '/' ? u.pathname : '');
        } catch (e) { return '来自 ' + String(r).slice(0, 48); }
    }

    // 一行记录。字段顺序 = 下面的 push 顺序；改顺序会让老记录看起来错位，但不影响解析
    // （署名是靠 '@' 前缀认出来的，不靠段号）。
    async function visitLine(now) {
        var uaStr = String(navigator.userAgent || '');
        var p = parseUA(uaStr);
        var f = [fmtFull(now), p.browser, p.os];

        if (screen.width) f.push(screen.width + 'x' + screen.height + '@' + (window.devicePixelRatio || 1));
        f.push(window.innerWidth + 'x' + window.innerHeight);   // 窗口尺寸：比 screen 更接近「实际怎么用的」

        var tz = '';
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
        if (tz) f.push(tz);

        if (navigator.language) {
            f.push((navigator.languages && navigator.languages.length > 1)
                ? navigator.languages.join(',') : navigator.language);
        }
        if (navigator.hardwareConcurrency) f.push(navigator.hardwareConcurrency + ' 核');
        if (navigator.deviceMemory) f.push(navigator.deviceMemory + ' GB');
        var con = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (con && con.effectiveType) f.push(String(con.effectiveType).toUpperCase());
        try { f.push(matchMedia('(prefers-color-scheme: dark)').matches ? '深色' : '浅色'); } catch (e) {}
        if (typeof navigator.maxTouchPoints === 'number') {
            f.push(navigator.maxTouchPoints ? '触摸 ' + navigator.maxTouchPoints : '无触摸');
        }
        var gpu = gpuName();
        if (gpu) f.push(gpu);
        f.push(refText());
        var plat = await uaPlatform();
        if (plat) f.push('平台 ' + plat);
        if (uaStr) f.push('UA ' + uaStr);

        var who = visitWho();
        if (who) f.push('@' + who);        // 署名固定最后一段，且带 '@'
        return f.join(LOG_SEP);
    }

    // 把若干条消息里的内容全部摊平成「记录行」（非本格式的行直接忽略）
    function logLinesOf(list) {
        var out = [];
        for (var i = 0; i < list.length; i++) {
            var text = decodeNl(unquote(String(list[i].content == null ? '' : list[i].content)));
            var rows = text.split('\n');
            for (var j = 0; j < rows.length; j++) {
                var line = rows[j].replace(/\s+$/, '');
                if (LOG_LINE.test(line)) out.push(line);
            }
        }
        return out;
    }

    // 去重（按行内容）+ 按时间倒序。多标签页并发会各写一片，只取「最新一条」会丢记录，
    // 取并集一定错不了 —— 内容天然是累积的。
    function mergeLogLines(list) {
        var src = logLinesOf(list), seen = {}, out = [];
        for (var i = 0; i < src.length; i++) {
            if (seen[src[i]]) continue;
            seen[src[i]] = 1;
            out.push(src[i]);
        }
        // 时间格式定宽，字符串直接比大小就是按时间排
        out.sort(function (a, b) { return a < b ? 1 : (a > b ? -1 : 0); });
        return out;
    }

    function byCreateTime(a, b) { return Number(a.create_time || 0) - Number(b.create_time || 0); }

    // 读访问记录。limit 由调用方决定：上报只要最新 1 条，开面板才多要几条。
    // 不跟随设置里的「历史条数」—— 那是笔记本的。
    async function fetchLog(limit) {
        var data = await callApi('/get/message', {
            user_id: LOG_USER, conversation_id: LOG_CONV,
            message_limit_number: limit || LOG_READ_VIEW
        }, false, DEFAULT_KEY);
        return (data.message_detail_list || []).filter(function (m) { return m && m.role === 'user'; });
    }

    // 上报一次访问。刻意**不走 busy 锁**：一次网络抖动不该让「保存」按钮点不动。
    // 全程静默失败 —— 访客不该看到报错。
    async function reportVisit() {
        if (!logVisitOn()) return;
        var line = '';
        // visitLine 已把每一步都包了 try，这里再兜一层：取 UA 熵值等异步步骤失败也不能冒泡到 init
        try { line = await visitLine(Date.now()); } catch (e) { return; }
        var list = [];
        // 只拉最新 1 条：它就装着全部历史，下载量从 ~215KB 降到 ~28KB
        try { list = await fetchLog(LOG_READ_TIP); } catch (e) { list = []; }
        list.sort(byCreateTime);
        var rows = list.length ? logLinesOf([list[list.length - 1]]) : [];
        if (rows.indexOf(line) < 0) rows.push(line);
        // 单条滚动：超上限就从头部丢掉最老的几行，保留量恒定，不会像分片那样在 50~149 之间锯齿
        if (rows.length > LOG_MAX) rows = rows.slice(rows.length - LOG_MAX);
        var payload = rows.join('\n');
        try {
            await callApi('/add/message', {
                user_id: LOG_USER,
                conversation_id: LOG_CONV,
                messages: [{ role: 'user', content: encodeNl(payload) }],
                async_mode: false,       // 累积写入必须确认上一次写成功，不能用异步
                allow_memory_view: []    // 别给访客抽记忆、建画像
            }, true, DEFAULT_KEY);
        } catch (e) { /* 静默 */ }
    }

    // 一行一条，等宽字体，时间在前；署名单独高亮
    // ---- 访问记录的「关键 / 详情」分级（2026-10-14 用户要求：默认只显示关键信息，点开看其余）----
    // 🔴 按字段**特征**认，不按段号：记录格式跨版本变过（老的只有 5 段、新的 17 段），
    //    按段号切会把老记录切错位 —— 第 5 段在老记录里是时区，在新记录里却是网络类型。
    //    另一好处：以后想改「什么算关键」，只动这里，历史记录立刻跟着重新分拣，不用重写数据。
    function segKind(s) {
        if (s.charAt(0) === '@') return 'who';                                            // 署名
        if (/^未知浏览器$/.test(s) ||
            /^(Chrome|Edge|OPR|Opera|Firefox|FxiOS|CriOS|Safari|Samsung|WebView|UC|QQ|MQQBrowser|Miui|HeyTap)\b/.test(s)) return 'browser';
        if (/^未知系统$/.test(s) ||
            /^(Windows|macOS|Android|iOS|iPadOS|Linux|HarmonyOS|Chrome OS|Ubuntu|Debian|FreeBSD)\b/.test(s)) return 'os';
        if (/^\d+x\d+@[\d.]+$/.test(s)) return 'screen';   // 屏幕@像素比（信息比视口全，含物理分辨率）
        if (/^(深色|浅色)$/.test(s)) return 'theme';
        if (/^来自\s/.test(s) || s === '直接打开') return 'ref';
        return 'extra';   // 视口/时区/语言/CPU/内存/网络/触摸/显卡/平台版本/UA 原文
    }

    // 折叠态只留主版本（Chrome 143.0.7499.192 → Chrome 143）：认老浏览器看主版本就够了，
    // 完整版号在展开区的 UA 原文里本来就有，不重复造一段。
    // ⚠️ 只对「浏览器」段调用，别拿去截系统 —— macOS 10.15.7 会被截成 10.15。
    function shortVer(s) {
        return s.replace(/^([A-Za-z][A-Za-z ]*?)\s+(\d+)(?:\.\d+)*$/, '$1 $2');
    }

    function renderLog(lines, shown) {
        var box = $('sheetBody');
        box.textContent = '';
        if (!lines.length) {
            var em = document.createElement('div');
            em.className = 'log-empty';
            em.textContent = '还没有访问记录。';
            box.appendChild(em);
            return;
        }
        var n = Math.min(shown, lines.length);

        var stat = document.createElement('div');
        stat.className = 'log-stat';
        var statTx = document.createElement('span');
        statTx.textContent = '共 ' + lines.length + ' 次访问 · 最近一次 ' + ((lines[0].match(LOG_LINE) || [])[1] || '');
        stat.appendChild(statTx);

        var list = document.createElement('div');
        list.className = 'log-list';
        var anyDetail = false;

        for (var i = 0; i < n; i++) {
            var m = lines[i].match(LOG_LINE) || ['', lines[i], ''];
            var rest = m[2] ? m[2].split(LOG_SEP) : [];
            var keys = [], extra = [], who = '';
            for (var g = 0; g < rest.length; g++) {
                var kind = segKind(rest[g]);
                if (kind === 'who') who = rest[g];
                else if (kind === 'extra') extra.push(rest[g]);
                else keys.push(kind === 'browser' ? shortVer(rest[g]) : rest[g]);
            }

            var row = document.createElement('div');
            row.className = 'log-row';
            var hasX = extra.length > 0;
            if (hasX) { row.className += ' has-detail'; anyDetail = true; }

            // 关键信息装进 .lg-head：折叠态看得见的就是它，展开区（.lg-detail）是它的补充
            var head = document.createElement('div');
            head.className = 'lg-head';

            var ar = document.createElement('span');
            ar.className = 'lg-arrow';       // 字形由 CSS ::before 给，切换只改 class
            head.appendChild(ar);

            var t = document.createElement('span');
            t.className = 'lg-time';
            t.textContent = m[1];
            head.appendChild(t);

            if (keys.length) {
                var kd = document.createElement('span');
                kd.textContent = LOG_SEP + keys.join(LOG_SEP);
                head.appendChild(kd);
            }
            if (hasX) {
                var ct = document.createElement('span');
                ct.className = 'lg-count';
                ct.textContent = '+' + extra.length;
                head.appendChild(ct);
            }
            if (who) {
                var w = document.createElement('span');
                w.className = 'lg-who';
                w.textContent = LOG_SEP + who;
                head.appendChild(w);
            }
            row.appendChild(head);
            if (hasX) {
                var dt = document.createElement('div');
                dt.className = 'lg-detail';
                for (var e = 0; e < extra.length; e++) {
                    var es = document.createElement('span');
                    if (extra[e].indexOf('UA ') === 0) es.className = 'lg-ua';
                    es.textContent = (e ? LOG_SEP : '') + extra[e];
                    dt.appendChild(es);
                }
                row.appendChild(dt);
            }
            list.appendChild(row);
        }

        // 点整行展开/收起。⚠️ 拖选文字松手也会触发 click —— 有选区/有高亮时不当成"点击"，
        // 否则想复制 UA 原文反而把内容收起来了。
        list.addEventListener('click', function (ev) {
            var tg = ev.target;
            if (!tg || !tg.closest) return;
            var row = tg.closest('.log-row');
            if (!row || row.parentNode !== list || !row.classList.contains('has-detail')) return;
            var s = null;
            try { s = window.getSelection(); } catch (er) {}
            if (s && ((s.rangeCount && s.isCollapsed === false) || String(s))) return;
            row.classList.toggle('open');
        });

        // 「全部展开」：直接切 class 而不重建列表 —— 重建会让滚动位置弹回顶部，100 行时很难受
        if (anyDetail) {
            var bAll = document.createElement('button');
            bAll.type = 'button';
            bAll.textContent = '全部展开';
            bAll.addEventListener('click', function () {
                var on = bAll.textContent === '全部展开';
                var rows = list.querySelectorAll('.log-row.has-detail');
                for (var k = 0; k < rows.length; k++) rows[k].classList.toggle('open', on);
                bAll.textContent = on ? '全部收起' : '全部展开';
            });
            stat.appendChild(bAll);
        }

        box.appendChild(stat);
        box.appendChild(list);

        if (lines.length > n) {
            var more = document.createElement('div');
            more.className = 'log-more';
            var btn = document.createElement('button');
            btn.textContent = '显示更多（还有 ' + (lines.length - n) + ' 条）';
            btn.addEventListener('click', function () { renderLog(lines, n + 500); });
            more.appendChild(btn);
            box.appendChild(more);
        }
    }

    // 关面板统一入口，同时清理展开状态。
    function closeSheet() { $('sheet').classList.remove('open', 'wide'); }

    async function showAccess() {
        if (busy) return;
        setBusy(true);
        $('sheetTitle').textContent = '访问记录';
        $('sheetBody').textContent = '正在读取访问记录…';
        $('sheet').classList.add('open', 'wide');
        try {
            // 合并只为了取多标签页并集；最终仍按滚动窗口上限裁一次，
            // 否则会把「刚被挤掉、但还留在旧消息里」的几行也数进来（显示 100 行、统计却说 103）
            renderLog(mergeLogLines(await fetchLog(LOG_READ_VIEW)).slice(0, LOG_MAX), LOG_KEEP);
        } catch (e) {
            $('sheetBody').textContent = '读取失败：' + e.message;
        } finally {
            setBusy(false);
        }
    }

    /* ================= 标题目录 ================= */

    var outlineEntries = [];
    var outlineCollapsed = new Set();
    var outlineSignature = '';
    var outlineTimer = null;
    var outlineFrame = null;

    function setOutlineOpen(open, remember) {
        $('tocPanel').classList.toggle('collapsed', !open);
        $('tocToggle').textContent = open ? '‹' : '☷';
        $('tocToggle').title = open ? '收起目录' : '展开目录';
        $('tocToggle').setAttribute('aria-label', open ? '收起目录' : '展开目录');
        $('tocToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
        $('tocBackdrop').classList.toggle('open', open && window.innerWidth <= 640);
        if (remember) {
            try { localStorage.setItem('memos_toc_' + (window.innerWidth <= 640 ? 'mobile' : 'desktop'), open ? '1' : '0'); } catch (e) {}
        }
        queueOutlineActive();
    }

    function readOutline() {
        var entries = [], counts = Object.create(null);
        function add(level, text, node, offset) {
            text = text.replace(/\s+/g, ' ').trim();
            if (!text) return;
            var base = level + ':' + text;
            counts[base] = (counts[base] || 0) + 1;
            entries.push({ level: level, text: text, node: node, offset: offset, key: base + ':' + counts[base], children: [] });
        }
        if (!rawMode) {
            Array.prototype.forEach.call(editor.querySelectorAll('h1,h2,h3,h4,h5,h6'), function (heading) {
                if (!heading.closest('pre,table')) add(Number(heading.tagName[1]), preText(heading), heading, 0);
            });
        } else {
            var lines = rawBox.value.split('\n'), offset = 0, fenced = null;
            lines.forEach(function (line) {
                if (fenced) { if (codeFenceEnd(line, fenced)) fenced = null; }
                else if (codeFenceStart(line)) fenced = codeFenceStart(line);
                else {
                    var m = line.match(/^\s*(#{1,6})[ \t]+(.*)$/);
                    if (m) {
                        var label = document.createElement('div');
                        label.innerHTML = inlineMd(esc(m[2].trim()), true);
                        add(m[1].length, preText(label), null, offset);
                    }
                }
                offset += line.length + 1;
            });
        }
        return entries;
    }

    function updateOutlineTreeToggle() {
        var branches = outlineEntries.filter(function (entry) { return entry.children.length; });
        var folded = branches.length && branches.every(function (entry) { return outlineCollapsed.has(entry.key); });
        $('tocTreeToggle').disabled = !branches.length;
        $('tocTreeToggle').textContent = folded ? '展开层级' : '收起层级';
        $('tocTreeToggle').title = folded ? '展开全部子标题' : '收起全部子标题';
    }

    function renderOutline() {
        clearTimeout(outlineTimer);
        var entries = readOutline(), roots = [], stack = [];
        entries.forEach(function (entry) {
            while (stack.length && stack[stack.length - 1].level >= entry.level) stack.pop();
            entry.parent = stack.length ? stack[stack.length - 1] : null;
            (entry.parent ? entry.parent.children : roots).push(entry);
            stack.push(entry);
        });
        outlineEntries = entries;
        var signature = JSON.stringify(entries.map(function (entry) { return [entry.key, outlineCollapsed.has(entry.key)]; }));
        if (signature !== outlineSignature) {
            outlineSignature = signature;
            var list = $('tocList');
            list.textContent = '';
            function tree(items) {
                var ol = document.createElement('ol');
                items.forEach(function (entry) {
                    var li = document.createElement('li'), row = document.createElement('div');
                    row.className = 'toc-row';
                    row.dataset.key = entry.key;
                    row.dataset.level = entry.level;
                    if (entry.children.length) {
                        var branch = document.createElement('button');
                        branch.type = 'button';
                        branch.className = 'toc-branch';
                        branch.dataset.branch = entry.key;
                        var expanded = !outlineCollapsed.has(entry.key);
                        branch.textContent = expanded ? '▾' : '▸';
                        branch.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                        branch.setAttribute('aria-label', (expanded ? '收起' : '展开') + entry.text + '的子标题');
                        row.appendChild(branch);
                    } else {
                        var spacer = document.createElement('span');
                        spacer.className = 'toc-branch-space';
                        row.appendChild(spacer);
                    }
                    var link = document.createElement('button');
                    link.type = 'button';
                    link.className = 'toc-link';
                    link.dataset.jump = entry.key;
                    link.textContent = entry.text;
                    link.title = entry.text;
                    row.appendChild(link);
                    li.appendChild(row);
                    if (entry.children.length) {
                        var children = tree(entry.children);
                        children.hidden = outlineCollapsed.has(entry.key);
                        li.appendChild(children);
                    }
                    ol.appendChild(li);
                });
                return ol;
            }
            if (entries.length) list.appendChild(tree(roots));
            else {
                var empty = document.createElement('div');
                empty.className = 'toc-empty';
                empty.textContent = '暂无标题';
                list.appendChild(empty);
            }
        }
        updateOutlineTreeToggle();
        queueOutlineActive();
    }

    function queueOutlineUpdate() {
        clearTimeout(outlineTimer);
        outlineTimer = setTimeout(renderOutline, 80);
    }

    function queueOutlineActive() {
        if (outlineFrame !== null) return;
        outlineFrame = requestAnimationFrame(function () {
            outlineFrame = null;
            var active = null;
            if (rawMode) {
                for (var i = 0; i < outlineEntries.length; i++) {
                    if (outlineEntries[i].offset > rawBox.selectionStart) break;
                    active = outlineEntries[i];
                }
            } else {
                var wrap = $('docWrap'), bounds = wrap.getBoundingClientRect();
                var atBottom = wrap.scrollTop > 0 && wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 2;
                var top = atBottom ? bounds.bottom - 24 : bounds.top + 48;
                outlineEntries.forEach(function (entry) {
                    if (entry.node && entry.node.getBoundingClientRect().top <= top) active = entry;
                });
            }
            active = active || outlineEntries[0];
            var parent = active && active.parent;
            while (parent) { if (outlineCollapsed.has(parent.key)) active = parent; parent = parent.parent; }
            Array.prototype.forEach.call($('tocList').querySelectorAll('.toc-row'), function (row) {
                var selected = !!active && row.dataset.key === active.key;
                row.classList.toggle('active', selected);
                var link = row.querySelector('.toc-link');
                if (selected) link.setAttribute('aria-current', 'location');
                else link.removeAttribute('aria-current');
            });
        });
    }

    function jumpToOutline(key) {
        var entry = outlineEntries.find(function (item) { return item.key === key; });
        if (!entry) return;
        if (rawMode) {
            rawBox.focus();
            rawBox.setSelectionRange(entry.offset, entry.offset);
            // 用同尺寸的镜像计算软换行后的真实行高，而不是按 Markdown 行数估算。
            var mirror = document.createElement('div'), style = getComputedStyle(rawBox);
            ['fontFamily', 'fontSize', 'lineHeight', 'letterSpacing', 'padding', 'border', 'boxSizing', 'wordBreak'].forEach(function (name) { mirror.style[name] = style[name]; });
            mirror.style.cssText += ';position:fixed;left:-10000px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;';
            mirror.style.width = rawBox.clientWidth + 'px';
            mirror.textContent = rawBox.value.slice(0, entry.offset);
            var marker = document.createElement('span');
            marker.textContent = '\u200b';
            mirror.appendChild(marker);
            document.body.appendChild(mirror);
            rawBox.scrollTop = Math.max(0, marker.offsetTop - 24);
            mirror.remove();
        } else if (entry.node && editor.contains(entry.node)) {
            var wrap = $('docWrap');
            wrap.scrollTo({ top: wrap.scrollTop + entry.node.getBoundingClientRect().top - wrap.getBoundingClientRect().top - 24, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        }
        if (window.innerWidth <= 640) setOutlineOpen(false, false);
        queueOutlineActive();
    }

    /* ================= 编辑器状态 ================= */

    function syncEmpty() {
        updateDocumentTitle();
        var txt = editor.textContent.replace(/\u200b/g, '');
        var hasBlock = editor.querySelector('img,hr,pre,table,ul,ol,blockquote,[data-md-audio]');
        editor.classList.toggle('is-empty', !txt.trim() && !hasBlock);
    }

    // 末尾块是代码块/引用/列表/分割线时，浏览器里点最下面点不出光标（进不去新的一行）。
    // 这里保证最后永远跟一个空段落：它序列化成 Markdown 时会被丢掉，不污染内容。
    // 🔑 打上 data-tail 标记，才能和「用户自己敲出来的空段落」区分开 ——
    //    前者是占位（不进内容），后者是用户留的白（必须活着往返）。
    function ensureTail() {
        var last = editor.lastElementChild;
        if (!last) return;
        var tag = last.tagName.toLowerCase();
        if ((tag === 'p' || tag === 'div') && !last.hasAttribute('data-md-layout') && !last.hasAttribute('data-md-audio') && !last.hasAttribute('data-md-request') && !last.hasAttribute('data-md-request-invalid')) return;
        var p = document.createElement('p');
        p.appendChild(document.createElement('br'));
        p.setAttribute('data-tail', '1');
        editor.appendChild(p);
    }

    // 同时把内容灌进两个编辑器（Markdown 视图与原文视图），保证切换不丢内容。
    // savedAt 用「这一版在服务器上的写入时间」，这样刚打开页面时状态栏显示的就是
    // 「已保存 2026-09-29 13:53:03」而不是误报未保存。
    function loadIntoEditor(md, savedAt) {
        stopAudioPlayback();
        clearTimeout(saveTimer);
        saveTimer = null;
        lastEditorRange = null;
        hideImageBar();
        editorLoadRevision++;
        selectedHistoryState = null;
        var blankState = md === EMPTY_STATE_MARKER;
        md = blankState ? '' : normMd(md || '');
        editor.innerHTML = md ? md2html(md) : '';
        rawBox.value = md;
        lastSavedMd = md;
        lastSavedIsBlankState = blankState;
        historyNeedsSave = false;
        lastSavedAt = savedAt ? Number(savedAt) : 0;
        ensureTail();
        syncEditorModeUI();
        syncEmpty();
        syncTableBar();
        renderOutline();
        resetEditorHistory();
        syncAudioPlayers();
    }

    function currentMd() {
        return rawMode ? rawBox.value : html2md(editor);
    }

    function isReadOnly() { return editorMode === 'read' || !notebookReady(); }

    function syncEditorModeUI() {
        var ready = notebookReady();
        var editing = editorMode === 'edit' && ready;
        editor.contentEditable = editing ? 'true' : 'false';
        editor.classList.toggle('read-only', isReadOnly());
        editor.style.display = rawMode ? 'none' : '';
        rawBox.readOnly = !rawMode || !ready;
        rawBox.classList.toggle('show', rawMode);
        Array.prototype.forEach.call(editor.querySelectorAll('li[data-task] input[type="checkbox"]'), function (input) {
            input.disabled = isReadOnly();
        });
        $('toolbar').classList.toggle('raw-mode', rawMode);
        $('toolsToggle').hidden = !editing;
        if (!editing) $('toolbar').classList.add('collapsed');
        var toolsOpen = !$('toolbar').classList.contains('collapsed');
        $('toolsToggle').textContent = toolsOpen ? '收起' : '编辑';
        $('toolsToggle').setAttribute('aria-expanded', toolsOpen ? 'true' : 'false');
        var label = isReadOnly() ? '只读' : (rawMode ? '原文' : '排版');
        var nextLabel = isReadOnly() ? '排版编辑' : (rawMode ? '只读' : '原文编辑');
        $('rawToggle').textContent = label;
        $('rawToggle').disabled = !ready;
        $('rawToggle').dataset.mode = editorMode;
        $('rawToggle').title = '当前' + label + '，点击切换到' + nextLabel;
        $('rawToggle').setAttribute('aria-label', $('rawToggle').title);
        if (!editing) {
            hideImageBar();
            closeTablePicker();
        }
        syncTableBar();
    }

    // 原文重新排版时复用音乐节点，播放器、下载任务和事件监听继续指向同一首歌。
    function renderEditorKeepingMusic(md) {
        var copy = document.createElement('div'); copy.innerHTML = md ? md2html(md) : '';
        var existing = musicTracks(), used = new Set();
        var replacements = Array.prototype.map.call(copy.querySelectorAll('[data-md-audio]'), function (block) {
            return { block: block, previous: null };
        });
        // 同地址重复出现时优先保留正在播放的节点，不能因匹配到另一副本而中断。
        if (musicCurrent && existing.indexOf(musicCurrent) >= 0) {
            var active = replacements.find(function (item) {
                return item.block.getAttribute('data-audio-src') === musicCurrentUrl &&
                    item.block.getAttribute('data-audio-title') === musicCurrent.getAttribute('data-audio-title');
            }) || replacements.find(function (item) { return item.block.getAttribute('data-audio-src') === musicCurrentUrl; });
            if (active) { active.previous = musicCurrent; used.add(musicCurrent); }
        }
        // 先匹配名称和地址，再匹配只改了名称的音乐，避免重复地址错配当前歌曲。
        [true, false].forEach(function (exact) {
            replacements.forEach(function (item) {
                if (item.previous) return;
                var source = item.block.getAttribute('data-audio-src'), title = item.block.getAttribute('data-audio-title');
                var previous = existing.find(function (block) {
                    return !used.has(block) && block.getAttribute('data-audio-src') === source &&
                        (!exact || block.getAttribute('data-audio-title') === title);
                });
                if (previous) { item.previous = previous; used.add(previous); }
            });
        });
        replacements.forEach(function (item) {
            if (!item.previous) return;
            var title = item.block.getAttribute('data-audio-title') || '';
            item.previous.setAttribute('data-audio-title', title);
            var name = item.previous.querySelector('[data-audio-name]');
            if (name) name.textContent = title || '音乐';
            item.block.replaceWith(item.previous);
        });
        var content = document.createDocumentFragment();
        while (copy.firstChild) content.appendChild(copy.firstChild);
        editor.replaceChildren(content);
    }

    function setEditorMode(next) {
        if (!notebookReady()) return;
        if (['read', 'edit', 'raw'].indexOf(next) < 0) return;
        var changed = next !== editorMode;
        var sourceChanged = (next === 'raw') !== rawMode;
        var scrollTop = $('docWrap').scrollTop;
        // 只读与排版共用正文 DOM，切换时保留选区、内容及撤销记录。
        // 只有跨越原文边界才转换 Markdown，保存基线和待保存状态保持原值。
        var md = sourceChanged ? normMd(currentMd()) : null;
        if (changed) {
            editorModeRevision++;
            editorHistoryGroup = '';
            editorHistoryAt = 0;
            editorHistoryMerge = false;
            editorCompositionGroup = '';
        }
        editorMode = next;
        rawMode = next === 'raw';
        if (sourceChanged) {
            lastEditorRange = null;
            rawBox.value = md;
            // 进入原文只切换视图；离开原文才更新正文，并保留同地址音乐的播放状态。
            if (!rawMode) { renderEditorKeepingMusic(md); ensureTail(); }
        }
        syncEditorModeUI();
        syncEmpty();
        showIdleStatus();
        renderOutline();
        if (sourceChanged) resetEditorHistory();
        syncAudioPlayers();
        $('docWrap').scrollTop = scrollTop;
    }

    /* ================= 保存 ================= */

    function hasAutomaticSaveWork() {
        if (!notebookReady()) return false;
        // 只读浏览历史本身不触发还原；先前实际编辑的草稿仍可完成自动保存。
        return !!saveTimer || (lastSavedMd !== null && currentMd() !== lastSavedMd) ||
            (!isReadOnly() && historyNeedsSave);
    }

    function scheduleSave(group) {
        if(rawMode)updateDocumentTitle();
        if (!notebookReady()) return;
        if (group !== 'history') recordEditorHistory(group);
        queueOutlineUpdate();
        if (autoSaveOn() && (!isReadOnly() || hasAutomaticSaveWork())) {
            setStatus('编辑中…', 'saving');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function () { doSave(false); }, saveDelaySec() * 1000);
        } else {
            // 自动保存关闭，或只读状态没有待保存编辑时，不安排写入。
            clearTimeout(saveTimer);
            saveTimer = null;
            showIdleStatus();
        }
    }

    function doSave(keepalive, deferRefresh) {
        if (!notebookReady()) return Promise.resolve(false);
        clearTimeout(saveTimer);
        saveTimer = null;
        if (saveInFlight) {
            var requestedRevision = editorLoadRevision;
            var requestedBook = book();
            // 同一版本的连点只共用一个请求；期间有新改动则接着保存最新内容。
            return saveInFlight.then(function (ok) {
                if (!ok) return false;
                var activeBook = book();
                if (requestedRevision !== editorLoadRevision || requestedBook.user_id !== activeBook.user_id || requestedBook.conversation_id !== activeBook.conversation_id) return true;
                var md = normMd(currentMd());
                if (md !== lastSavedMd || historyNeedsSave || (!md.trim() && !lastSavedIsBlankState)) return doSave(keepalive, deferRefresh);
                return true;
            });
        }
        saveInFlight = saveCurrentNote(keepalive, deferRefresh);
        var pending = saveInFlight;
        pending.then(function () { if (saveInFlight === pending) saveInFlight = null; });
        return pending;
    }

    async function saveCurrentNote(keepalive, deferRefresh) {
        if (!notebookReady()) return false;
        var context = notebookContext();
        clearTimeout(saveTimer);
        saveTimer = null;
        var b = book();
        if (!b.user_id || !b.conversation_id) return false;
        var md = normMd(currentMd());
        var blankState = !md.trim();
        var revision = editorLoadRevision;
        if (md === lastSavedMd && (!blankState || lastSavedIsBlankState) && !historyNeedsSave) {
            if (lastSavedMd !== null) setStatus(savedLabel(), 'saved');
            return true;
        }

        setStatus('保存中…', 'saving');
        try {
            await writeNote(blankState ? EMPTY_STATE_MARKER : md, keepalive);
            if (!notebookMatches(context)) return true;
            var activeBook = book();
            if (activeBook.user_id !== b.user_id || activeBook.conversation_id !== b.conversation_id) return true;
            if (revision === editorLoadRevision) {
                lastSavedMd = md;
                lastSavedIsBlankState = blankState;
                historyNeedsSave = false;
                selectedHistoryState = null;
                lastSavedAt = Date.now();
                loadedIdx = -1;
                showIdleStatus();
            }
            if (!deferRefresh) {
                try {
                    if (!await fetchNotes() || !notebookMatches(context)) return true;
                    var latest = latestState();
                    if (revision === editorLoadRevision) {
                        var matchesSaved = latest && sameMd(stateContent(latest), md);
                        loadedIdx = matchesSaved ? notes.lastIndexOf(latest) : -1;
                        if (matchesSaved && isFinite(Number(latest.t)) && Number(latest.t) >= lastSavedAt) lastSavedAt = Number(latest.t);
                    } else if (selectedHistoryState) {
                        var selected = selectedHistoryState;
                        loadedIdx = notes.findIndex(function (note) { return note.t === selected.t && note.text === selected.text; });
                    }
                    renderSide();
                } catch (readError) {
                    if (!notebookMatches(context)) return true;
                    if (!keepalive) toast('笔记已保存，历史列表暂未更新：' + readError.message, true);
                }
            }
            showIdleStatus();
            return true;
        } catch (e) {
            if (!notebookMatches(context)) return false;
            setStatus('保存失败', 'error');
            if (!keepalive) toast('保存失败：' + e.message, true);
            return false;
        }
    }

    /* ================= 渲染：侧边栏历史 ================= */

    function renderSide() {
        var list = $('sideList');
        list.textContent = '';
        if (!notes.length) {
            var em = document.createElement('div');
            em.className = 'side-empty';
            em.textContent = '还没有历史记录';
            list.appendChild(em);
        }
        for (var i = notes.length - 1; i >= 0; i--) {
            var n = notes[i];
            var k = kindOf(n.text);
            var isState = k === 'note' || k === 'blank';
            var row = document.createElement('div');
            row.className = 'sitem' + (isState && i === loadedIdx ? ' cur' : '');

            var head = document.createElement('div');
            head.className = 'srow';
            var t = document.createElement('span');
            t.className = 'stime';
            t.textContent = fmtFull(n.t);
            head.appendChild(t);

            if (isState) {
                var rb = document.createElement('button');
                rb.className = 'mini';
                rb.textContent = '还原';
                rb.title = k === 'blank' ? '把空白状态重新设为最新版本' : '把这一版重新写入笔记本，成为最新版本';
                (function (idx) {
                    rb.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        restoreNote(idx);
                    });
                })(i);
                head.appendChild(rb);
            }
            row.appendChild(head);

            var c = document.createElement('div');
            c.className = 'stext' + (k === 'note' ? '' : ' muted');
            var flat = n.text.replace(/[#>*`~]/g, ' ').replace(/\s+/g, ' ').trim();
            if (k === 'void') c.textContent = '（占位符）' + flat.slice(0, 60);
            else if (k === 'internal') c.textContent = '（总结请求，不计入笔记）' + flat.slice(0, 40);
            else if (k === 'blank') c.textContent = '（空白状态，可重新编辑）';
            else c.textContent = flat.slice(0, 90) || '（空）';
            row.appendChild(c);

            if (isState) {
                (function (idx) {
                    row.addEventListener('click', function () { loadFromHistory(idx); });
                })(i);
            }
            list.appendChild(row);
        }
        $('sideCount').textContent = notes.length + ' 条' +
            (notes.length !== live.length ? '（有效 ' + live.length + '）' : '') +
            (live.length >= historyLimit() ? ' · 已达 ' + historyLimit() + ' 条读取上限' : '');
    }

    function loadFromHistory(idx) {
        if (!notebookReady()) return;
        clearTimeout(saveTimer);
        saveTimer = null;
        var note = notes[idx];
        if (!note) return;
        editorLoadRevision++;
        selectedHistoryState = note;
        var txt = stateContent(note);
        var blankState = kindOf(note.text) === 'blank';
        if (txt === currentMd() && idx === loadedIdx) {
            historyNeedsSave = true;
            if (blankState) {
                // 用户明确从历史选中空白记录后，点保存应重新写入 #，使空白成为最新版本。
                setStatus('空白待保存 · Ctrl+S', 'saving');
                toast('空白状态已选中，点击保存可将它设为最新版本');
            } else {
                setStatus('历史版本待保存 · Ctrl+S', 'saving');
                toast('历史版本已选中，点击保存可将它设为最新版本');
            }
            return;
        }
        loadIntoEditor(note.text, note.t);
        selectedHistoryState = note;
        historyNeedsSave = true;
        if (blankState) {
            setStatus('空白待保存 · Ctrl+S', 'saving');
        } else {
            setStatus('历史版本待保存 · Ctrl+S', 'saving');
        }
        loadedIdx = idx;
        renderSide();
        $('docWrap').scrollTop = 0;
        toast(blankState ? '已载入空白状态，点击保存可将它设为最新版本' : '已载入历史版本，点击保存可将它设为最新版本');
    }

    // 「还原」= 把这一版重新发送一次，成为最新版本（MemOS 无法删改消息，只能追加）
    async function restoreNote(idx) {
        if (!notebookReady()) return;
        var context = notebookContext();
        if (busy || saveInFlight) { toast('当前操作尚未完成，请稍后再还原', true); return; }
        var n = notes[idx];
        var kind = n ? kindOf(n.text) : '';
        if (!n || (kind !== 'note' && kind !== 'blank')) { toast('这条记录无法还原', true); return; }
        var b = book();
        if (!b.user_id || !b.conversation_id) { toast('请先在设置里填写笔记本 ID 和用户 ID', true); return; }

        setBusy(true);
        setStatus('还原中…', 'saving');
        try {
            var payload = kind === 'blank' ? EMPTY_STATE_MARKER : n.text;
            await writeNote(payload, false);
            if (!notebookMatches(context) || !await fetchNotes() || !notebookMatches(context)) return;
            var latest = latestState();
            if (!latest || (kind === 'blank' ? kindOf(latest.text) !== 'blank' : latest.text !== n.text)) {
                throw new Error('接口已接收写入，但最新历史尚未读回该版本；请稍后刷新确认');
            }
            loadIntoEditor(latest.text, latest.t);
            loadedIdx = latest ? notes.lastIndexOf(latest) : -1;
            renderSide();
            setStatus(savedLabel(), 'saved');
            toast('已还原并重新发送为最新版本');
        } catch (e) {
            if (!notebookMatches(context)) return;
            setStatus('还原失败', 'error');
            toast('还原失败：' + e.message, true);
        } finally {
            setBusy(false);
        }
    }

    /* ================= 动作 ================= */

    // 刷新时把服务器上「最新一条笔记」同步进编辑纸张。
    // MemOS 的消息不可改，所以「刷新」唯一有意义的落点就是：让纸张跟上最新一版。
    // 返回：'synced' 已更新 / 'same' 本来就是最新 / 'dirty' 有未保存改动，不覆盖 / 'empty' 没有笔记
    function syncEditorFromServer() {
        var last = latestState();
        if (!last) return 'empty';
        var idx = notes.lastIndexOf(last);
        // 编辑器有未保存改动时不覆盖，避免把正在写的内容冲掉（lastSavedMd === null 表示尚未与远端对齐，不算脏）
        if (lastSavedMd !== null && !sameMd(currentMd(), lastSavedMd)) return 'dirty';
        if (idx === loadedIdx && sameMd(stateContent(last), lastSavedMd || '')) {
            historyNeedsSave = false;
            return 'same';
        }
        loadIntoEditor(last.text, last.t);
        loadedIdx = idx;
        return 'synced';
    }

    async function refresh(silent) {
        var context = notebookContext();
        if (saveInFlight) await saveInFlight;
        if (!notebookMatches(context)) return false;
        if (busy) { refreshQueued = true; return false; }
        setBusy(true);
        setStatus('读取中…');
        try {
            // 用户清空了已有笔记后点刷新，应先把明确的空白状态写到服务器，
            // 否则服务器最新版本仍是旧正文，刷新会把它重新载入。
            var blankNeedsSave = notebookReady() && lastSavedMd !== null && !currentMd().trim() &&
                (!lastSavedIsBlankState || !sameMd(currentMd(), lastSavedMd));
            if (blankNeedsSave && !await doSave(false, true)) return;
            if (!notebookMatches(context) || !await fetchNotes() || !notebookMatches(context)) return false;
            var r;
            if (!notebookReady()) {
                var last = latestState();
                loadIntoEditor(last ? last.text : '', last ? last.t : 0);
                activeNotebook = context;
                syncEditorModeUI();
                loadedIdx = last ? notes.lastIndexOf(last) : -1;
                r = last ? 'synced' : 'empty';
            } else r = syncEditorFromServer();
            renderSide();
            if (r === 'dirty') showIdleStatus();
            else setStatus(syncedLabel(), 'saved');
            if (!silent) {
                if (r === 'dirty') toast('编辑纸张有未保存的改动，已保留；先 Ctrl+S 再刷新可同步最新');
                else if (r === 'synced') toast('已刷新，编辑纸张已同步到最新');
                else toast('已刷新');
            }
            return true;
        } catch (e) {
            if (!notebookMatches(context)) return false;
            setStatus('读取失败', 'error');
            if (!silent) toast('读取失败：' + e.message, true);
            return false;
        } finally {
            setBusy(false);
        }
    }

    /* ================= 音乐播放与本页缓存 ================= */

    var musicCache = new Map(), musicCacheBytes = 0;
    var MUSIC_CACHE_BUDGET = 100 * 1024 * 1024;
    var musicPlayer = null, musicCleanup = null, musicPending = null;
    var musicCurrent = null, musicCurrentUrl = '', musicObjectUrl = '';
    var musicPhase = 'idle', musicMessage = '', musicProgress = '';
    var musicGeneration = 0, musicMode = 'order', musicRandomBag = [], musicSeekDragging = null;
    var musicFailures = new Map(), musicHandledFailureGeneration = -1;
    var linkDialogContext = null;

    function isAudioUiTarget(target) {
        var el = target && (target.nodeType === 1 ? target : target.parentElement);
        return !!(el && el.closest && el.closest('[data-md-audio-ui]'));
    }

    function musicTracks() {
        return Array.prototype.filter.call(editor.querySelectorAll('[data-md-audio]'), function (block) {
            return !!audioUrl(block.getAttribute('data-audio-src'));
        });
    }

    function musicTime(value) {
        if (!isFinite(value) || value < 0) return '--:--';
        value = Math.floor(value);
        return (value >= 3600 ? Math.floor(value / 3600) + ':' : '') +
            String(Math.floor(value / 60) % 60).padStart(2, '0') + ':' + String(value % 60).padStart(2, '0');
    }

    function touchMusicCache(url) {
        var entry = musicCache.get(url);
        if (entry) { musicCache.delete(url); musicCache.set(url, entry); }
        return entry;
    }

    function trimMusicCache(protectedUrl) {
        // 已完成缓存的软预算；当前音频可暂时超过预算，切走后优先释放。
        var keys = Array.from(musicCache.keys());
        for (var i = 0; musicCacheBytes > MUSIC_CACHE_BUDGET && i < keys.length; i++) {
            var url = keys[i];
            if (url === protectedUrl || url === musicCurrentUrl) continue;
            var entry = musicCache.get(url);
            musicCache.delete(url);
            musicCacheBytes -= entry.size;
            URL.revokeObjectURL(entry.objectUrl);
        }
    }

    function clearMusicSource() {
        if (musicCleanup) { musicCleanup(); musicCleanup = null; }
        if (musicPlayer) {
            musicPlayer.pause();
            musicPlayer.removeAttribute('src');
            musicPlayer.load();
        }
        musicObjectUrl = '';
    }

    function cancelMusicDownload(keepUrl) {
        var task = musicPending;
        if (task && task.url !== keepUrl) {
            task.controller.abort();
            if (musicPending === task) musicPending = null;
        }
    }

    function stopAudioPlayback() {
        musicGeneration++;
        cancelMusicDownload('');
        clearMusicSource();
        musicCurrent = null;
        musicCurrentUrl = '';
        musicPhase = 'idle';
        musicMessage = musicProgress = '';
        musicRandomBag = [];
        musicFailures.clear();
        musicHandledFailureGeneration = -1;
        musicSeekDragging = null;
        trimMusicCache('');
        syncAudioPlayers();
    }

    function syncAudioPlayers() {
        if (musicCurrent && (!editor.contains(musicCurrent) ||
            audioUrl(musicCurrent.getAttribute('data-audio-src')) !== musicCurrentUrl)) {
            stopAudioPlayback();
            return;
        }
        function textAt(block, selector, value) {
            var el = block.querySelector(selector);
            if (el && el.textContent !== value) el.textContent = value;
        }
        musicTracks().forEach(function (block) {
            var active = block === musicCurrent, entry = musicCache.get(block.getAttribute('data-audio-src'));
            var failure = musicFailures.get(block.getAttribute('data-audio-src'));
            var playing = active && musicPhase === 'playing';
            var loading = active && musicPhase === 'loading';
            var state = active ? musicPhase : (failure ? 'error' : (entry ? 'cached' : 'idle'));
            if (block.getAttribute('data-audio-state') !== state) block.setAttribute('data-audio-state', state);
            textAt(block, '[data-audio-action="play"]', loading ? '…' : (playing ? '❚❚' : '▶'));
            var play = block.querySelector('[data-audio-action="play"]');
            if (play) {
                play.setAttribute('aria-label', loading ? '正在下载' : (playing ? '暂停' : (failure ? '重试播放' : '播放')));
                play.setAttribute('aria-busy', loading ? 'true' : 'false');
            }
            var modeName = { order: '顺序', random: '随机', single: '单曲循环' }[musicMode];
            textAt(block, '[data-audio-action="mode"]', modeName);
            var mode = block.querySelector('[data-audio-action="mode"]');
            if (mode) mode.title = '播放模式：' + modeName + '，点击切换';
            var duration = active && musicPlayer ? musicPlayer.duration : (entry && entry.duration);
            var validDuration = isFinite(duration) && duration > 0;
            var currentTime = active && musicPlayer && musicObjectUrl ? musicPlayer.currentTime : 0;
            textAt(block, '[data-audio-time]', musicTime(currentTime) + ' / ' + (validDuration ? musicTime(duration) : '--:--'));
            var seek = block.querySelector('[data-audio-seek]');
            if (seek) {
                seek.disabled = !active || loading || !musicObjectUrl || !validDuration || musicPhase === 'error';
                if (musicSeekDragging !== block) seek.value = validDuration ? String(Math.round(Math.min(1, currentTime / duration) * 1000)) : '0';
                seek.setAttribute('aria-valuetext', musicTime(currentTime) + ' / ' + (validDuration ? musicTime(duration) : '--:--'));
            }
            var statusText = active && loading ? musicProgress :
                (active && (musicPhase === 'error' || musicPhase === 'blocked') ? musicMessage :
                    (failure ? failure.message + (failure.skipped ? ' · 已跳过，点击播放重试' : ' · 点击播放重试') : (entry ? '已缓存' : '')));
            textAt(block, '[data-audio-status]', statusText);
            var statusLabel = block.querySelector('[data-audio-status]');
            if (statusLabel && statusLabel.title !== statusText) statusLabel.title = statusText;
        });
    }

    function downloadMusic(url) {
        var cached = touchMusicCache(url);
        if (cached) return Promise.resolve(cached);
        if (musicPending && musicPending.url === url && !musicPending.controller.signal.aborted) return musicPending.promise;
        cancelMusicDownload(url);
        var task = { url: url, controller: new AbortController(), promise: null };
        musicPending = task;
        task.promise = (async function () {
            var response = await fetch(url, { signal: task.controller.signal, mode: 'cors', credentials: 'omit' });
            if (!response.ok) throw new Error('下载失败（HTTP ' + response.status + '）');
            if (response.status === 206) throw new Error('音频地址只返回了部分文件，请更换完整音频直链');
            if (response.type === 'opaque') throw new Error('音频地址未允许跨域下载');
            var total = Number(response.headers.get('content-length')) || 0, loaded = 0, blob, lastProgress = 0;
            function progress() {
                if (musicPending !== task || musicCurrentUrl !== url || musicPhase !== 'loading') return;
                var now = Date.now();
                if (now - lastProgress < 100) return;
                lastProgress = now;
                musicProgress = total > 0 ? '下载中 ' + Math.min(99, Math.floor(loaded / total * 100)) + '%' :
                    '下载中 ' + (loaded / 1048576).toFixed(1) + ' MB';
                syncAudioPlayers();
            }
            if (response.body && response.body.getReader) {
                var reader = response.body.getReader(), chunks = [];

                    var chunk = await reader.read();

                    if (task.controller.signal.aborted) throw new DOMException('下载已取消', 'AbortError');
                    chunks.push(chunk.value); loaded += chunk.value.byteLength; progress();

            } else {
                blob = await response.blob();
            }
            if (task.controller.signal.aborted) throw new DOMException('下载已取消', 'AbortError');
            if (!blob.size) throw new Error('音频文件为空');
            var entry = { blob: blob, objectUrl: URL.createObjectURL(blob), size: blob.size, duration: 0 };
            musicCache.set(url, entry); musicCacheBytes += entry.size;
            trimMusicCache(url);
            return entry;
        })().finally(function () { if (musicPending === task) musicPending = null; });
        return task.promise;
    }

    function shuffleMusic(tracks) {
        for (var i = tracks.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1)), swap = tracks[i]; tracks[i] = tracks[j]; tracks[j] = swap;
        }
        return tracks;
    }

    function uniqueMusicTracks() {
        var seen = new Set();
        return musicTracks().filter(function (block) {
            var url = block.getAttribute('data-audio-src');
            if (seen.has(url)) return false;
            seen.add(url); return true;
        });
    }

    function resetRandomMusic() {
        musicRandomBag = shuffleMusic(uniqueMusicTracks().filter(function (block) {
            var url = block.getAttribute('data-audio-src');
            return url !== musicCurrentUrl && !musicFailures.has(url);
        }));
    }

    function nextMusicTrack() {
        var tracks = musicTracks();
        if (!tracks.length) return null;
        function playable(block) { return !musicFailures.has(block.getAttribute('data-audio-src')); }
        if (musicMode === 'single') return musicCurrent && playable(musicCurrent) ? musicCurrent : null;
        if (musicMode === 'order') {
            var start = tracks.indexOf(musicCurrent);
            for (var i = 1; i <= tracks.length; i++) {
                var next = tracks[(start + i) % tracks.length];
                if (playable(next)) return next;
            }
            return null;
        }
        var allUnique = uniqueMusicTracks(), unique = allUnique.filter(playable);
        if (!unique.length) return null;
        // 原本有多首、现只剩一首可用时，继续播放这一首，避免反复请求失效地址。
        if (unique.length < 2) return allUnique.length > 1 ? unique[0] : null;
        musicRandomBag = musicRandomBag.filter(function (block) { return unique.indexOf(block) >= 0; });
        if (!musicRandomBag.length) {
            musicRandomBag = shuffleMusic(unique.slice());
            // 新一轮的第一首不紧接着重复上一首。
            if (musicRandomBag[musicRandomBag.length - 1].getAttribute('data-audio-src') === musicCurrentUrl) {
                var swap = musicRandomBag[0];
                musicRandomBag[0] = musicRandomBag[musicRandomBag.length - 1];
                musicRandomBag[musicRandomBag.length - 1] = swap;
            }
        }
        return musicRandomBag.pop();
    }

    function handleMusicFailure(error, generation, block) {
        if (generation !== musicGeneration || musicCurrent !== block || !editor.contains(block) ||
            musicHandledFailureGeneration === generation) return;
        if (error.name === 'AbortError') { musicPhase = 'paused'; syncAudioPlayers(); return; }
        if (error.name === 'NotAllowedError') {
            musicPhase = 'blocked'; musicMessage = '已下载，点击播放继续'; syncAudioPlayers(); return;
        }
        // 媒体 error 与 play() 拒绝可能同时出现，一次播放尝试只跳过一次。
        musicHandledFailureGeneration = generation;
        var url = musicCurrentUrl;
        var message = error.name === 'NotSupportedError' ? '无法播放此音频格式，请更换地址' :
            (error instanceof TypeError ? '下载失败，请检查网络及音频地址是否允许跨域下载' : (error.message || '音频播放失败'));
        musicFailures.set(url, { message: message, skipped: musicMode !== 'single' });
        clearMusicSource();
        // 解码失败的完整文件也不复用；先断开播放器，再释放该缓存。
        var entry = musicCache.get(url);
        if (entry) {
            musicCache.delete(url); musicCacheBytes -= entry.size; URL.revokeObjectURL(entry.objectUrl);
        }
        musicPhase = 'error'; musicMessage = message + ' · 点击播放重试';
        if (musicMode === 'single') { syncAudioPlayers(); return; }
        var next = nextMusicTrack();
        if (next) {
            syncAudioPlayers();
            startMusicTrack(next, true, true);
        } else {
            musicMessage = message + ' · 没有其他可播放的音乐，请点击播放重试或修改地址';
            syncAudioPlayers();
        }
    }

    function bindMusicSource(block, entry, generation) {
        if (musicCleanup) musicCleanup();
        var player = musicPlayer, listeners = [];
        function valid() { return generation === musicGeneration && musicCurrent === block && editor.contains(block) && musicObjectUrl === entry.objectUrl; }

            player.addEventListener(name, handler); listeners.push([name, handler]);

        on('timeupdate', syncAudioPlayers);
        on('durationchange', function () { if (isFinite(player.duration)) entry.duration = player.duration; syncAudioPlayers(); });
        on('loadedmetadata', function () { entry.duration = player.duration; syncAudioPlayers(); });
        on('playing', function () { if (!player.paused) { musicPhase = 'playing'; musicMessage = ''; syncAudioPlayers(); } });
        on('pause', function () { if (player.paused && musicPhase === 'playing' && !player.ended) { musicPhase = 'paused'; syncAudioPlayers(); } });
        on('ended', function () {
            musicPhase = 'ended';
            var next = nextMusicTrack();
            if (next) startMusicTrack(next, true, true);
            else syncAudioPlayers();

        on('error', function () {
            handleMusicFailure(new Error('无法播放此音频，请检查文件或更换地址'), generation, block);
        });
        musicCleanup = function () { listeners.forEach(function (pair) { player.removeEventListener(pair[0], pair[1]); }); };
    }

    async function startMusicTrack(block, restart, automatic) {
        if (!block || !editor.contains(block)) return;
        var url = audioUrl(block.getAttribute('data-audio-src'));
        if (!url) return;
        if (!automatic) musicFailures.delete(url);

        var generation = ++musicGeneration;
        cancelMusicDownload(url);
        if (!resume) clearMusicSource();
        musicCurrent = block; musicCurrentUrl = url;
        trimMusicCache(url);

        if (!automatic && musicMode === 'random') resetRandomMusic();
        syncAudioPlayers();
        try {
            var entry = await downloadMusic(url);
            if (generation !== musicGeneration || musicCurrent !== block || !editor.contains(block)) return;
            if (!musicPlayer) { musicPlayer = document.createElement('audio'); musicPlayer.preload = 'none'; }
            musicObjectUrl = entry.objectUrl;
            if (!resume || musicPlayer.getAttribute('src') !== entry.objectUrl) {
                musicPlayer.src = entry.objectUrl;
                musicPlayer.load();
            }
            musicPlayer.loop = musicMode === 'single';
            bindMusicSource(block, entry, generation);
            if (restart && isFinite(musicPlayer.duration)) musicPlayer.currentTime = 0;
            musicPhase = 'ready'; syncAudioPlayers();

        }

    function toggleMusic(block) {

    }

    function changeMusicMode() {

        musicMode = modes[(modes.indexOf(musicMode) + 1) % modes.length];

        if (musicMode === 'random') resetRandomMusic();
        syncAudioPlayers();
    }

    function seekMusic(input, block) {

    }

    function openLinkDialog(block) {
        if (isReadOnly()) return;

        var sel = window.getSelection(), range = null;
        if (!rawMode && sel && sel.rangeCount && isEditorTextPoint(sel.anchorNode) && isEditorTextPoint(sel.focusNode)) range = sel.getRangeAt(0).cloneRange();
        else if (!rawMode && lastEditorRange && isEditorTextPoint(lastEditorRange.startContainer) && isEditorTextPoint(lastEditorRange.endContainer)) range = lastEditorRange.cloneRange();
        if (!block && !rawMode && range && !range.collapsed) {
            var selectedMusic = musicTracks().filter(function (audio) { return range.intersectsNode(audio); });
            if (selectedMusic.length) {
                var content = range.cloneContents();
                Array.prototype.forEach.call(content.querySelectorAll('[data-md-audio]'), function (audio) { audio.remove(); });
                if (selectedMusic.length !== 1 || content.textContent.replace(/[\u200b\u00a0]/g, ' ').trim() ||
                    content.querySelector('img,hr,pre,table,ul,ol,input')) {

    function submitLinkDialog(e) {

    function bindAudioPlayers() {
        editor.addEventListener('click', function (e) {
            var target = e.target.nodeType === 1 ? e.target : e.target.parentElement;
            var audio = target && target.closest('[data-md-audio]');
            if (!audio) return;
            var button = target && target.closest('button[data-audio-action]');
            if (!button) {
                // 点击名称或卡片空白即选中音乐块，工具栏排版应作用于这首音乐。
                if (isReadOnly() || target.closest('input,a')) return;
                e.preventDefault();
                editor.focus({ preventScroll: true });
                var range = document.createRange(); range.selectNode(audio);
                var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
                hideImageBar(); rememberEditorSelection(); syncLayoutButtons();
                return;
            }
            var block = button.closest('[data-md-audio]'); e.preventDefault();
            if (!block) return;
            var action = button.getAttribute('data-audio-action');
            if (action === 'play') toggleMusic(block);
            else if (action === 'mode') changeMusicMode();
            else if (!isReadOnly() && action === 'edit') openLinkDialog(block);
            else if (!isReadOnly() && action === 'delete') {
                rememberEditorHistoryBoundary();
                if (block === musicCurrent) stopAudioPlayback();
                block.remove(); ensureTail(); syncEmpty(); syncAudioPlayers(); scheduleSave('audio');
            }
        });
        editor.addEventListener('pointerdown', function (e) {
            if (e.target.matches && e.target.matches('[data-audio-seek]')) musicSeekDragging = e.target.closest('[data-md-audio]');
        });
        ['pointerup', 'pointercancel'].forEach(function (name) {
            document.addEventListener(name, function () { if (musicSeekDragging) { musicSeekDragging = null; syncAudioPlayers(); } });
        });
        editor.addEventListener('input', function (e) {
            if (e.target.matches && e.target.matches('[data-audio-seek]')) seekMusic(e.target, e.target.closest('[data-md-audio]'));
        });
        editor.addEventListener('change', function (e) {
            if (e.target.matches && e.target.matches('[data-audio-seek]')) { musicSeekDragging = null; seekMusic(e.target, e.target.closest('[data-md-audio]')); }
        });
        $('linkForm').addEventListener('submit', submitLinkDialog);
        $('linkCancel').addEventListener('click', function () { closeLinkDialog(true); });
        $('requestMethod').addEventListener('change',syncCardDialog);
        editor.addEventListener('click',function(e){var action=e.target.closest&&e.target.closest('[data-request-action]');if(!action)return;var block=action.closest('[data-md-request]');if(!block)return;e.preventDefault();if(!isReadOnly())openRequestDialog(block);else if(action.dataset.requestAction==='send')sendRequestButton(block);});
        editor.addEventListener('click',function(e){var anchor=e.target.closest&&e.target.closest('a[data-md-card]');if(anchor&&!isReadOnly()){e.preventDefault();openCardDialog(anchor);}});

        var backdropPointer = null;

        });
        $('linkDialog').addEventListener('pointermove', function (e) {

        });

    /* ================= 编辑器交互 ================= */

    // 从光标节点往上找到最近的块级元素（p/div/pre/blockquote/h1-h6）
    function blockOf(node) {
        var el = node && node.nodeType === 1 ? node : (node ? node.parentNode : null);
        while (el && el !== editor) {
            var t = el.tagName ? el.tagName.toLowerCase() : '';
            if (t === 'p' || t === 'div' || t === 'pre' || t === 'blockquote' || /^h[1-6]$/.test(t)) return el;
            el = el.parentNode;
        }
        return null;
    }

    function preOf(node) {
        var el = node && (node.nodeType === 1 ? node : node.parentElement);
        var pre = el && el.closest('pre');
        return pre && editor.contains(pre) ? pre : null;
    }

    // 浏览器偶尔把相邻光标落进 contenteditable=false 的音乐外壳；输入应落在其前后段落。
    function moveCaretOutsideAudio() {
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount || !sel.isCollapsed) return;
        var range = sel.getRangeAt(0), node = range.startContainer;
        if (!editor.contains(node) || isAudioUiTarget(node)) return;
        var el = node.nodeType === 1 ? node : node.parentElement;
        var block = el.closest('[data-md-audio]');
        if (!block) return;
        var prefix = document.createRange(); prefix.selectNodeContents(block);
        prefix.setEnd(range.startContainer, range.startOffset);
        var after = !!prefix.cloneContents().querySelector('[data-md-audio-ui]');
        var p = after ? block.nextElementSibling : block.previousElementSibling;
        if (!isEmptyEditableParagraph(p)) {
            p = document.createElement('p'); p.appendChild(document.createElement('br'));
            block.parentNode.insertBefore(p, after ? block.nextSibling : block);
        }
        range = document.createRange(); range.selectNodeContents(p); range.collapse(true);
        sel.removeAllRanges(); sel.addRange(range);
    }

    function listItemOf(node) {
        var el = node && node.nodeType === 1 ? node : (node ? node.parentNode : null);
        while (el && el !== editor) {
            if (el.tagName && el.tagName.toLowerCase() === 'li') return el;
            el = el.parentNode;
        }
        return null;
    }

    // 标题行首的回车和删除是块格式操作，不能交给浏览器复制标题或合并上一行。
    function tryHeadingBoundary(action) {
        var sel = window.getSelection();
        if (!sel || !sel.rangeCount || !sel.isCollapsed) return false;
        var caret = sel.getRangeAt(0), node = caret.startContainer;
        if (!editor.contains(node)) return false;
        var el = node.nodeType === 1 ? node : node.parentElement;
        if (!el || el.closest('pre,td,th')) return false;
        var heading = el.closest('h1,h2,h3,h4,h5,h6');
        if (!heading || !editor.contains(heading)) return false;
        var head = document.createRange();
        head.selectNodeContents(heading);
        head.setEnd(caret.startContainer, caret.startOffset);
        var before = head.cloneContents();
        var empty = !heading.textContent.replace(/\u200b/g, '').trim() && !heading.querySelector('img');
        var prefix = head.toString().replace(/\u200b/g, '');
        if ((empty ? prefix.trim() : prefix) || before.querySelector('img') || (!empty && before.querySelector('br'))) return false;

        if (action === 'enter' && !empty) {
            // 直接在标题前插一段，不让原生命令重排相邻音乐和其它块。
            var originalCaret = caret.cloneRange();
            var blank = document.createElement('p'); blank.appendChild(document.createElement('br'));
            heading.parentNode.insertBefore(blank, heading);
            sel.removeAllRanges();
            sel.addRange(originalCaret);
            rememberEditorSelection();
            return true;
        }
        // 仅将当前标题换成普通段落，保留所有文字、软换行与行内格式。
        var paragraph = document.createElement('p');
        while (heading.firstChild) paragraph.appendChild(heading.firstChild);
        if (!paragraph.firstChild) paragraph.appendChild(document.createElement('br'));
        heading.replaceWith(paragraph);
        var restored = document.createRange(); restored.selectNodeContents(paragraph); restored.collapse(true);
        sel.removeAllRanges(); sel.addRange(restored);
        rememberEditorSelection();
        return true;
    }

    function markTaskItem(li, checked) {
        if (!li) return;
        li.setAttribute('data-task', checked ? 'done' : 'todo');
        // 同步原记号：勾上时若还没有「已勾选」记号就补 x；取消勾选则回到空格
        var mark = li.getAttribute('data-mark');
        if (checked) {
            if (!isDoneMark(mark)) li.setAttribute('data-mark', 'x');
        } else {
            li.setAttribute('data-mark', ' ');
        }
        var box = li.querySelector(':scope > input[type="checkbox"]');
        if (!box) {
            box = document.createElement('input');
            box.type = 'checkbox';
            box.tabIndex = -1;
            li.insertBefore(box, li.firstChild);
            li.insertBefore(document.createTextNode(' '), box.nextSibling);
        }
        box.checked = !!checked;
        if (checked) box.setAttribute('checked', ''); else box.removeAttribute('checked');
    }

    // 跳出代码块：光标落到 pre 后面那个段落里（没有段落就补一个）。
    // 空的代码块（内容里一个字符都没有）顺手删掉 —— 留着一个 ```\n``` 空块只会碍事。
    function exitPre(pre) {
        var sel = window.getSelection();
        var next = pre.nextSibling;
        var empty = !pre.textContent.replace(/[\u00a0 ]/g, '');
        var p = null;
        if (isEmptyEditableParagraph(next)) {
            p = next;
        } else {
            p = document.createElement('p');
            p.appendChild(document.createElement('br'));
            p.setAttribute('data-tail', '1');   // 只是光标落点，不是用户留的白
            pre.parentNode.insertBefore(p, next);
        }
        if (empty) pre.parentNode.removeChild(pre);
        var nr = document.createRange();
        nr.setStart(p, 0);
        nr.collapse(true);
        sel.removeAllRanges();
        sel.addRange(nr);
        return true;
    }

    // 在「列表第一项」的最前面按回车：浏览器会把这一项拆出一个空 <li>。
    // 空列表项在 Markdown 里没有表示法（序列化成一个裸 '-'，还被规范化掉），
    // 用户实际想要的是「列表上方留一行白」→ 改成在列表前插一个空段落。
    // 只在「列表第一项 + 光标贴在最前面」时接管，列表内部回车照旧。
    function enterBeforeListFirstItem(e) {
        var sel = window.getSelection();
        if (!sel.rangeCount) return false;
        var range = sel.getRangeAt(0);
        var li = listItemOf(range.startContainer);
        if (!li || !li.parentNode || !/^(ul|ol)$/i.test(li.parentNode.tagName)) return false;
        if (li.parentNode.children[0] !== li) return false;   // 必须是第一项
        if (!li.textContent.trim()) return false;             // 空项：交给浏览器按它的规则处理
        var head = range.cloneRange();
        head.selectNodeContents(li);
        try { head.setEnd(range.startContainer, range.startOffset); } catch (err) { return false; }
        if (head.toString().replace(/[\n\u00a0\u200b ]/g, '')) return false;  // 光标得在内容最前面

        e.preventDefault();
        var p = document.createElement('p');
        p.appendChild(document.createElement('br'));
        li.parentNode.parentNode.insertBefore(p, li.parentNode);
        var nr = document.createRange();
        nr.setStart(p, 0);
        nr.collapse(true);
        sel.removeAllRanges();
        sel.addRange(nr);
        return true;
    }

    // 代码块里的回车：只插真实换行（textContent 不认 <br>，不转成文本节点的话
    // 整段代码会被压成一行 —— 这就是「代码块保存后刷新格式就没了」的根因）。
    // 🔴 不做「末尾空行再按回车就跳出代码块」：代码里本来就要能敲空行，
    //    否则连按两次回车（= 一个空行）光标就被弹出代码块了（用户报的 bug）。
    // 出口改成两个明确动作：① 空代码块里按回车（顺手把这个空块删掉）；② Ctrl/Cmd+Enter。
    function handleEnterInPre(e) {
        var sel = window.getSelection();
        if (!sel.rangeCount) return false;
        var range = sel.getRangeAt(0);
        var pre = preOf(range.startContainer);
        if (!pre) return false;
        e.preventDefault();

        // 判空用 textContent（<br> 不算文本）：新建的空代码块里只有占位 <br> →
        // 直接跳出去；只要敲过一个换行/字符就不算空，回车继续在该块里加行。
        if (!pre.textContent.replace(/[\u00a0 ]/g, '')) return exitPre(pre);

        var tn = document.createTextNode('\n');

    function wrapSelection(tag) {

    var imageBar = null;

    function askImageWidth(current) {

    function hideImageBar() {

    function setNoteImageWidth(width) {

    function ensureImageBar() {

            '<button type="button" data-image-action="close" aria-label="关闭图片设置">×</button>';

            if (!button) return;

            if (!selectedNoteImage || !editor.contains(selectedNoteImage)) { hideImageBar(); return; }
